l_english:
 MOR_protectorate_administration_category: "Activities of the Special Protectorate Directorate"
 MOR_protectorate_administration_category_desc: "Colonial affairs are the business of the Ministry of the Colonies, but Tunisia and Morocco are protectorates and are therefore run by the Ministry of Foreign Affairs, which has created a separate division to oversee the protectorates. It is through this division that Paris influences the Residents-General and the general picture of events in the protectorates."
 MOR_recall_ponsot: "Recall the Soft-Hearted Ponsot as Resident-General of Morocco"
 MOR_recall_ponsot_desc: "Ponsot is a diplomat rather than a soldier, and where a hard answer was required he tried to manoeuvre. To Paris such softness threatens the protectorate itself, so the Resident ought to be replaced by a man who has already crushed nationalists in Tunisia. Historically taken on 22 March 1936."
 MOR_recall_peyrouton: "Recall Peyrouton from the Government of Morocco"
 MOR_recall_peyrouton_desc: "The «resident-satrap» will not compromise even where compromise is cheaper than blood: his refusal to press the labour reform undoes the entire line taken by Paris. His replacement should be a soldier who can both fight and negotiate. Historically taken on 16 September 1936."
 mor_resident.1.t: "Auguste Henri Ponsot Dismissed as Resident-General of Morocco"
 mor_resident.1.d: "The government of the French Republic has formally dismissed Auguste Henri Ponsot from the post of Resident-General for his excessively soft policy towards the Moroccan nationalists. A couple of years ago the local elites presented the «Plan of Moroccan Reforms», and Ponsot, a diplomat rather than a soldier, tried to manoeuvre where a hard answer was required.\n\nSuch weakness, plainly, could cost France her protectorate — and that was unacceptable.\n\nTo restore firm order in Morocco and put an end to the political activity of the local elites, Paris has decided to replace Ponsot with Marcel Peyrouton. Peyrouton had already «distinguished» himself by the ruthless and efficient suppression of the nationalist movement in Tunisia, and will presumably deal with these problems as well."
 mor_resident.1.a: "We Need Firm Hands in the Protectorates"
 mor_resident.1.a.tt: "Morocco: the Sultan's influence loses 10 %, autonomy loses 100 points, and Bernard Marcel Peyrouton takes over the authoritarian force of the protectorate."
 mor_resident.1.b: "Striking a Bargain with This Man Will Be Far Harder"
 mor_resident.2.t: "Peyrouton Recalled from the Government of Morocco"
 mor_resident.2.d: "Barely installed, Peyrouton was quick to justify his nickname of the «resident-satrap». In his not very long time as Resident-General the better part of the Moroccans came to hate him, and the rest were ready to shoot him on sight.\n\nTo the regret of the French government, he would not go even for the smallest compromise with the government, refusing to press the labour reform. That was unacceptable, and so Peyrouton was quickly dismissed from the post of Resident-General in favour of the more obliging Charles Noguès — who had fought better, having served in the Rif campaign, and was a more flexible politician."
 mor_resident.2.a: "We Need a Whole Protectorate, Not Its Ruins"
 mor_resident.2.a.tt: "Morocco: the Sultan's influence loses 10 %, and Charles Noguès takes over the authoritarian force of the protectorate."
 mor_resident.2.b: "We Can Breathe a Little Easier!"
 mor_resident.2.b.tt: "Charles Noguès leaves the French army and becomes a field marshal of Morocco."
 mor_autonomy_reason_peyrouton: "Peyrouton's Appointment as Resident-General"
