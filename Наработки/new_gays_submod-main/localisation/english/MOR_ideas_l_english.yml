l_english:
 mor_agrarian_country: "Agrarian Country"
 mor_agrarian_country_desc: "Despite the agrarian reforms carried out inside the Moroccan administration, France suppresses every attempt at industrialisation, keeping heavy and military industry in its own hands. Technology advances in farming stay with the colonists, while the fellahin are forced to make do with manual labour."
 mor_uneducated_population: "Uneducated Population"
 mor_uneducated_population_desc: "A deliberate attempt was made to weaken the influence of Islam over the population. The Berbers were the first target, since they were considered less Islamised than the Arabs. From 1914 onwards a special Berber policy pursued exactly this goal: Berber regions were withdrawn from the control of the Makhzen, and Quranic and Arab schools were closed as part of the same policy. Meanwhile the authorities did nothing to open French schools in their place. As a result, by 1936 no more than 2% of children attended any school at all."
 mor_divided_country: "A Torn Country"
 mor_divided_country_desc: "Spain and France have in effect torn our country in two. The larger part, made a French protectorate, became known as Morocco proper, while the Sahara, the south and the Rif mountains passed to Spain under the name of Spanish Morocco. Yet this division has only welded Moroccans closer together around a single new goal — to reunite their country.\n§RIt will disappear as soon as Morocco is unified.§!"
 mor_treaty_of_fes_violated: "The Violated Treaty of Fes"
 mor_treaty_of_fes_violated_desc: "The Treaty of Fes was signed under duress by Sultan Abd al-Hafid and the French diplomat Eugène Regnault on 30 March 1912. It established the French protectorate over Morocco and granted France the right to occupy parts of the country under the pretext of protecting the Sultan from internal opposition, holding real power while keeping up the mask of indirect rule carried by the Sultan and the Sharifian government. According to the treaty the French Resident-General held absolute authority in both foreign and internal affairs and was the only party entitled to represent Morocco abroad. The Sultan, however, retained the right to sign dahirs presented to him by the Resident-Generals. Today, taking advantage of the Sultan's youth and of the absence of Moroccans from government, the French openly spit on the Treaty of Fes and come close to ruling directly — while the nationalists presented in 1934 a treaty meant to correct its imbalance in France's favour.\n§RIt will disappear as soon as Morocco gains independence.§!"
 mor_broken_army: "The Moroccan Army"
 mor_broken_army_desc: "The land army of Morocco in the protectorate era is a faithful mirror of the wretched state it found itself in. The period was of enormous importance for Morocco and its people, yet the fate of its army left everything to be desired. The protectorate years were marked by the unjust interference of foreign powers in Moroccan affairs, which weighed heavily on the development and training of the country's armed forces. The army suffered from a shortage of modern weapons, ammunition, trained personnel and proper tactical schooling. Lack of funds and limited resources made its activity ineffective. Bases and infrastructure were in a deplorable condition, limiting training, mobility and communications, while the failure to pay for the health and welfare of the soldiers drained both their fighting power and their discipline."

 # ------------------------------------------------------------
 #  Step 9. Spirits of Red June, the November crisis and the bad harvest.
 #  Granted by events/MOR dated events (Morocco).txt
 # ------------------------------------------------------------
 mor_aftermath_of_red_june_light: "Aftermath of Red June"
 mor_aftermath_of_red_june_light_desc: "The COSUMA strike paralysed the port industry of Casablanca, and the concessions wrung from its leaders cost the treasury both money and prestige. Docks and factories are repaired slowly, and the population has learned that the street can be listened to.\n§RConstruction speed -10 %, stability -5 %.§!"
 mor_aftermath_of_red_june_medium: "Aftermath of Red June"
 mor_aftermath_of_red_june_medium_desc: "Getting the Houribgha mines reopened meant accepting unions and bonuses. Phosphate moves to export again, but the price of those concessions weighs on the whole economy of the protectorate.\n§RConstruction speed -10 %, stability -10 %, resource extraction efficiency -50 %.§!"
 mor_aftermath_of_red_june_heavy: "Aftermath of Red June"
 mor_aftermath_of_red_june_heavy_desc: "The country has conceded everything Red June demanded. The administration is demoralised, orders are frozen and the Atlas mines run at half strength — and that is still a modest price for the absence of barricades.\n§RConstruction speed -15 %, stability -15 %, resource extraction efficiency -75 %.§!"
 mor_workers_unrest_in_casablanca: "Workers' Unrest in Casablanca"
 mor_workers_unrest_in_casablanca_desc: "Baton and bayonet cleared the picket lines but did not cancel the causes of the strike. The shops run at half heat: the foremen fear the machines, and the Moroccan foremen fear their own workers.\n§RProduction efficiency cap and gain -10 %, stability -5 %.§!"
 mor_workers_unrest_in_casablanca_and_atlas: "Workers' Unrest in Casablanca and the Atlas"
 mor_workers_unrest_in_casablanca_and_atlas_desc: "The Foreign Legion returned the mines to their owners but sent several thousand funeral processions into the Atlas. Extraction has stopped, and every attempt to blow up a train reminds us of Houribgha.\n§RProduction efficiency cap and gain -15 %, stability -10 %, resource extraction efficiency -100 %.§!"
 mor_communist_split_from_fcp: "Communist Party Splits from the PCF"
 mor_communist_split_from_fcp_desc: "The secret congress in the slums of Casablanca broke with Paris: the Moroccan communists are no longer a section of the PCF but a party with its own programme and its own unions. To the working class that sounds more convincing than any resolution of the Residency.\n§RCommunism drift +0.2 per day.§!"
 mor_november_crisis: "November Crisis"
 mor_november_crisis_desc: "We must settle our attitude towards the nationalists before we are forced to decide for us. Rabat, Fez and Marrakesh wait for an answer to the “Plan of Reforms”, and every day of delay convinces the Moroccans that the Residency can be pushed around by the street.\n§RStability -10 %, political power gain -25 %.§!"
 mor_harvest_failure: "Year of Failed Harvests"
 mor_harvest_failure_desc: "There was no rain. Price controls on bread and flour saved the towns from speculators but could not save the fellahin: without subsidies and seed grain the village eats its seed stock, and the harvest returns look less and less like the truth.\n§RPopulation growth -50 %, stability -10 %.§!"

