 mor_phosphate_monopoly: "Phosphate Monopolist"
 mor_railway_company: "Railway Company"
 mor_coal_mines_of_jerada: "Coal Mines of Jerada"
 mor_zellidja_mining_company: "Mining Concern"
 mor_omnium_nord_africain_construction: "Construction Concern"
 mor_energie_electrique_du_maroc_power: "Electric Power Concern"

 # ================= MOROCCO: MILITARY INDUSTRIAL ORGANIZATIONS =================
 MOR_compagnie_de_transports_au_maroc_organization: "Compagnie de Transports au Maroc"
 MOR_compagnie_de_transports_au_maroc_organization_desc: "The protectorate's largest garage, taxi fleet and trucking concession — the only place in Morocco where engines, chassis and drivers are gathered in one yard. Its workshops learn quickly to build what they used merely to repair."
 MOR_societe_des_ports_marocains_organization: "Société des Ports Marocains"
 MOR_societe_des_ports_marocains_organization_desc: "Docks, slipways, cranes and repair sheds of Casablanca, Tangier and Mogador. A hull damaged at sea comes here to be cut open, patched and sent back to sea again — sometimes as something rather different from what arrived."
 MOR_etablissements_industriels_de_casablanca_organization: "Établissements Industriels de Casablanca"
 MOR_etablissements_industriels_de_casablanca_organization_desc: "Foundries, machine shops and assembly bays on the edge of the European quarter, built to repair colonial railway stock. Chassis, tracks and petrol engines are all within their reach — the step from tractor to infantry tank is short."
 MOR_casablanca_anfa_breguet_organization: "Casablanca-Anfa Aerodrome & Breguet Works"
 MOR_casablanca_anfa_breguet_organization_desc: "An Atlantic seaplane base and the Breguet maintenance works beside it, where flying boats of the Aéropostale are overhauled between Dakar and Toulouse. Light airframes, floats and observation machines are their bread and butter."


 # ================= MOROCCO: MINISTERS =================
 MOR_muhammad_al_muqri: "Muhammad al-Muqri"
 MOR_muhammad_al_muqri_desc: "Grand Vizier to a sultan who rules on paper, he holds the seal through which every dahir must pass. Diligent, indispensable and utterly disloyal — he serves the Makhzen as an institution rather than the man sitting on the throne, and he has made sure that while he sits in council no advisor may be bought cheaply."
 MOR_taieb_al_muqri: "Taieb al-Muqri"
 MOR_taieb_al_muqri_desc: "Keeper of the Makhzen's ledgers and of its embarrassments. He squeezes taxes and customs out of a countryside that has nothing left to give, pays the indemnities Paris demands, and still finds coin for the palaces. Competent in a way no reformer will ever call honest."
 MOR_thami_al_muqri: "Thami al-Muqri"
 MOR_thami_al_muqri_desc: "The first Moroccan ever trained as an agronomy engineer, educated in France and returned home to measure soil the government has never looked at. He speaks of irrigation, crop rotation and salinity in a country where a fellah still plants what his grandfather planted — and he is right about every word."
 MOR_ahmed_bargach: "Ahmed Bargach"
 MOR_ahmed_bargach_desc: "Minister of Education in a state that has almost no schools. Bargach administers the Quranic schools and the handful of French colleges with equal weariness, well aware that the curriculum is written in Rabat only when Paris permits it."
 MOR_mohammed_mammeri: "Mohammed Mammeri"
 MOR_mohammed_mammeri_desc: "Head of protocol and of the household of the Sharifian court, Mammeri knows which tribal delegation must be seated where, which gift honours a caid and which insults him. Precision of ceremony is the last luxury a sovereign can afford, and he guards it like a treasury."
 MOR_abdelaziz_bendriss_amraoui: "Abdelaziz Bendriss Amraoui"
 MOR_abdelaziz_bendriss_amraoui_desc: "A Rif writer who puts the Atlas into words and the tribes into politics. His essays persuade mountaineers that their language and their loyalty are no contradiction — a useful argument while the plains still argue about who collects their taxes."
 MOR_mohammed_karim_lamrani: "Mohammed Karim Lamrani"
 MOR_mohammed_karim_lamrani_desc: "A merchant prince of Fez who moved from grain to mills to import-export and now sits in the councils of the protectorate's industry without ever asking Paris's permission. He counts in machines rather than in honours, and machines are what this country lacks."
 MOR_tawheed_al_faraj: "Tawheed al-Faraj"
 MOR_tawheed_al_faraj_desc: "An economist of the new school who has read both Adam Smith and the Qur'an and intends to reconcile them. He argues that a country which feeds its workers cheaply buys obedience cheaper still, and that the ledger of a state is a moral document."
 MOR_yisrael_abu_hatzira: "Rabbi Yisrael Abu Hatzira"
 MOR_yisrael_abu_hatzira_desc: "Head of the rabbinical courts of the Moroccan mellahs, descendant of a dynasty of sages and counselor to Jews and Muslims alike. He has no taste for office and a great taste for children, and his rulings keep the ancient Jewish communities of Morocco at peace with their neighbours."
 MOR_moulay_driss_kandoussi: "Moulay Driss Kandoussi"
 MOR_moulay_driss_kandoussi_desc: "A man with relatives in every kasbah and informants in every cafe. Kandoussi turned the Sultan's small police of gossip into something close to an intelligence service, and he reports what he hears without flattering the hearer — a rarity at court."
 MOR_boubker_el_kadiri: "Boubker el-Kadiri"
 MOR_boubker_el_kadiri_desc: "A schoolmaster from a family of religious scholars who learned to run a ministry by running classrooms. He believes a child taught to read in Arabic and to count in French will one day be dangerous to somebody, and he intends it to be dangerous to the right person."
 MOR_ahmed_balafrej: "Ahmed Balafrej"
 MOR_ahmed_balafrej_desc: "Engineer by training, nationalist by calling, and the drafting hand behind the Plan of Reforms of 1934. Balafrej argues with French ministers in flawless Parisian French and never lets them forget that he argues as a Moroccan citizen, not a protected subject."
 MOR_omar_abdeljalil: "Omar Abdeljalil"
 MOR_omar_abdeljalil_desc: "An agronomist turned minister who has spent his life among olive terraces and cereal plains. He knows exactly how much a fellah harvests, how much the colonist takes, and how much a Moroccan state would collect if it stood on its own feet."
 MOR_mohamed_diouri: "Mohamed Diouri"
 MOR_mohamed_diouri_desc: "A lawyer of Fez and a founding spirit of the nationalist youth, Diouri has read the constitutions of every young republic and intends to write a Moroccan one. He argues for parliament, franchise and bill of rights with the patience of a man who expects to be told no a hundred times."
 MOR_mohamed_lyazidi: "Mohamed Lyazidi"
 MOR_mohamed_lyazidi_desc: "Editor, journalist and tireless pamphleteer, Lyazidi writes the arguments that the movement's orators later deliver. He is a liberal in the old sense: convinced that a printed sentence is more durable than a pasha, and that the reader is the only censor worth respecting."
 MOR_abdallah_ibrahim: "Abdallah Ibrahim"
 MOR_abdallah_ibrahim_desc: "A trade unionist from the Casablanca docks who became the movement's man among the workers of the medina. He organises clinics, co-operatives and night schools with the same method he uses for strikes: patiently, in public, and never alone."
 MOR_thami_el_glaoui: "Thami El Glaoui"
 MOR_thami_el_glaoui_desc: "Lord of the Atlas, Pasha of Marrakesh, master of forty thousand tribesmen and of the road that carries phosphates to the coast. El Glaoui backed the Sultan when it was dangerous and kept the mountains quiet when it was profitable; sold his loyalty to the highest bidder and always delivered value for money."
 MOR_mohammed_al_makki_al_nasiri: "Mohammed al-Makki al-Nasiri"
 MOR_mohammed_al_makki_al_nasiri_desc: "A descendant of the great historian al-Nasiri and now head of the religious authority of the Sharifian state. He keeps the kadis, the zawiyas and the Friday sermons aligned with the throne, and treats the defence of the faith as a matter of paperwork as much as of prayer."
 MOR_sidi_ahmed_bin_al_ahmar: "Sidi Ahmed Bin al-Ahmar"
 MOR_sidi_ahmed_bin_al_ahmar_desc: "A scholar of the League of Northern Ulema, who teaches in the madrasas of Tetouan and Fez and insists that a Muslim may learn a European science without ceasing to be a Muslim. His endorsement carries a reformist fatwa's weight among the students of the north."
 MOR_ali_bin_al_ahmar: "Ali Bin al-Ahmar"
 MOR_ali_bin_al_ahmar_desc: "Brother, banker and quiet half of the family business. Ali al-Ahmar moves credit between Fez, Tangier and Algiers through accounts no resident-general has ever seen, and lends to causes he does not discuss — provided they pay, and pay discreetly."
 MOR_muhammed_daoud: "Muhammed Daoud"
 MOR_muhammed_daoud_desc: "Chief of the nationalist scout and youth movement, drilled in formation and taught to read a map as well as a page of Arabic. He turns idle boys of the medina into a parade-ground discipline that any government — friendly or hostile — must count."
 MOR_torres_falangist_imitator_desc: "Torres has watched the Spanish Falange march through Tetouan with its shirts, its liturgy and its promises of a national-syndicalist order, and he has decided that Morocco may borrow the theatre while keeping its own play. His programme is corporatist in form, nationalist in substance, and directed at one audience: the crowd."
 MOR_ouazzani_minister_of_propaganda_desc: "The editor of L'Action Marocaine now speaks for the government instead of against it, and his press knows exactly which string to pull in which neighbourhood. A regime that lets Ouazzani write its bulletins has surrendered the one weapon France always feared — the Moroccan printed word."

 # --- communist ministers ---
 MOR_michel_mazella: "Michel Mazella"
 MOR_michel_mazella_desc: "A Casablanca docker who rose through the French section of the Comintern to run the Moroccan party's underground: safe houses, false papers, courier routes through the medina. He has been arrested twice and organised three strikes since."
 MOR_jean_dresch: "Jean Dresch"
 MOR_jean_dresch_desc: "A surveyor who mapped the Rif for the pacification columns and then handed his sheets to the other side. He knows every mule track, wadi and pass between Taza and Al Hoceima, and a mountain that has been drawn correctly has already been half conquered."
 MOR_michel_colonna: "Michel Colonna"
 MOR_michel_colonna_desc: "Engineer of the port works and syndicalist agitator, now put in charge of the workshops the revolution nationalised. He talks to foremen in the language of the shop floor and gets tonnage out of machines that the old owners swore were scrap."
 MOR_charles_dupuy: "Charles Dupuy"
 MOR_charles_dupuy_desc: "A railwayman from the Fedala line who organised the 1936 strike and now runs the rolling stock, the depots and the supply nodes. He can tell you which junction will hold a division and which one will hold only an excuse."
 MOR_paul_durel: "Paul Durel"
 MOR_paul_durel_desc: "Secretarial chief of the dockers' and porters' unions, a man of meeting minutes and massed pickets. He has learned to count workers the way a quartermaster counts rifles, and the party has never had enough of either."
 MOR_edmond_amran_el_maleh: "Edmond Amran El Maleh"
 MOR_edmond_amran_el_maleh_desc: "A Jewish intellectual from Essaouira who writes for the illegal press in three languages and smuggles the print between them. His sentences carry the whole argument of Moroccan communism: that liberation has no religion and no race."
 MOR_abraham_serfati: "Abraham Serfati"
 MOR_abraham_serfati_desc: "An electrician and technical organiser of the Casablanca soviets, who can bring a stalled turbine back to life and explain, afterwards, why it was the owner's fault. Production figures follow him around like a rumour."
 MOR_ali_yata: "Ali Yata"
 MOR_ali_yata_desc: "A Berber worker from Mazagan turned party organiser, patient, doctrinally nimble and tireless. He does the work nobody photographs: cards, cells, funds, funerals — the machinery on which every revolution actually runs."
 MOR_mohammed_ferhat: "Mohammed Ferhat"
 MOR_mohammed_ferhat_desc: "Editor of the party's Arabic-language edition, who rewrites Marx into proverbs the medina can argue about over mint tea. He has been prosecuted for a headline more often than most men have been prosecuted at all."
 MOR_fortune_sultan: "Fortune Sultan"
 MOR_fortune_sultan_desc: "Wife of Leon Sultan, journal editor and the organising force behind the women's movement of Casablanca. She has argued for the vote, for the factory canteen and for the girls' school in the same meeting, and she has never once been accused of lacking the nerve."
 MOR_lucette_mazella: "Lucette Mazella"
 MOR_lucette_mazella_desc: "A typist of the printers' union who became the regime's minister of labour, writing the wage scales, the safety rules and the maternity clauses that the old concession owners called utopian. She reads every contract before signing it."
 MOR_freyha_ayache: "Freyha Ayache"
 MOR_freyha_ayache_desc: "A teacher from the Jewish schools of Casablanca who fought for mixed, secular, free classrooms long before the revolution made it policy. She now builds the school network and refuses to let literacy become a slogan instead of a timetable."

