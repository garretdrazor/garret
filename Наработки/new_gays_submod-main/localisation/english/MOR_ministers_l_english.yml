 # ================= TRAIT DESCRIPTIONS: LEADERS =================
 mor_soft_character_desc: "Courteous, patient and unhurried, the Resident-General prefers a signature obtained to a signature demanded. The Makhzen breathes easier under him, and business moves a little faster while Paris is still reading the last dispatch."
 mor_resident_satrap_desc: "A governor by decree who governs better from an office than among the people he governs. Orders issued in Rabat are obeyed and resented with equal speed, and the Residency grows more confident in its own strength the less the country consents to it."
 mor_french_resident_general_desc: "Soldier and then proconsul, Noguès administers Morocco as an army of occupation wearing a civilian facade. Nothing moves toward independence that he has not first agreed to delay."
 mor_pacifier_of_the_rif_wolf_desc: "He hunted Abd el-Krim through the same mountains and learned how a Rif war is really fought: by water, by mule track and by separating the villages from the rebels. Peace, to him, is only pacification that has not been finished."
 mor_voice_of_the_nation_desc: "When Allal al-Fassi speaks, the petitions, the committees and the crowds move in one direction. A nation that can agree on a single sentence is worth more political capital than a dozen parties arguing over a programme."
 mor_constitutional_reformer_desc: "Ouazzani argues that the demand for a parliament is not sedition but the oldest claim of the Sharifian empire, and that a country which writes down the limits of power governs itself better than one that waits for them to be granted."
 mor_limited_monarch_desc: "Master of all he surveys and prisoner of all who survey him: the Sultan reigns inside the limits the treaties leave him, sells his favour carefully, and weighs every faction, his own included, with the same patient arithmetic."
 mor_descendant_of_the_prophet_desc: "Sharif, descendant of the Prophet and Commander of the Faithful — a genealogy that ends arguments before they begin. Obedience comes cheaper, and a war declared in his name is a war that can be explained from every minbar in the country."
 mor_hope_of_the_nationalists_desc: "The nationalist committees have found what the Residency cannot arrest: a Sultan who answers their petitions in public. Every week he sits on the throne and refuses to choose sides, the gap between throne and nation closes."
 mor_opponent_of_fascism_desc: "Sultan has read the Spanish papers and the German ones, and repeats at every meeting that the shirts which landed at Alhucemas were not liberators but another master with a better press agent."
 mor_internationalist_ideologue_desc: "For him the protectorate is one link in a chain running from Tetouan to Asturias, and the men who hew phosphate are workers before they are Moroccan. That argument persuades dockers, miners and foreign volunteers no sultan could ever recruit."
 mor_voice_of_the_maghreb_desc: "From the mosque and from the newspaper Torres demands a Morocco united across the frontiers drawn at Fez, and promises that a nation daring to arm itself will be listened to. His rhetoric sharpens every war aim the country might hold, and makes two neighbours considerably angrier."
 # ================= TRAIT DESCRIPTIONS: CONCERNS =================
 mor_phosphate_monopoly_desc: "Rock phosphate is mostly rock, and the rock is here. The Office's concessions yield the chromite that arms industry needs as badly as agriculture does, and its own sidings let the state claim a larger share of whatever the ground gives up."
 mor_railway_company_desc: "Railways are politics: kilometres of track, turntables and water towers decide whether a harvest reaches the port or a division reaches the frontier. With labour this cheap the company can lay rail faster than the concessions technically allow."
 mor_coal_mines_of_jerada_desc: "Poor seams, deep shafts, hard men. What Jerada produces is barely enough to matter, yet coal mined in Morocco is coal that does not have to be bought in Newcastle, and its furnaces feed the fuel plants that keep industry running."
 mor_zellidja_mining_company_desc: "The Sleg-Bumauber field yields lead, zinc and above all tungsten, the metal every arms programme needs and every neutral hoards. Worked harder, it also lifts factory efficiency everywhere else, because machinery stops waiting on imported alloy."
 mor_omnium_nord_africain_construction_desc: "The Omnium builds ports, tramways, warehouses, ice plants and whole quarters of cities, and rents its engineers, concrete and lorries to whoever signs the cheque. Building goes faster; so does the slice of the country's output its books swallow."
 mor_energie_electrique_du_maroc_power_desc: "Current is the one commodity the protectorate cannot import cheaply. With the dams and thermal plants at our disposal, factories run on their own power, synthetic fuel plants rise out of the plain, and radar stations have the amperage to be useful."


 # ================= TRAIT DESCRIPTIONS: MINISTERS =================
 mor_disloyal_grand_vizier_desc: "Al-Muqri serves the Sultan in public and the nation in private. Other ministers buy their offices; the Grand Vizier's patronage makes the Makhzen run on loyalty to a cause rather than to the Residency, to the latter's considerable inconvenience."
 mor_makhzen_financier_desc: "A financier of the old school who squares the budget by squeezing the tax farmer and shaving the customs. He frees just enough money to build something, and leaves the population marginally less poor than the ledger demands."
 mor_first_agronomist_engineer_desc: "Trained at a French agricultural school and sent back to a countryside that still ploughs with wooden shares, he insists that Morocco's first industry is the soil: better seed, wells and rotation make villages grow and land appear for other works."
 mor_makhzen_educator_desc: "He teaches in the madrasas and in the technical college with the same seriousness, and argues that a country able to read its own treaties cannot be fooled by them. Literacy, patience and a little arithmetic keep a nation steady."
 mor_master_of_royal_ceremonies_desc: "Keeper of protocol, of petitions and of the list of who is presented at court, he turns ceremony into politics: the Sultan's prestige arrives on schedule and with witnesses, and no important man in the country is unsure where honour now sits."
 mor_berber_writer_desc: "A son of the Atlas who writes in Tachelhit about a Morocco that existed before Fez, before Marrakesh and before the treaties — and whose history quietly demonstrates that this land was nobody's province, not even France's."
 mor_captain_of_industry_desc: "Lamrani built a commercial and industrial house in Casablanca at a time when the protectorate assumed a Moroccan could only deliver raw ore. His workshops, his ledgers and his habits of management transfer directly into a national production programme."
 mor_economist_reformer_desc: "He argues that prosperity, not rhetoric, is what keeps a country quiet or lifts it up, and proposes taxes, credit and cooperatives that leave the peasant a little more of what he grows."
 mor_jewish_community_leader_desc: "Rabbi of the mellahs, he insists that the Jews of Morocco are Moroccan, and has the rabbis and the merchants to prove it where the Sultan's word alone does not reach. Preaching patience and charity steadies the country; it does not accelerate its science."
 mor_minister_of_spying_desc: "Kandoussi has relatives in every kasbah and informants in every cafe. What began as the Sultan's private gossip service has become something close to intelligence: quicker to run, harder to penetrate and discreet about its own bookkeeping."
 mor_minister_of_education_desc: "He wants the syllabus rewritten so that a Moroccan child learns the geography of Morocco, and technical teaching added so the country stops importing the men who run its machines."
 mor_minister_of_propaganda_desc: "He knows which string to pull in each quarter, in which language and on which day. His communiquoes make the government's reasoning as familiar as the call to prayer, and a war the press has explained is a war most people will accept."
 mor_minister_of_foreign_affairs_desc: "Balafrej has already argued the Moroccan case in the Paris press and before foreign chancelleries. He speaks to ambassadors without the deference the protectorate expects, which is precisely why the ambassadors now call on him."
 mor_minister_of_agriculture_desc: "His ministry deals in seed, wells, locusts and irrigation shares, which in Morocco means dealing in everything else as well. Villages get fed, land gets surveyed, and raw material stops leaving the country uncounted and unworked."
 mor_democratic_ideologue_desc: "He explains patiently, and in three languages, that a parliament is not a French institution but a limitation on power, and that a nation which limits its rulers is already governing itself. Arguments of that sort gather supporters and buy time."
 mor_liberal_journalist_desc: "His paper prints the petitions, the censored paragraphs and the names the Residency would rather were forgotten. Every issue hands the government an opposition it cannot arrest and the public a version of events the authorities did not compose."
 mor_social_activist_desc: "Union secretary, mutual-aid man and strike negotiator, he works where the city is built: the docks, the tramway, the shantytowns. Where he organises, roads get made, bread gets cheaper and the population grows simply because it is being fed."
 mor_loyal_grand_vizier_desc: "El Glaoui holds the south for the throne and the throne for the Makhzen. Such loyalty costs the state nothing in bribes and buys it a king whose prestige rises with every tribe that answers a grand vizier's call."
 mor_falangist_imitator_desc: "He borrows the shirts, the liturgy and the discipline of the Spanish Falange while quietly leaving Spain out of it, and organises youth, workshops and militia drill with an efficiency that embarrasses more refined nationalists."
 mor_head_of_religious_affairs_desc: "Heading the religious authority, al-Nasiri places the ulama behind the throne and the treaties behind the ulama: the Sharifian state is legitimate because religious law says so, and arguments from Paris carry no weight in a sharia court."
 mor_underground_organizer_desc: "When the party was driven underground he learned to print, courier, hide and organise without being seen. That trade produces cells, addresses and agents who can be sent abroad and return with their papers intact."
 mor_mountain_cartographer_desc: "He has surveyed passes the Residency's maps leave blank, and knows which tracks carry mules, which carry lorries and which carry a battalion. That knowledge turns the Atlas from an obstacle into a frontier that can be defended."
 mor_communist_industrial_commissar_desc: "A trade unionist turned people's commissar, he puts the plan before the profit and the factory under work discipline — and gets the output, because the men who obey him know the plant better than the directors he replaced."
 mor_railway_and_nodes_commissar_desc: "He understands that an army marches on its timetable, and holds every locomotive, siding, crane and water tower in one office. Railways and supply hubs appear quickly, because nobody is permitted to build the same line twice."
 mor_trade_unionist_desc: "Union chairman, negotiator and, on his own side, strike breaker, he has taught the workshops to bargain and to produce. Discipline learned on a picket line transfers neatly to a factory roster and to a recruitment office."
 mor_voice_of_the_underground_desc: "El Maleh writes under pseudonyms for papers printed in secrecy, and the government he attacks cannot find the print shop. His pen brings political capital to a banned party, and the counter-intelligence services have learned to doubt their own files."
 mor_engineer_of_labour_desc: "He reorganises shifts, maintenance rotas and the layout of the benches, arguing that Morocco cannot afford to waste a single hour of the working day. Factories under him run hotter, tighter and busier than the forecasts promised."
 mor_workhorse_of_the_politburo_desc: "The man who reads every file, drafts every report and never asks for leave. Bureaucracy of that kind does generate political power and output, at the modest cost of the living standards of everyone who works for it."
 mor_editor_of_the_party_press_desc: "His press explains the line, names the enemy and prints the names of men who have disappeared, which makes it at once the party's teacher, its chronicle and its most wanted publication."
 mor_mother_of_emancipation_desc: "Fortuna Sultan organised schools, welfare and work for Muslim women long before any department considered it necessary. Her networks add hands to the manpower pool and women to the workforce, while the roads and workshops she insists upon appear faster than planned."
 mor_labour_minister_desc: "A labour minister who knows the shop floor, she sets rosters, safety rules and training, and treats a worker who is fed, housed and counted as an investment. Output, recruitment and the birth rate all answer to that."
 mor_minister_of_enlightenment_desc: "She wants schools, libraries, girls' classes and literacy brigades, and has the awkward habit of noting that an illiterate country cannot defend itself. Ideas, once circulated, make people harder to surprise and harder to govern."
 mor_ulema_of_the_north_desc: "A scholar of the Northern League who teaches law, grammar and history in Tetouan, whose certificate carries more weight in the Rif than any diploma signed in Paris. Learning blessed by religion spreads quickly and calms what it touches."
 mor_shadow_banker_desc: "He moves money through Tetouan and Tangier in ways that leave no letterhead, financing parties, newspapers and agents with the same discreet competence. Such accounts win friends abroad and information at home, and appear in no budget."
 mor_youth_organization_leader_desc: "He drills, teaches and recruits boys who have never known anything but the protectorate, convinced that a generation with a flag, a classroom and a drill square will not be the generation its fathers were."
