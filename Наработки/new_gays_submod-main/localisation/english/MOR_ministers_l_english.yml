 # ================= MOROCCO: CONCERNS =================
 MOR_office_cherifien_des_phosphates: "Office Chérifien des Phosphates"
 MOR_office_cherifien_des_phosphates_desc: "Founded in 1920, the Office Chérifien des Phosphates holds an undisputed monopoly over the mines of Khouribga, Benguerir and Youssoufia, whose rock phosphate dresses the fields of half of Europe. Its output is counted in millions of tons and its dividends in political influence — whoever commands the Office commands the budget of the protectorate, and the ore it ships leaves plenty of chromium behind for our own foundries."
 MOR_chemins_de_fer_du_maroc: "Compagnie des Chemins de Fer du Maroc"
 MOR_chemins_de_fer_du_maroc_desc: "A single concession binds the port of Casablanca to the phosphate plateaus and to the ports of Fedala and Mogador. Its narrow-gauge lines, turntables and workshops are the true arteries of the protectorate — and whoever owns them decides how fast anything at all moves through this country."
 MOR_charbonnages_de_jerada: "Charbonnages de Jerada"
 MOR_charbonnages_de_jerada_desc: "In the eastern Rif, near the Algerian border, the pits of Jerada tear lignite and coal out of the mountains. The seams are poor and the work brutal, yet they are the only native supply of solid fuel in Morocco — the one thing that keeps our locomotives, gasworks and foundry furnaces burning."
 MOR_societe_des_mines_de_zellidja: "Société des Mines de Zellidja"
 MOR_societe_des_mines_de_zellidja_desc: "The Sleg-Bumauber district near Marrakesh has been worked since Phoenician times, and the Société des Mines de Zellidja now extracts its lead, zinc and tungsten with French machinery and Moroccan hands. Small in output, it is precious in strategic weight: tungsten is what a neutral country sells to everybody and a belligerent one hoards."
 MOR_omnium_nord_africain: "Omnium Nord-Africain"
 MOR_omnium_nord_africain_desc: "A Parisian holding company with a Moroccan face, the Omnium Nord-Africain swallowed the port works, tramways, breweries, ice plants, docks and construction firms of the protectorate in a single gulp. Where its cranes rise, a city is being rebuilt to French measure — and its engineers, roads and concrete mixers are at the disposal of whoever pays the invoice."
 MOR_energie_electrique_du_maroc: "Énergie Électrique du Maroc"
 MOR_energie_electrique_du_maroc_desc: "Dams on the Oum Er-Rbia, thermal plants at Casablanca and a web of high-voltage lines feeding mine, port and tramway — the Énergie Électrique du Maroc sells this country its light at a tariff set in Paris. Bind its directors to our purpose, and the current that once served the colonists will drive Moroccan machinery."

