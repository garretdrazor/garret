l_english:
 mor_dated.1.t: "The Reality of the Moroccan Protectorate"
 mor_dated.1.d: "Muhammad V was placed at the head of the country as the youngest, isolated and untrained scion of the previous Sultan — the obvious choice for anyone who hoped to manipulate a young ruler with ease. Yet our Sultan was quick to show character, and showed no desire whatever to obey the orders of the unbelievers without a word!\n\nAs the conquest of Morocco proceeded, so did the construction of the protectorate's administration. Under the Treaty of Fes the purpose of the protectorate was formally to assist the reform and economic development of Morocco. The same arrangements, in violation of earlier agreements and of the Algeciras Act in particular, rudely disregarded the territorial integrity of Morocco and in practice opened the road to carving the country up.\n\nThey also defined the limits of the Sultan's sovereignty in the most ambiguous way. On one hand the French undertook to uphold the “traditional prestige of the Sultan” and his successors and to “give him constant support against any danger threatening his person or his throne”. On the other, internal order, defence, foreign relations and finance were withdrawn from the Sultan's competence. He held legislative power, but no right of legislative initiative.\n\nFormally the Sultan kept his power with every attribute of respect the French owed it, and kept spiritual authority in full. Of executive, legislative and judicial power he lost control step by step. In effect the Sultan is a prisoner in his own palace."
 mor_dated.1.a: "Our Sultan will rise to the occasion!"

 mor_dated.2.t: "A Speech to the Jewish Community"
 mor_dated.2.d: "Bernard Lekech addressed a crowd of several hundred in the Colisée cinema in Oujda. Cinemas were the ideal venue for such mass meetings and were often owned by Jews, who helped organise events of this kind within the local Jewish community. This programme was devoted to the theme of “Racism and Peace”.\n\nResidency observers noted a large Jewish presence, a handful of Muslims, and European communists and SFIO members spreading propaganda at the event.\n\nLekech reproached the local members of the LICA for the relative shortage of Muslims, claiming their share was higher in Egypt. Far more Muslims had tried to attend in Oujda, but the Resident-General forbade their presence. Lekech defended Léon Blum, denounced fascist propaganda and tied antisemitic legislation and violence in Nazi Central Europe to the violence that had erupted in Constantine in 1934. He argued passionately for Jewish, Muslim and European solidarity within the Popular Front and the SFIO.\n\nThe message went down well, and Lekech delivered the same address in Fez, Meknes, Rabat and Casablanca before hundreds of people. The LICA, and the left in general, ended up Moroccanised — reflecting local Moroccan problems while keeping an eye on international events."
 mor_dated.2.a: "An alliance of uneducated Moroccans and politicised Jews is not in our interest"

 mor_dated.3.t: "The Outrageous Behaviour of the Jewish Communists"
 mor_dated.3.d: "La Presse Marocaine reports that a group of Moroccan Jewish “red falcons” in identical scarlet neckties insulted passers-by aggressively at the Casablanca railway station, amusing themselves, it is said, by shouting in people's faces.\n\nIt was no isolated incident. The paper reports that the previous evening Moroccan Jews of the Popular Front took part in a mass demonstration outside the Bank of Morocco. When a policeman “asked” the crowd to disperse, one of the Jewish protesters “insolently” shouted: “We have the right to be here!” The paper rightly blames this intolerable occupation of the street on the dangerous, revolutionary propaganda of the Popular Front in Morocco!\n\nSharp criticism fell on Léon René Sultan, a Jew from Algeria holding French citizenship, as the organiser of the riots. This same Léon Sultan had but recently returned from Paris, where, in a delegation of the European left, he demanded that the Resident-General take measures against the bank. A French citizen of Morocco was dismissed from his post for a hostile attitude towards Moroccan workers. Sultan even dared to declare haughtily that he acted from the purest and highest feeling of patriotism, when in fact he was desperately goading his co-religionists to violence against true patriots!\n\nThe author assures readers that most Jews were shocked by the episode and condemned such flagrant contempt for French authority. Those Jews possessed of common sense, it is claimed, recognise these events as the vile deed of one of their own, bent on pushing his brothers towards internationalism, upheaval and, above all, violence that could have terrible consequences."
 mor_dated.3.a: "There has been far too much noise from the left-wing Jews"

 mor_dated.4.t: "Red June in Casablanca"
 mor_dated.4.d: "News of the great strikes in France echoed through the streets of the Moroccan protectorate. This morning the workers of the COSUMA sugar company in Casablanca silenced their machines and left the shops. Within hours the strike had spread to the textile mills, the metalworks and the paint factories.\n\nThe colonial administration was unprepared for the unrest crossing over from the metropole: for the first time in the history of the protectorate, French specialists and native Moroccan workers march shoulder to shoulder under a single set of slogans. They demand the eight-hour day, recognition of the unions and higher wages.\n\nIf the strike spreads to the phosphate mines of Houribgha, the economy of the whole region will be paralysed. Grand Vizier Muhammad al-Muqri calls for calm, but the streets demand decisive action."
 mor_dated.4.a: "Make concessions and negotiate with the leaders"
 mor_dated.4.b: "Use the colonial troops to break up the rioters!"

 mor_dated.5.t: "The Phosphate Crisis"
 mor_dated.5.d: "The sparks that flew two days ago at the COSUMA sugar works in Casablanca have reached the depths of the Moroccan earth. The miners of the Houribgha and Louis-Gentil phosphate mines have declared an indefinite strike. Under the leadership of the local union leader Michel Colonna, thousands of Moroccan miners have barricaded the pitheads and stopped the loading locomotives.\n\nThe situation is critical. Phosphates are the bloodstream of our protectorate's economy and a vital resource for the chemical industry of the metropole. The French mine directors have locked themselves in their offices and demand the immediate intervention of the Foreign Legion.\n\nGrand Vizier Muhammad al-Muqri warns that if blood is spilled the strike may in time grow into a full-scale tribal rising in the Atlas mountains, where the works stand and whose people work them. There is no time for deliberation — phosphate extraction has stopped completely."
 mor_dated.5.a: "We are forced to make concessions after all"
 mor_dated.5.b: "Send the Foreign Legion to clear the mines"

 mor_dated.6.t: "The Communist Party of Morocco Breaks with the PCF"
 mor_dated.6.d: "The brutal suppression of the strikes in Casablanca and Houribgha, with the Foreign Legion employed, bought only a lull. The colonial authorities reckoned badly: rather than breaking the workers' will, bullets and arrests drove the protest movement deep underground and radicalised it.\n\nScattered Marxist circles, the union cells of COSUMA and the surviving leaders of the Houribgha miners have announced their merger. At a secret congress in the slums of Casablanca the complete autonomy of the Communist Party of Morocco was proclaimed, severing its ties with the French Communist Party. The radicals who took charge of the party have prepared new demands. Their goal now is no longer merely labour reform, but the legalisation of all trade unions regardless of nationality, along with special powers that will let them impose their demands on the enterprises.\n\nThe situation is slipping out of Paris's control ever faster."
 mor_dated.6.a: "These are worrying news"

 mor_dated.7.t: "Red June Dawns"
 mor_dated.7.d: "The communists poured into the protest mood with enormous success. The unrest, which seemed to be dying down after the crackdown, flared up again with new force — only now it concerned not only the Atlas mountains and Casablanca, but most of the country that lives on industry and on hired labour. Only the fellahin stayed outside.\n\nMost of the stay-outs and strikes are now led by former leaders of the underground unions, today members of the Communist Party of Morocco. Plainly: if we behead the newly born communist party, we behead the whole rising."
 mor_dated.7.a: "We must give in, or we shall drown in blood!"
 mor_dated.7.b: "Let us finish the job!"

 mor_dated.8.t: "The Apogee of Red June"
 mor_dated.8.d: "The colonial authorities' attempt to drown the communist underground in blood ended in catastrophe. The arrest of popular union leaders was the last straw. From its deep underground the newly formed Communist Party of Morocco issued the manifesto “To arms, sons of the Atlas!”, which spread across the country in days.\n\nWhat began as local economic strikes in Casablanca has grown into a full-scale war of national liberation. The factories of Casablanca stand silent once more, but now the workers are forming armed bands. The miners of Houribgha have seized the dynamite stores and threaten the rail lines to the ports. In Fez and Marrakesh the local population has laid siege to the French administrative buildings.\n\nGrand Vizier Muhammad al-Muqri has barricaded himself inside his palace in Rabat, admitting that the traditional institutions of power have entirely lost control of the street. The young Sultan refused to address the nation — a silent expression of support for his people."
 mor_dated.8.a: "The situation is becoming alarming"

 mor_dated.9.t: "First Congress of the Action Committee in Rabat"
 mor_dated.9.d: "Against the unending echo of the summer strikes and a deep political crisis, the Moroccan Action Committee — the country's principal national force — opened its first historic Congress. The capital of the protectorate is flooded with delegates. Young intellectuals, the bourgeoisie and the leaders of worker cells have gathered in Rabat to forge a single political platform.\n\nUnder the chairmanship of Allal al-Fassi and Muhammad al-Uazzani, the Congress proclaimed the transition from secret circles to open mass political struggle. The nationalists delivered an ultimatum to the Resident-General, demanding immediate fulfilment of the “Plan of Reforms”: access for Moroccans to public administration, elected councils and equality before the law.\n\nThe temperature keeps rising: a crowd seethes outside the Congress walls, warmed by the slogans of the Kutla. Grand Vizier Muhammad al-Muqri begs the French Resident to show flexibility before Rabat catches fire after Casablanca."
 mor_dated.9.a: "Let us stall for an answer"

 mor_dated.10.t: "The November Political Crisis Begins"
 mor_dated.10.d: "Receiving no satisfactory answer to its demands, the Moroccan Action Committee has gone over to the decisive offensive. Throughout the first half of November Rabat, Fez and Marrakesh are shaken by enormous street rallies. The nationalists demand an immediate answer to their “Plan of Reforms”, while the radicals among the workers more and more loudly call for a general strike.\n\nClearly we can no longer drag out our answer, or the price will be paid — and new protests will seize the entire country."
 mor_dated.10.a: "The Sultan wants no part in this; the Resident-General will deal with it"
 mor_dated.10.b: "The Sultan sympathises with them and has personally offered to negotiate"
 mor_dated.10.c: "Let us stall for an answer"

 mor_dated.11.t: "Arrest of the Action Committee Leaders"
 mor_dated.11.d: "By order of the Resident-General the security forces carried out a lightning operation. The chief ideologists of the movement — Allal al-Fassi, Muhammad al-Uazzani and Muhammad Yazidi — were arrested and thrown behind bars.\n\nThe backlash proved explosive. The cities of Morocco caught fire. Thousands of enraged Moroccans blockaded the government quarters, demanding the release of their leaders.\n\nGrand Vizier Muhammad al-Muqri warns: unless we give in now, the prisons will have to be stormed by the army, and spilled blood will cut off the road to peace forever. What are our orders?"
 mor_dated.11.a: "Release them for now — we shall act differently"

 mor_dated.12.t: "The Action Committee Leaders Invited to Negotiate"
 mor_dated.12.d: "The colonial administration's attempts to steer between harsh repression and complete inaction have produced a fragile balance. The streets of Rabat and Fez have fallen quiet, but this is the calm before the storm. The Moroccan Action Committee has proven that the masses stand behind it, and the Grand Vizier Muhammad al-Muqri keeps reminding us that the colonial apparatus will not survive a new general strike should the nationalists join forces with the underground union cells.\n\nTo seize the initiative, the Resident-General has resolved on an unprecedented step — to formally invite the leaders of the MAC, at their head Allal al-Fassi and Muhammad al-Uazzani, to the negotiating table in Rabat. For the first time in the history of the protectorate France is ready to discuss the “Plan of Reforms” directly with Moroccan intellectuals.\n\nContradictory signals arrive from Paris: the left wing of the government demands a “compromise”, while the right and the generals consider these negotiations a capitulation before the natives."
 mor_dated.12.a: "Everything will be settled at the negotiating table"
 mor_dated.12.a.tt: "Access opens to the focus “Begin Revision of the Reform Plan”"

 mor_dated.13.t: "The Year of Failed Harvests"
 mor_dated.13.d: "The turn of the year may turn this year into a catastrophe. After the severe failure of the grain harvests in previous years the administration introduced strict price controls on bread and flour to prevent speculation, and the complete absence of rain this year may start a famine in the southern and central regions of the country.\n\nSultan Muhammad V has asked the French for subsidies and seed grain for the poorest Moroccan fellahin."
 mor_dated.13.a: "France ought to help with this"

