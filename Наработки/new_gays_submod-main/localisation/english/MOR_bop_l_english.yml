l_english:
 MOR_power_balance: "Muhammad V vs. the French Administration"
 MOR_sultan_side: "Sultan Muhammad V"
 MOR_resident_side: "The Resident-General"
 MOR_bop_balance_range: "Equilibrium (0-25 %)"
 MOR_bop_sultan_25_range: "Sultan's influence — 25 %"
 MOR_bop_sultan_50_range: "Sultan's influence — 50 %"
 MOR_bop_sultan_75_range: "Sultan's influence — 75 %"
 MOR_bop_sultan_100_range: "Full authority of the Sultan"
 MOR_bop_resident_25_range: "Resident's influence — 25 %"
 MOR_bop_resident_50_range: "Resident's influence — 50 %"
 MOR_bop_resident_75_range: "Resident's influence — 75 %"
 MOR_bop_resident_100_range: "Full direct administration"
 MOR_balance_of_power_category: "Balance of Power"
 MOR_balance_of_power_category_desc: "Since the establishment of the protectorate power has been divided between the Sultan and the Resident-General: neither can do anything without the other's consent. The veto formally left to the Sultan was, in effect, the main element of Moroccan sovereignty — and France, having seized most of the power, has moved to direct administration. The Sultan will have to work hard to take the institutions of power back.\n§RThis category disappears as soon as Morocco becomes independent or the communists come to power.§!"
 MOR_french_colonial_policy_category: "Colonial Policy in Morocco"
 MOR_french_colonial_policy_category_desc: "Every institution the Resident-General wrests from the Makhzen pulls the balance of power in Morocco further towards Paris, and every step of it gives the Résidence Générale another legal pretext to lower the status of the Sultanate."
 MOR_appeal_to_the_faithful: "Appeal to the Faithful in the Mosque"
 MOR_appeal_to_the_faithful_desc: "A sermon delivered in the name of Commander of the Faithful reminds the country that its sovereignty is older than any residency circular: the voices of the mosques of Fez, Marrakesh and Rabat weigh more with the Makhzen than any note from Paris.\n§GShifts the balance of power 10 % towards Sultan Muhammad V.§!"
 MOR_request_support_from_metropole: "Obtain Support from the Metropole"
 MOR_request_support_from_metropole_desc: "The Résidence Générale secures a fresh loan, fresh clerks and a fresh garrison from Paris — and every clerk landing at Casablanca confirms who runs the protectorate.\n§RShifts the balance of power 10 % towards the Resident-General.§!"
 MOR_restore_legislative_initiative: "Restore the Sultan's Right of Legislative Initiative"
 MOR_restore_legislative_initiative_desc: "Under the Treaty of Fes a dahir counts only after the Resident's visa, but the right to draft laws belongs to the Throne — and the Makhzen intends to use it again rather than copy out French drafts.\nUnlocks access to ministers who bolster democracy and monarchism, and part of the political focus tree dealing with loyal movements and the position of the King.\n§GBalance of power shifts 20 % towards the Sultan; the tooltip 'The Resident-General holds the right of legislative initiative' is lost and 'Sultan holds the right of legislative initiative' gained.§!"
 MOR_restore_control_over_economy: "Restore the Sultan's Control of the Economy"
 MOR_restore_control_over_economy_desc: "Hubus lands, customs duties and phosphate concessions formally remain the patrimony of the Throne — it is enough to stop handing them to French companies and their appointed men.\nUnlocks the ability to edit economic laws and part of the economic focus tree dealing with independent development.\n§GBalance of power shifts 20 % towards the Sultan; the tooltip 'The Resident-General controls the economy' is lost and 'Sultan controls the economy' gained.§!"
 MOR_restore_control_over_internal_order: "Restore the Sultan's Control of Internal Order"
 MOR_restore_control_over_internal_order_desc: "The Makhzen recruits moqallis and caïds who answer to the Sultan rather than to a French controller, and the streets of the medina are watched by Moroccan eyes again.\nUnlocks the ability to edit occupation laws and part of the military focus tree dealing with police and occupation.\n§GBalance of power shifts 20 % towards the Sultan; the tooltip 'The Resident-General controls internal order in Morocco' is lost and 'Sultan controls internal order in Morocco' gained.§!"
 MOR_restore_control_over_army: "Restore the Sultan's Control of the Army"
 MOR_restore_control_over_army_desc: "The Sharifian Army exists on paper and in French uniforms; commissions and conscription lists must once more bear the Sultan's signature rather than the residency's.\nUnlocks the ability to edit conscription laws and part of the military focus tree dealing with army reform.\n§GBalance of power shifts 20 % towards the Sultan; the tooltip 'The Resident-General controls the army' is lost and 'Sultan controls the army' gained.§!"
 MOR_restore_control_over_foreign_affairs: "Restore the Sultan's Control of Foreign Affairs"
 MOR_restore_control_over_foreign_affairs_desc: "No dispatch ever left the country without the Resident's visa. With nothing else left on the scale, the Throne takes foreign relations as well — from now on Morocco speaks to the world in its own voice.\nUnlocks the ability to edit trade laws and part of the economic focus tree dealing with relations with foreign powers.\n§GBalance of power shifts 20 % towards the Sultan; the tooltip 'The Resident-General controls Morocco's foreign relations' is lost and 'Sultan controls foreign affairs' gained.§!"
 MOR_strip_resident_executive_power: "Strip the Resident-General of Executive Power"
 MOR_strip_resident_executive_power_desc: "Residency decrees bind only insofar as the Makhzen enforces them. Once caïds and pashas take their orders directly from the palace, the administration of Paris is left hanging in the air.\nUnlocks part of the focus tree dealing with an independent policy.\n§GBalance of power shifts 20 % towards the Sultan; the tooltip 'The Resident-General holds executive power' is lost and 'Sultan holds executive power' gained.§!"
 MOR_strip_resident_legislative_power: "Strip the Resident-General of Legislative Power"
 MOR_strip_resident_legislative_power_desc: "Protectorate law was drafted in the chancellery of the Resident and merely signed by the Sultan. Moving law-making back into the Sharifian government robs the Résidence Générale of its chief weapon: paperwork.\nUnlocks part of the focus tree dealing with an independent policy.\n§GBalance of power shifts 20 % towards the Sultan; the tooltip 'The Resident-General holds legislative power' is lost and 'Sultan holds legislative power' gained.§!"
 MOR_strip_resident_judicial_power: "Strip the Resident-General of Judicial Power"
 MOR_strip_resident_judicial_power_desc: "Shariat courts and the courts of the caïds are the oldest prerogative of the Throne; the French tribunals keep the cases of settlers. It remains to stop handing Moroccans over to them.\nUnlocks part of the focus tree dealing with trials against die-hard supporters of French rule and those who took bribes from them.\n§GBalance of power shifts 20 % towards the Sultan; the tooltip 'The Resident-General holds judicial power' is lost and 'Sultan holds judicial power' gained.§!"
 MOR_restore_spiritual_leader_title: "Restore the Title of Spiritual Leader"
 MOR_restore_spiritual_leader_title_desc: "The Alaouites descend from the Prophet himself, and the title of Commander of the Faithful cannot be gifted to a client of Paris. The muftiy installed by the residency is deposed, and with him fall silent the sermons on loyalty to France.\nUnlocks part of the economic focus tree dealing with the religious authority of the King.\n§GBalance of power shifts 20 % towards the Sultan; the tooltip 'The Resident-General has installed a compliant spiritual leader' is lost and 'Sultan is the spiritual leader of Morocco' gained.§!"
 MOR_strip_sultan_executive_power: "Strip the Sultan of Executive Power"
 MOR_strip_sultan_executive_power_desc: "Enforcement in the protectorate is a French affair: controllers, residency bulletins and local guard units make the Sultan's decrees so much paper until they are rewritten in the chancellery of the Resident-General.\nUnlocks part of the focus tree dealing with pro-French policy.\n§RBalance of power shifts 20 % towards the Resident-General; the tooltip 'Sultan holds executive power' is lost and 'The Resident-General holds executive power' gained.§!"
 MOR_strip_sultan_legislative_power: "Strip the Sultan of Legislative Power"
 MOR_strip_sultan_legislative_power_desc: "It is enough to move the drafting of dahirs into the chancellery of the residency, and the Sharifian government becomes what Paris always took it for: a signature under someone else's text.\nUnlocks part of the focus tree dealing with pro-French policy.\n§RBalance of power shifts 20 % towards the Resident-General; the tooltip 'Sultan holds legislative power' is lost and 'The Resident-General holds legislative power' gained.§!"
 MOR_strip_sultan_judicial_power: "Strip the Sultan of Judicial Power"
 MOR_strip_sultan_judicial_power_desc: "French tribunals are declared competent in every case touching the interests of the protectorate — which is to say, in every case. The shariat courts are left marriages and inheritance.\nUnlocks part of the focus tree dealing with trials against the opposition to French rule.\n§RBalance of power shifts 20 % towards the Resident-General; the tooltip 'Sultan holds judicial power' is lost and 'The Resident-General holds judicial power' gained.§!"
 MOR_install_puppet_religious_leader: "Appoint a New Spiritual Leader"
 MOR_install_puppet_religious_leader_desc: "The title of Commander of the Faithful is the last pillar of the Throne, and so it is worth handing to a muftiy who owes his career to the residency. A sermon on loyalty to France is cheaper than a garrison.\nUnlocks part of the economic focus tree dealing with religious alternatives.\n§RBalance of power shifts 20 % towards the Resident-General; the tooltip 'Sultan is the spiritual leader of Morocco' is lost and 'The Resident-General has installed a compliant spiritual leader' gained.§!"
 MOR_strip_sultan_legislative_initiative: "Strip the Sultan of the Right of Legislative Initiative"
 MOR_strip_sultan_legislative_initiative_desc: "A bill signed by the Sultan is far more dangerous than one drafted by the residency: it reads as the will of the country. Law-making passes wholly to the chancellery of the Resident-General, leaving the Makhzen its visa.\nUnlocks access to ministers who strengthen authoritarianism and lower autonomy, and part of the political focus tree dealing with support for France.\n§RBalance of power shifts 20 % towards the Resident-General; the tooltip 'Sultan holds the right of legislative initiative' is lost and 'The Resident-General holds the right of legislative initiative' gained.§!"
 MOR_strip_sultan_control_over_economy: "Strip the Sultan of Control over the Economy"
 MOR_strip_sultan_control_over_economy_desc: "Phosphates, ports, forests and hubus lands yield France exactly as much as she decides to collect. Company directors take their orders from the residency, while the Makhzen keeps a ceremonial share of the customs.\nCloses the ability to edit economic laws and opens part of the economic focus tree dealing with the France-dependent path.\n§RBalance of power shifts 20 % towards the Resident-General; the tooltip 'Sultan controls the economy' is lost and 'The Resident-General controls the economy' gained.§!"
 MOR_strip_sultan_control_over_internal_order: "Strip the Sultan of Control over Internal Order"
 MOR_strip_sultan_control_over_internal_order_desc: "Police, the penal camps and the secret police pass to the French Resident with Moroccan auxiliaries under his command — order in the country is now the business of the residency, not of the Makhzen.\nCloses the ability to edit occupation laws and opens part of the military focus tree dealing with French aid.\n§RBalance of power shifts 20 % towards the Resident-General; the tooltip 'Sultan controls internal order in Morocco' is lost and 'The Resident-General controls internal order in Morocco' gained.§!"
 MOR_strip_sultan_control_over_army: "Strip the Sultan of Control over the Army"
 MOR_strip_sultan_control_over_army_desc: "Officer commissions, conscription lists and arms depots pass to the French general staff: the Sharifian Army remains on paper, and command of it sits in the residency.\nCloses the ability to edit conscription laws and opens part of the military focus tree dealing with the French general staff.\n§RBalance of power shifts 20 % towards the Resident-General; the tooltip 'Sultan controls the army' is lost and 'The Resident-General controls the army' gained.§!"
 MOR_strip_sultan_control_over_foreign_affairs: "Strip the Sultan of Control over Foreign Affairs"
 MOR_strip_sultan_control_over_foreign_affairs_desc: "No note, no consul and no trade deal pass without the Resident's visa: Morocco's external relations become an appendix to the foreign policy of France.\nCloses the ability to edit trade laws and opens part of the economic focus tree dealing with cooperation with France.\n§RBalance of power shifts 20 % towards the Resident-General; the tooltip 'Sultan controls foreign affairs' is lost and 'The Resident-General controls Morocco's foreign relations' gained.§!"
 MOR_demand_puppet_status: "Win the Status of Puppet"
 MOR_demand_puppet_status_desc: "With 25 % of the balance of power behind us, the dahirs signed by the Sultan and the right of legislative initiative are enough to have France recognise the Sultanate as a puppet state rather than an integrated one — the first institutional gain of the protectorate era."
 MOR_demand_colonial_status: "Win Colonial Status"
 MOR_demand_colonial_status_desc: "At 50 % of the balance of power, with control of the economy and of internal order added to our legislative initiative, Paris can no longer pretend that Morocco is administered directly — the Treaty of Fes is invoked and the colonial statute restored."
 MOR_demand_dominion_status: "Win the Status of Dominion"
 MOR_demand_dominion_status_desc: "At 75 % of the balance of power the Sultan holds every instrument of internal power; only foreign affairs remain outside his hands. It is enough to force France to grant Morocco the status of a dominion."
 MOR_proclaim_independence: "Proclaim Independence"
 MOR_proclaim_independence_desc: "At 100 % of the balance of power, with the Sultan also master of Morocco's foreign relations, the protectorate has nothing left to rule through. The Throne declares the end of the treaty regime and takes full sovereignty."
 MOR_impose_colonial_regime: "Impose Colonial Administration"
 MOR_impose_colonial_regime_desc: "With a quarter of the balance of power in the Resident-General's favour and the executive in his hands, Paris may formalise what the Makhzen has long accepted: Morocco is administered as a colony."
 MOR_take_over_legislation: "Take Over Legislation"
 MOR_take_over_legislation_desc: "Half of the balance of power and both executive and legislative authority in the Résidence Générale reduce the Sultanate to a puppet government signing what it is given."
 MOR_establish_direct_administration: "Establish Direct Administration"
 MOR_establish_direct_administration_desc: "Three quarters of the balance of power, with the judiciary in French hands as well, leaves the Makhzen nothing but ceremony — Morocco is governed directly as an integrated puppet."
 MOR_annex_morocco: "Annex Morocco"
 MOR_annex_morocco_desc: "With the balance of power entirely in the Resident-General's favour and every instrument of authority in French hands, the Sultanate is abolished and Morocco incorporated into the French Republic."
