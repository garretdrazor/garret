l_russian:
 mor_dated.1.t: "Настоящее протектората Марокко"
 mor_dated.1.d: "Мухаммед V был поставлен во главе страны как самый младший, изолированный и необученный отпрыск предыдущего султана. Очевидный выбор для тех, кто хотел с лёгкостью манипулировать молодым правителем. Однако наш султан быстро начал показывать характер и вовсе не горел желанием безропотно подчиняться приказам неверных!\n\nОдновременно с завоеванием Марокко шёл процесс становления администрации протектората. Согласно Фесским договорённостям, предназначением протектората формально было содействие осуществлению реформ и экономическому развитию Марокко. Эти же договорённости в нарушение предшествовавших соглашений, и в частности Альхесирасских, грубо попирали принцип территориальной целостности Марокко. На практике они открыли путь к расчленению страны.\n\nОни же крайне двусмысленно определяли границы суверенитета султана в принятии решений. С одной стороны, французы обязались поддерживать «традиционный престиж султана» и его преемников, «оказывать ему постоянную поддержку против любой опасности, угрожающей его персоне либо трону». С другой — вопросы поддержания внутреннего порядка, обороны, внешних сношений и финансов были выведены из компетенции султана. Он располагал законодательной властью, однако у него не было права законодательной инициативы.\n\nСогласно соглашению о протекторате, султан формально сохранил свою власть со всеми подобающими ей атрибутами уважения со стороны французов, а также всю полноту духовной власти. Что касается исполнительной, законодательной и судебной властей, то контроль над ними он утрачивал шаг за шагом. Фактически султан оказался пленником в собственном дворце."
 mor_dated.1.a: "Наш султан справится!"

 mor_dated.2.t: "Выступления в еврейской общине"
 mor_dated.2.d: "Бернар Лекаш выступил перед многосотенной аудиторией в кинотеатре «Колизей» в Уджде. Кинотеатры были идеальным местом для таких массовых собраний и часто принадлежали евреям, которые помогали организовывать подобные мероприятия среди местной еврейской общины. Программа была посвящена теме «Расизм и мир».\n\nПредставители протектората отметили наличие в зале многочисленных евреев и нескольких мусульман, а также европейских коммунистов и членов SFIO, которые распространяли пропаганду на мероприятии.\n\nЛекаш упрекнул местных членов LICA за относительную малочисленность мусульман, заявив, что в Египте их доля выше. На мероприятие в Уджде пыталось попасть куда больше мусульман, но по приказу генерал-резидента им было запрещено присутствовать. Лекаш защищал Леона Блюма, осуждал фашистскую пропаганду и связывал антисемитское законодательство и насилие в нацистской Центральной Европе с насилием, вспыхнувшим в Константине в 1934 году. Он страстно отстаивал еврейскую, мусульманскую и европейскую солидарность в рамках Народного фронта и SFIO.\n\nЕго послание было принято хорошо: Лекаш прочёл аналогичные доклады в Фесе, Мекнесе, Рабате и Касабланке перед сотнями людей. LICA и левые в конечном итоге марокканизировались, отражая местные марокканские проблемы и оставаясь при этом в курсе международных событий."
 mor_dated.2.a: "Нам невыгодно объединение необразованных марокканцев и политизированных евреев"

 mor_dated.3.t: "Вопиющее поведение еврейских коммунистов"
 mor_dated.3.d: "Газета La Presse Marocaine сообщила, что группа марокканских еврейских «красных соколов» в одинаковых алых галстуках агрессивно оскорбляла прохожих на железнодорожном вокзале в Касабланке. Как сообщается, они «развлекались, крича людям в лицо».\n\nЭто был не единичный случай. Газета сообщила, что накануне вечером марокканские евреи — члены Народного фронта — участвовали в массовой акции протеста у Государственного банка Марокко. Когда полицейский «попросил» толпу разойтись, один из протестующих евреев «дерзко» выкрикнул: «Мы имеем право здесь находиться!» Газета совершенно верно обвинила в этой невыносимой оккупации улицы опасную и революционную пропаганду Народного фронта в Марокко!\n\nОсобенно критике подвергся Леон Рене Султан, еврей из Алжира с французским гражданством, — как организатор беспорядков. Этот же Леон Султан недавно вернулся из Парижа, где в составе делегации европейских левых потребовал от генерал-резидента принять меры в отношении банка. Французский гражданин Марокко был уволен со своего поста за враждебное отношение к марокканским рабочим. Султан даже осмелился высокомерно заявить, что действовал из чистейшего и высшего чувства патриотизма, тогда как на самом деле отчаянно подстрекал своих единоверцев к насилию против истинных патриотов!\n\nАвтор уверил читателей, что большинство евреев были потрясены этим эпизодом и осудили такое вопиющее пренебрежение французской властью. Предположительно, те евреи, которые обладают здравым смыслом, признали эти события гнусным деянием одного из своих, решившего подтолкнуть своих братьев к интернационализму, к потрясениям и, прежде всего, к насилию, которое могло иметь ужасные последствия."
 mor_dated.3.a: "Слишком много стало шума от левых евреев"

 mor_dated.4.t: "Красный июнь в Касабланке"
 mor_dated.4.d: "Известия о грандиозных забастовках во Франции эхом отозвались на улицах Марокканского протектората. Сегодня утром рабочие Сахарной компании (COSUMA) в Касабланке заглушили станки и покинули цеха. За считанные часы забастовка охватила текстильные фабрики, металлургические заводы и лакокрасочные мануфактуры.\n\nКолониальная администрация оказалась не готова к тому, что волнения перекинутся с метрополии на Марокко: впервые в истории протектората французские специалисты и коренные марокканские рабочие маршируют плечом к плечу под едиными лозунгами. Они требуют 8-часового рабочего дня, признания профсоюзов и повышения зарплат.\n\nЕсли забастовка перекинется на фосфатные рудники Хурибги, экономика региона будет полностью парализована. Великий визирь Мухаммад аль-Мукри призывает к спокойствию, но улицы требуют решительных действий."
 mor_dated.4.a: "Пойти на уступки и договориться с лидерами"
 mor_dated.4.b: "Использовать колониальные войска для разгона бунтовщиков!"

 mor_dated.5.t: "Фосфатный кризис"
 mor_dated.5.d: "Искры, вспыхнувшие два дня назад на сахарном заводе COSUMA в Касабланке, долетели до глубины марокканских недр. Шахтёры фосфатных рудников в Хурибге и Луи-Жантиле объявили о начале бессрочной забастовки. Под руководством местного профсоюзного лидера Мишеля Колонны тысячи марокканских горняков забаррикадировали входы в шахты и остановили погрузочные локомотивы.\n\nСитуация критическая. Фосфаты — это кровеносная система экономики нашего протектората и важнейший ресурс для химической промышленности метрополии. Французские директора шахт заперлись в своих офисах и требуют немедленного вмешательства Иностранного легиона.\n\nВеликий визирь Мухаммад аль-Мукри предупреждает: если прольётся кровь, забастовка со временем может перерасти в полномасштабное племенное восстание в горах Атлас, где расположены предприятия и чьи люди там работают. Времени на размышления нет — добыча фосфатов полностью прекращена."
 mor_dated.5.a: "Мы всё же вынуждены пойти на уступки"
 mor_dated.5.b: "Направить Иностранный легион для зачистки шахт"

 mor_dated.6.t: "Партия коммунистов Марокко открещивается от ФКП"
 mor_dated.6.d: "Жестокое подавление забастовок в Касабланке и Хурибге с привлечением Иностранного легиона принесло лишь временное затишье. Колониальные власти жестоко просчитались: вместо того чтобы сломить волю рабочих, пули и аресты загнали протестное движение в глубокое подполье и радикализировали его.\n\nРазрозненные марксистские кружки, профсоюзные ячейки COSUMA и выжившие лидеры горняков Хурибги объявили о слиянии. На тайном съезде в трущобах Касабланки было объявлено о полной автономии Партии коммунистов Марокко, которая отказывается от своих связей с Французской коммунистической партией. Возглавившие партию радикалы подготовили новые требования. Теперь их цель — не просто реформы труда, а легализация всех рабочих профсоюзов, вне зависимости от нации, а также предоставление им особых полномочий, которые позволят им навязывать свои требования предприятиям.\n\nСитуация всё стремительней выходит из-под контроля Парижа."
 mor_dated.6.a: "Это тревожные новости"

 mor_dated.7.t: "Красный июнь рассветает"
 mor_dated.7.d: "Коммунисты влились в протестные настроения с огромным успехом. Казалось бы, начавшие затихать после разгона волнения вспыхнули с новой силой — только теперь они касались не только Атласских гор и Касабланки, но и большей части страны, зависящей от промышленности и наёмного труда. За бортом остались лишь феллахи.\n\nБольшую часть стачек и забастовок возглавили бывшие лидеры подпольных профсоюзов, ныне — члены коммунистической партии Марокко. Очевидно: если «обезглавить» новорождённую коммунистическую партию, мы обезглавим и всё восстание."
 mor_dated.7.a: "Нам придётся уступить, иначе мы захлебнёмся в крови!"
 mor_dated.7.b: "Закончим дело!"

 mor_dated.8.t: "Апогей красного июня"
 mor_dated.8.d: "Попытка колониальных властей утопить коммунистическое подполье в крови привела к катастрофе. Аресты популярных профсоюзных лидеров стали последней каплей. Новосформированная Партия коммунистов Марокко из своего глубокого подполья выпустила манифест «К оружию, сыны Атласа!», который мгновенно разлетелся по всей стране.\n\nТо, что начиналось как локальные экономические забастовки в Касабланке, переросло в полномасштабное национально-освободительное восстание. Заводы Касабланки снова стоят, но теперь рабочие начали формировать вооружённые отряды. Шахтёры Хурибги захватили склады с динамитом, угрожая железнодорожным путям, ведущим к портам. В Фесе и Марракеше местное население взяло в осаду французские административные здания.\n\nВеликий визирь Мухаммад аль-Мукри забаррикадировался в собственном дворце в Рабате, признавая, что традиционные институты власти полностью потеряли контроль над улицей. Молодой султан отказался от обращения к нации, выразив тем самым молчаливую поддержку своему народу."
 mor_dated.8.a: "Ситуация становится тревожной"

 mor_dated.9.t: "I Конгресс Национального комитета действия в Рабате"
 mor_dated.9.d: "На фоне непрекращающегося эха летних забастовок и глубокого политического кризиса Комитет марокканского действия — главная национальная сила страны — открыл свой I исторический Конгресс. Столица протектората наводнена делегатами. Молодые интеллектуалы, буржуазия и лидеры рабочих ячеек съехались в Рабат, чтобы сформировать единую политическую платформу.\n\nПод председательством Аллаля аль-Фаси и Мухаммада аль-Уаццани Конгресс провозгласил переход от тайных кружков к открытой массовой политической борьбе. Националисты выставили генерал-резиденту ультиматум, требуя немедленного выполнения «Плана реформ»: допуска марокканцев к госуправлению, создания выборных советов и равенства перед законом.\n\nСитуация накаляется: у стен Конгресса бурлит толпа, подогретая лозунгами «Кутлы». Великий визирь Мухаммад аль-Мукри умоляет французского резидента проявить гибкость, пока Рабат не вспыхнул вслед за Касабланкой."
 mor_dated.9.a: "Потянем с ответом"

 mor_dated.10.t: "Начало ноябрьского политического кризиса"
 mor_dated.10.d: "Не дождавшись вразумительного ответа по своим требованиям, Комитет марокканского действия перешёл в решительное наступление. Всю первую половину ноября Рабат, Фес и Марракеш содрогаются от грандиозных уличных митингов. Националисты требуют немедленного ответа на свой «План реформ», а радикалы из числа рабочих всё громче призывают к всеобщей забастовке.\n\nОчевидно, что мы больше не можем затягивать с ответом, иначе нам это может аукнуться, и всю страну захватят новые протесты."
 mor_dated.10.a: "Султан не хочет ввязываться в это, генерал-резидент разберётся сам"
 mor_dated.10.b: "Султан симпатизирует им и лично вызвался провести переговоры"
 mor_dated.10.c: "Потянем с ответом"

 mor_dated.11.t: "Аресты лидеров Марокканского комитета действий"
 mor_dated.11.d: "По приказу генерал-резидента силы безопасности провели молниеносную операцию. Главные идеологи движения — Аллаль аль-Фаси, Мухаммад аль-Уаццани и Мухаммад Лязиди — были арестованы и брошены за решётку.\n\nОбратный эффект оказался взрывоопасным. Города Марокко вспыхнули. Тысячи разгневанных марокканцев заблокировали правительственные кварталы, требуя освобождения своих лидеров.\n\nВеликий визирь Мухаммад аль-Мукри предупреждает: если мы не уступим сейчас, тюрьмы придётся штурмовать войскам, а пролитая кровь навсегда отрежет путь к миру. Каковы наши приказы?"
 mor_dated.11.a: "Пока освободим их, будем действовать иначе"

 mor_dated.12.t: "Приглашение лидеров Марокканского комитета действий к переговорам"
 mor_dated.12.d: "Попытки колониальной администрации лавировать между жёстким подавлением и полным бездействием привели к хрупкому равновесию. Улицы Рабата и Феса затихли, но это затишье перед бурей. Комитет марокканского действия доказал, что за ним стоят массы, а великий визирь Мухаммад аль-Мукри настойчиво напоминает: колониальный аппарат не выдержит новой всеобщей забастовки, если националисты объединятся с подпольными профсоюзными ячейками.\n\nЧтобы перехватить инициативу, генерал-резидент решился на беспрецедентный шаг — официально пригласить лидеров МКД во главе с Аллалем аль-Фаси и Мухаммадом аль-Уаццани за стол переговоров в Рабате. Впервые в истории протектората Франция готова обсуждать «План реформ» напрямую с марокканской интеллигенцией.\n\nИз Парижа идут противоречивые сигналы: левое крыло правительства требует «найти компромисс», а правое и генералитет считают эти переговоры капитуляцией перед туземцами."
 mor_dated.12.a: "Всё решится за столом переговоров"
 mor_dated.12.a.tt: "Открывается доступ к фокусу «Начать пересмотр «плана реформ»»"

 mor_dated.13.t: "Неурожайный год"
 mor_dated.13.d: "Начало года может превратить этот год в катастрофу. Из-за сильного неурожая зерновых в предыдущие годы администрация ввела жёсткое регулирование цен на хлеб и муку для предотвращения спекуляций, а полное отсутствие дождей в этом году может начать голод в южных и центральных регионах страны.\n\nСултан Мухаммед V запросил у французов выделения дотаций и посевного зерна для беднейших марокканских феллахов."
 mor_dated.13.a: "Франция должна с этим помочь"

