 # ================= ОПИСАНИЯ ТРЕЙТОВ: ПРАВИТЕЛИ =================
 mor_soft_character_desc: "Вежливый, терпеливый и неторопливый генерал-резидент предпочитает получить подпись, а не приказывать её поставить. Махзен вздыхает свободнее, а дела идут заметно быстрее, пока Париж читает очередную депешу."
 mor_resident_satrap_desc: "Губернатор указом, который лучше управляет из кабинета, чем среди тех, кем управляет. Приказы из Рабата исполняются и оскорбляют одинаково быстро, а Резиденция всё увереннее в собственной силе — и всё меньше нуждается в согласии страны."
 mor_french_resident_general_desc: "Солдат, а затем проконсул, Ножес правит Марокко как оккупационной армией в гражданском мундире. Ничто, что движется к независимости, не обходится без его благословения на промедление."
 mor_pacifier_of_the_rif_wolf_desc: "Он гонялся за Абд эль-Кримом по тем же горам и понял, как на Рифе воюют на самом деле: водой, вьючными тропами и умением отделить деревни от повстанцев. Мир для него — лишь усмирение, которое не довели до конца."
 mor_voice_of_the_nation_desc: "Когда говорит Аллаль аль-Фаси, петиции, комитеты и толпа движутся в одну сторону. Нация, сумевшая договориться об одной фразе, стоит больше политической власти, чем десяток партий, спорящих о программе."
 mor_constitutional_reformer_desc: "Уаззани утверждает, что требование парламента — не мятеж, а старейшее притязание шарифской империи, и что страна, записавшая пределы власти, управляет собой лучше той, что ждёт, пока эти пределы пожалуют."
 mor_limited_monarch_desc: "Повелитель всего, что он видит, и пленник всех, кто смотрит на него: султан царит в пределах, оставленных договорами, дорожит своей благосклонностью и взвешивает каждую группировку, включая собственную, с той же терпеливой арифметикой."
 mor_descendant_of_the_prophet_desc: "Шариф, потомок пророка и повелитель правоверных — родословная, которая заканчивает спор ещё до его начала. Послушание достаётся дешевле, а войну, объявленную его именем, можно объяснить с любой кафедры в стране."
 mor_hope_of_the_nationalists_desc: "Националисты нашли то, чего Резиденция арестовать не умеет: султана, который публично отвечает на их петиции. Каждую неделю, что он сидит на троне и не выбирает сторону, разрыв между троном и нацией сокращается."
 mor_opponent_of_fascism_desc: "Султан читал и испанские, и немецкие газеты и повторяет на каждом собрании: рубашки, высадившиеся у Альхусемас, были не освободителями, а новым хозяином с лучшей прессой."
 mor_internationalist_ideologue_desc: "Для него протекторат — лишь звено цепи, тянущейся от Тетуана до Астурии, и те, кто добывает фосфат, прежде всего работники, а не марокканцы. Этот довод убеждает докеров, шахтёров и иностранных добровольцев, которых ни один султан не смог бы призвать."
 mor_voice_of_the_maghreb_desc: "Из мечети и со страниц газеты Торрес требует Марокко, единого по обе стороны границ, проведённых в Фесе, и обещает: стране, которая посмеет вооружиться, начнут внимать. Его риторика обостряет любые военные цели и заметно злит двух соседей."
 # ================= ОПИСАНИЯ ТРЕЙТОВ: КОНЦЕРНЫ =================
 mor_phosphate_monopoly_desc: "Фосфорит — это в основном камень, и камень лежит здесь. Концессии Управления дают хромит, который военной промышленности нужен не меньше, чем сельскому хозяйству, а собственные ветки позволяют государству забирать большую долю того, что отдаёт земля."
 mor_railway_company_desc: "Железные дороги — это политика: километры путей, поворотные круги и водонапорные башни решают, доедет ли урожай до порта, а дивизия до границы. При такой дешёвой рабочей силе компания кладёт рельсы быстрее, чем формально позволяют концессии."
 mor_coal_mines_of_jerada_desc: "Бедные пласты, глубокие шахты, упорные люди. Джерада даёт едва заметное количество угля, но добытый в Марокко уголь не нужно покупать в Ньюкасле, а его доменные печи питают топливные заводы, на которых держится промышленность."
 mor_zellidja_mining_company_desc: "Рудник Слег-Бумаубер даёт свинец, цинк и главное вольфрам — металл, нужный каждой программе вооружений и оставляемый про запас каждой нейтральной страной. При усиленной работе растёт и эффективность фабрик повсюду: станки перестают ждать импортного сплава."
 mor_omnium_nord_africain_construction_desc: "«Омниум» строит порты, трамваи, склады, ледники и целые кварталы и сдаёт внаём своих инженеров, бетон и грузовики тому, кто подпишет счёт. Стройки идут быстрее — как и та доля продукции страны, которую съедают его книги."
 mor_energie_electrique_du_maroc_power_desc: "Электричество — единственный товар, который протекторат не может дешёво ввезти. Если плотины и тепловые станции в нашем распоряжении, фабрики работают на собственном токе, над равниной растут заводы синтетического топлива, а радиолокационным станциям хватает ампер на пользу делу."


 # ================= ОПИСАНИЯ ТРЕЙТОВ: МИНИСТРЫ =================
 mor_disloyal_grand_vizier_desc: "Аль-Мукри служит султану на людях, а нации — наедине с собой. Другие министры покупают свои должности; покровительство великого визиря заставляет махзен держаться на верности делу, а не Резиденции, что последней крайне досаждает."
 mor_makhzen_financier_desc: "Финансист старой школы, который сводит бюджет, выжимая откупщика и срезая таможню. Он высвобождает ровно достаточно денег, чтобы что-то построить, и оставляет населению чуть меньше нищеты, чем требует ведомость."
 mor_first_agronomist_engineer_desc: "Выученный во французской агрономической школе и вернувшийся в деревню, где всё ещё пашут деревянной сохой, он настаивает: первая промышленность Марокко — это земля. Лучше семена, колодцы и севооборот — и деревни растут, и земля появляется для других дел."
 mor_makhzen_educator_desc: "Он одинаково серьёзно преподаёт и в медресе, и в техническом училище, и утверждает: страна, способная прочитать собственные договоры, не даст себя обмануть ими. Грамотность, терпение и немного арифметики держат нацию ровно."
 mor_master_of_royal_ceremonies_desc: "Хранитель протокола, прошений и списка тех, кого допускают ко двору, он превращает церемонию в политику: престиж султана прибывает вовремя и со свидетелями, и ни один значимый человек в стране не сомневается, где теперь честь."
 mor_berber_writer_desc: "Сын Атласа, который пишет на ташелхите о Марокко, существовавшем до Феса, до Марракеша и до договоров, — и его история тихо доказывает, что эта земля ничьей провинцией не была, даже французской."
 mor_captain_of_industry_desc: "Ламрани построил торговый и промышленный дом в Касабланке, когда в протекторате были уверены, что марокканец способен лишь сдавать руду. Его цехи, его книги и его привычка управлять напрямую переносится в национальную программу производства."
 mor_economist_reformer_desc: "Он считает, что страну удерживает или поднимает благосостояние, а не риторика, и предлагает налоги, кредит и кооперативы, после которых у крестьянина остаётся чуть больше из того, что он вырастил."
 mor_jewish_community_leader_desc: "Раввин меллахов, он настаивает, что марокканские евреи — марокканцы, и у него есть раввины и торговцы, готовые это доказать там, где одного слова султана мало. Проповедь терпения и благотворительности укрепляет страну; науку она не ускоряет."
 mor_minister_of_spying_desc: "У Кандусси родня в каждой касбе и осведомители в каждой кофейне. То, что начиналось как частная служба сплетен султана, стало чем-то близким разведке: быстрее в работе, труднее для проникновения и скромно ведёт собственные счета."
 mor_minister_of_education_desc: "Он хочет переписать программу так, чтобы марокканский ребёнок изучал географию Марокко, и добавить техническое обучение, чтобы страна перестала ввозить людей, которые обслуживают её станки."
 mor_minister_of_propaganda_desc: "Он знает, на какую струну нажимать в каждом квартале, на каком языке и в какой день. Его сводки делают доводы правительства привычнее, чем призыв к молитве, а война, объяснённая прессой, — война, которую большинство примет."
 mor_minister_of_foreign_affairs_desc: "Балафредж уже защищал марокканское дело в парижской прессе и перед иностранными канцеляриями. Он говорит с послами без почтения, которого ждёт протекторат, — и именно поэтому послы теперь приходят к нему."
 mor_minister_of_agriculture_desc: "Его министерство ведает семенами, колодцами, саранчой и поливными паями, а значит в Марокко ведает всем остальным тоже. Деревни накормлены, земля описана, и сырьё перестаёт уезжать из страны неучтённым и необработанным."
 mor_democratic_ideologue_desc: "Он терпеливо и на трёх языках объясняет, что парламент — не французский институт, а ограничение власти, и что нация, ограничившая своих правителей, уже сама собой управляет. Такие доводы собирают сторонников и выигрывают время."
 mor_liberal_journalist_desc: "Его газета печатает петиции, вырезанные абзацы и имена, которые Резиденция предпочла бы забыть. Каждый номер даёт правительству оппозицию, которую нельзя арестовать, а публике — версию событий, сочинённую не властями."
 mor_social_activist_desc: "Профсоюзный секретарь, кассир кассы взаимопомощи и переговорщик забастовок, он работает там, где город строится: доки, трамвай, барачные кварталы. Где он устраивает, там появляются дороги, дешевеет хлеб и растёт население — хотя бы потому, что его кормят."
 mor_loyal_grand_vizier_desc: "Эль-Глави держит юг для трона, а трон — для махзена. Такая верность не стоит государству ни одной взятки и даёт ему короля, чей престиж растёт с каждым племенем, откликнувшимся на зов великого визиря."
 mor_falangist_imitator_desc: "Он заимствует рубашки, литургию и дисциплину испанской Фаланги, аккуратно убрав из неё Испанию, и организует молодежь, цехи и строевую подготовку с эффективностью, которая смущает более утонченных националистов."
 mor_head_of_religious_affairs_desc: "Возглавляя духовное ведомство, ан-Насири ставит улемов за троном, а договоры — за улемами: шарифское государство законно, потому что так говорит шариат, и доводы из Парижа в суде шариата веса не имеют."
 mor_underground_organizer_desc: "Когда партию ушли в подполье, он научился печатать, передавать, прятать и организовывать, не попадаясь на глаза. Это ремесло даёт ячейки, адреса и агентов, которых можно отправить за границу и получить обратно с целыми документами."
 mor_mountain_cartographer_desc: "Он снимал перевалы, которые карты Резиденции оставлены пустыми, и знает, по каким тропам проходят мулы, по каким грузовики, а по каким батальон. Знание превращает Атлас из препятствия в границу, которую можно оборонять."
 mor_communist_industrial_commissar_desc: "Профсоюзник, ставший народным комиссаром промышленности, он ставит план выше прибыли, а фабрику под трудовую дисциплину — и получает продукцию, потому что подчиняющиеся ему люди знают завод лучше смещённых директоров."
 mor_railway_and_nodes_commissar_desc: "Он понимает, что армия движется по расписанию, и держит каждый паровоз, путь, кран и водонапорную башню в одном ведомстве. Железные дороги и узлы снабжения появляются быстро, потому что никто не волен строить одну и ту же линию дважды."
 mor_trade_unionist_desc: "Профсоюзный председатель, переговорщик и — на своей стороне — срыватель забастовок, он научил цехи торговаться и работать. Дисциплина, усвоенная на пикете, аккуратно переносится в фабричный наряд и в военкомат."
 mor_voice_of_the_underground_desc: "Эль-Малех пишет под псевдонимами для газет, отпечатанных в тайне, и правительство, которое он грызёт, не может найти типографию. Его перо приносит запрещённой партии политическую власть, а контрразведка уже не верит собственным делам."
 mor_engineer_of_labour_desc: "Он перестраивает смены, графики ремонта и расстановку станков, повторяя, что Марокко не может позволить себе потерять ни часа рабочего дня. Фабрики у него работают горячее, плотнее и загруженнее, чем обещали расчёты."
 mor_workhorse_of_the_politburo_desc: "Человек, который читает каждое дело, готовит каждый отчёт и ни разу не просил отпуска. Бюрократия такого сорта действительно приносит политическую власть и выпуск продукции — за скромный счёт уровня жизни всех, кто на неё работает."
 mor_editor_of_the_party_press_desc: "Его печать объясняет линию, называет врага по имени и печатает списки исчезнувших, из-за чего газета одновременно является учительницей партии, её летописью и самым разыскиваемым изданием."
 mor_mother_of_emancipation_desc: "Фортуна Султан организовывала школы, помощь и работу для мусульманских женщин задолго до того, как какое-либо ведомство сочло это нужным. Её сети добавляют руки в людские ресурсы и женщин в рабочие списки, а дороги и мастерские, которых она добивается, появляются быстрее срока."
 mor_labour_minister_desc: "Министр труда, знающая станок не понаслышке, она задаёт наряды, технику безопасности и обучение и относится к сытому, пристроенному и учтённому рабочему как к вложению. От этого зависят и выпуск, и вербовка, и рождаемость."
 mor_minister_of_enlightenment_desc: "Ей нужны школы, библиотеки, женские классы и ликбез-бригады, и у неё дурная привычка замечать, что неграмотная страна не способна себя защитить. Распространённые идеи делают людей труднее для неожиданности и труднее для управления."
 mor_ulema_of_the_north_desc: "Учёный Лиги Севера, преподающий в Тетуане право, грамматику и историю, чей иджаза весит в Рифе больше любого диплома, подписанного в Париже. Знание, благословлённое религией, расходится быстро и успокаивает то, до чего дотрагивается."
 mor_shadow_banker_desc: "Он гоняет деньги через Тетуан и Танжер способами, после которых не остаётся фирменного бланка, финансируя партии, газеты и агентов с одинаковой ненавязчивой расторопностью. Такие счета приобретают друзей за границей и сведения дома и не фигурируют ни в одном бюджете."
 mor_youth_organization_leader_desc: "Он строит, учит и вербует мальчишек, которые не знали ничего, кроме протектората, и уверен: поколение с флагом, классом и плацем будет не тем поколением, что их отцы."
 # ================= ИМЕНА СОВЕТНИКОВ =================
 MOR_ouazzani_minister_of_propaganda: "Мухаммед Хасан аль-Уаззани"
 MOR_torres_falangist_imitator: "Абдельхалек Торрес"

