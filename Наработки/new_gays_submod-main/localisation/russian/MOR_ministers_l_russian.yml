l_russian:
 # ================= КОНЦЕРНЫ МАРОККО =================
 MOR_office_cherifien_des_phosphates: "Шерифское управление фосфатов"
 MOR_office_cherifien_des_phosphates_desc: "Основанное в 1920 году, Управление обладает монополией на рудники Хурибки, Бенгерира и Юсуфии, чей фосфорит одевает поля половины Европы. Его добыча исчисляется миллионами тонн, а дивиденды — политическим влиянием: кто владеет Управлением, тот владеет и бюджетом протектората, а привозная руда оставляет достаточно хрома и для наших литейных цехов."
 MOR_chemins_de_fer_du_maroc: "Марокканская железнодорожная компания"
 MOR_chemins_de_fer_du_maroc_desc: "Единая концессия связывает Касабланку с фосфатным плато и портами Фдалы и Могадора. Её узкоколейки, поворотные круги и мастерские — настоящие артерии протектората, и хозяин этих путей решает, с какой скоростью в стране вообще что-либо движется."
 MOR_charbonnages_de_jerada: "Угледобывающие предприятия Джерады"
 MOR_charbonnages_de_jerada_desc: "В восточном Рифе, близ алжирской границы, шахты Джерады выдирают из гор буроугольные пласты. Пласты бедны, работа каторжная, но это единственное отечественное твёрдое топливо Марокко — то, что держит в огне наши паровозы, газовые заводы и доменные печи."
 MOR_societe_des_mines_de_zellidja: "Горнодобывающая компания Зеллиджи"
 MOR_societe_des_mines_de_zellidja_desc: "Район Слег-Бумаубер близ Марракеша разрабатывают со времён финикийцев; теперь Общество добывает там свинец, цинк и вольфрам на французской технике и марокканскими руками. Добыча невелика, зато вес стратегический: вольфрам нейтральная страна продаёт всем, а воюющая — приберегает."
 MOR_omnium_nord_africain: "Североафриканское объединение"
 MOR_omnium_nord_africain_desc: "Парижинговый холдинг с марокканским лицом, разом поглотивший портовые работы, трамваи, пивоварни, ледники, доки и строительные конторы протектората. Там, где поднимаются его краны, город перестраивают по-французски — но его инженеры, дороги и бетономешалки доступны тому, кто оплатит счёт."
 MOR_energie_electrique_du_maroc: "Электроэнергия Марокко"
 MOR_energie_electrique_du_maroc_desc: "Плотины на Ум-эр-Рбии, тепловые станции Касабланки и сеть высоковольтных линий, питающих рудник, порт и трамвай — «Электроэнергия Марокко» продаёт стране свет по тарифу, установленному в Париже. Привяжите его директоров к нашему делу — и ток, служивший колонистам, погонит марокканские станки."

 # --- трейты концернов ---
 mor_phosphate_monopoly: "Фосфатный монополист"
 mor_railway_company: "Железнодорожная компания"
 mor_coal_mines_of_jerada: "Угольные шахты Джерады"
 mor_zellidja_mining_company: "Горнодобывающий концерн"
 mor_omnium_nord_africain_construction: "Строительный концерн"
 mor_energie_electrique_du_maroc_power: "Энергетический концерн"

 # ================= ВПО МАРОККО =================
 MOR_compagnie_de_transports_au_maroc_organization: "Марокканская транспортная компания"
 MOR_compagnie_de_transports_au_maroc_organization_desc: "Крупнейший гараж, таксопарк и автоперевозчик протектората — единственное место в Марокко, где двигатели, шасси и водители собраны на одном дворе. Его мастерские быстро учатся строить то, что прежде лишь ремонтировали."
 MOR_societe_des_ports_marocains_organization: "Общество марокканских портов"
 MOR_societe_des_ports_marocains_organization_desc: "Доки, эллинги, краны и ремонтные сараи Касабланки, Танжера и Могадора. Повреждённый в море корпус приходит сюда, чтобы его вскрыли, залатали и снова отправили в море — порой уже совсем не тем, чем он прибыл."
 MOR_etablissements_industriels_de_casablanca_organization: "Промышленные предприятия Касабланки"
 MOR_etablissements_industriels_de_casablanca_organization_desc: "Литейные, механические и сборочные цеха на краю европейского квартала, построенные для ремонта колониального подвижного состава. Шасси, гусеницы и бензиновые двигатели им по зубам — путь от трактора до пехотного танка короток."
 MOR_casablanca_anfa_breguet_organization: "Аэродром Касабланка-Анфа и мастерские Бреге"
 MOR_casablanca_anfa_breguet_organization_desc: "Атлантическая база гидросамолётов и соседние мастерские Бреге, где чинят почтовые летающие лодки «Аэропостали» на линии Тулуза — Дакар. Лёгкие планеры, поплавки и разведчики — их повседневный хлеб."
 # ================= МИНИСТРЫ МАРОККО =================
 MOR_muhammad_al_muqri: "Мухаммад аль-Мукри"
 MOR_muhammad_al_muqri_desc: "Великий визирь султана, который правит лишь на бумаге, он держит печать, через которую проходит каждый дахир. Расторопен, незаменим и совершенно нелоялен: он служит махзену как институту, а не человеку на троне, и за время его работы в совете ни одного советника нельзя купить дёшево."
 MOR_taieb_al_muqri: "Тайеб аль-Мукри"
 MOR_taieb_al_muqri_desc: "Хранитель книг махзена и его неловкостей. Он выжимает налоги и пошлины из деревни, которой нечего больше отдавать, платит контрибуции, требуемые Парижем, и всё же находит золото для дворцов. Его компетентность никто из реформистов честной не назовёт."
 MOR_thami_al_muqri: "Тами аль-Мукри"
 MOR_thami_al_muqri_desc: "Первый марокканец, получивший образование инженера-агронома во Франции и вернувшийся измерять почву, на которую государство никогда не смотрело. Он говорит об орошении, севообороте и засолении в стране, где феллах сеет то же, что дед, — и прав в каждом слове."
 MOR_ahmed_bargach: "Ахмед Баргач"
 MOR_ahmed_bargach_desc: "Министр образования государства, в котором почти нет школ. Баргач с одинаковой усталостью руководит кораническими училищами и горсткой французских колледжей, прекрасно понимая, что программу в Рбате пишут лишь тогда, когда это позволяет Париж."
 MOR_mohammed_mammeri: "Мохаммед Маммери"
 MOR_mohammed_mammeri_desc: "Глава протокола и двора шерифского двора: Маммери знает, куда посадить каждое племенное посольство, какой подарок почтит каида, а какой оскорбит его. Точность церемониала — последняя роскошь, которую может позволить себе сюзерен, и он бережёт её как казну."
 MOR_abdelaziz_bendriss_amraoui: "Абдельазиз Бендрисс Амрауи"
 MOR_abdelaziz_bendriss_amraoui_desc: "Рифский писатель, который переносит Атлас в литературу, а племена — в политику. Его очерки убеждают горцев, что их язык и их верность не противоречат друг другу — полезный довод, пока на равнине спорят лишь о том, кто собирает с них налоги."
 MOR_mohammed_karim_lamrani: "Мухаммед Карим Ламрани"
 MOR_mohammed_karim_lamrani_desc: "Купеческий князь Феса, прошедший путь от зерна к мельницам и внешнеторговым домам и заседающий в советах промышленности протектората, ни разу не спросив разрешения Парижа. Он считает на станки, а не на почести, — а станков стране и не хватает."
 MOR_tawheed_al_faraj: "Таухид Аль-Фарадж"
 MOR_tawheed_al_faraj_desc: "Экономист новой школы, прочитавший и Адама Смита, и Коран и намеревающийся их помирить. Он доказывает, что страна, дёшево кормящая рабочих, покупает покорность ещё дешевле, а бюджет государства — документ нравственный."
 MOR_yisrael_abu_hatzira: "Рабби Исраэль Абухацейра"
 MOR_yisrael_abu_hatzira_desc: "Глава раввинских судов марокканских меллахов, потомок династии мудрецов и советник и иудеям, и мусульманам. Должностей он не любит, а детей — очень, и его решения держат древние еврейские общины Марокко в мире с соседями."
 MOR_moulay_driss_kandoussi: "Мулай Дрисс Кандусси"
 MOR_moulay_driss_kandoussi_desc: "Человек с роднёй в каждой касбе и осведомителями в каждой кофейне. Кандусси превратил султанскую полицию сплетен во что-то близкое к разведке и докладывает услышанное без лести."
 MOR_boubker_el_kadiri: "Бубкер эль-Кадири"
 MOR_boubker_el_kadiri_desc: "Учитель из семьи улемов, который научился управлять министерством, управляя классами. Он считает, что ребёнок, читающий по-арабски и считающий по-французски, однажды станет для кого-то опасен, — и намерен, чтобы опасен он был для нужного человека."
 MOR_ahmed_balafrej: "Ахмед Балафредж"
 MOR_ahmed_balafrej_desc: "Инженер по образованию, националист по призванию и автор черновика Плана реформ 1934 года. Балафредж спорит с французскими министрами на безупречном парижском французском и не даёт им забыть, что говорит как марокканский гражданин, а не как защищаемый подданный."

 MOR_omar_abdeljalil: "Омар Бенабдельджалил"
 MOR_omar_abdeljalil_desc: "Агроном, ставший министром и проведший жизнь среди оливковых террас и зерновых равнин. Он точно знает, сколько собирает феллах, сколько забирает колонист и сколько собрало бы марокканское государство, если бы стояло на собственных ногах."
 MOR_mohamed_diouri: "Мохамед Диури"
 MOR_mohamed_diouri_desc: "Фасский адвокат и заводила национальной молодёжи, прочитавший конституции всех молодых республик и намеревающийся написать марокканскую. Он защищает парламент, избирательное право и билль о правах с терпением человека, готового сто раз услышать «нет»."
 MOR_mohamed_lyazidi: "Мохамед Лязиди"
 MOR_mohamed_lyazidi_desc: "Редактор, журналист и неистощимый памфлетист; Лязиди пишет доводы, которые потом произносят ораторы движения. Он либерал в старом смысле: убеждён, что напечатанное предложение прочнее паши, а единственный цензор, которого стоит уважать, — читатель."
 MOR_abdallah_ibrahim: "Абдалла Ибрагим"
 MOR_abdallah_ibrahim_desc: "Профсоюзник касабланкской гавани, ставший человеком движения среди рабочих медины. Он строит клиники, кооперативы и вечерние школы тем же методом, что и стачки: терпеливо, на людях и никогда в одиночку."
 MOR_thami_el_glaoui: "Тами Эль Глави"
 MOR_thami_el_glaoui_desc: "Владыка Атласа, паша Марракеша, хозяин сорока тысяч всадников и дороги, по которой фосфаты идут к морю. Эль Глави поддержал султана, когда это было опасно, и держал горы тихими, когда это было выгодно; он продавал верность тому, кто давал больше, и всегда отрабатывал деньги."
 MOR_mohammed_al_makki_al_nasiri: "Мохаммед аль-Макки ан-Насири"
 MOR_mohammed_al_makki_al_nasiri_desc: "Потомок великого историка ан-Насири и ныне глава духовного ведомства шерифского государства. Он держит кади, завии и пятничные проповеди в строю вместе с троном и считает защиту веры делом канцелярии не меньше, чем молитвы."
 MOR_sidi_ahmed_bin_al_ahmar: "Сиди Ахмед Бен аль-Ахмар"
 MOR_sidi_ahmed_bin_al_ahmar_desc: "Учёный Лиги улемов Севера, преподающий в медресе Тетуана и Феса и настаивающий, что мусульманин может изучать европейскую науку, не переставая быть мусульманином. Его поддержка весит для студентов севера как реформистская фетва."
 MOR_ali_bin_al_ahmar: "Али Бен аль-Ахмар"
 MOR_ali_bin_al_ahmar_desc: "Брат, банкир и тихая половина семейного дела. Али аль-Ахмар гоняет кредиты между Фесом, Танжером и Алжиром по счетам, которых не видел ни один генерал-резидент, и одалживает делам, которые не обсуждает, — при условии, что им возвращают и делают это тихо."
 MOR_muhammed_daoud: "Мухаммад Дауд"
 MOR_muhammed_daoud_desc: "Начальник скаутского и молодёжного движения, выстроенного в шеренги и научившегося читать карту не хуже страницы на арабском. Он превращает бездельников медины в строевую выправку, с которой считаются и друзья, и враги правительства."
 MOR_torres_falangist_imitator_desc: "Торрес наблюдал, как испанская Фаланга марширует по Тетуану в рубашках, со своей литургией и обещаниями национально-синдикалистского порядка, и решил, что Марокко может заимствовать театр, оставив за собой пьесу. Его программа корпоративна по форме, националистична по сути и рассчитана на одну аудиторию: толпу."
 MOR_ouazzani_minister_of_propaganda_desc: "Редактор «Л'асьон марокен» теперь говорит за правительство, а не против него, и его пресса знает, на какую струну нажимать в каждом квартале. Режим, позволивший Уаззани писать свои бюллетени, сдал то единственное оружие, которого Франция всегда боялась, — марокканское печатное слово."

 # --- министры-коммунисты ---
 MOR_michel_mazella: "Мишель Мазелла"
 MOR_michel_mazella_desc: "Касабланкский докер, выросший из рядового французской секции Коминтерна в руководителя подполья марокканской партии: конспиративные квартиры, фальшивые документы, курьерские тропы через медину. Его арестовывали дважды, и с тех пор он организовал три стачки."
 MOR_jean_dresch: "Жан Дреш"
 MOR_jean_dresch_desc: "Геодезист, снимавший Риф для колонн «умиротворения», а затем передавший листы той стороне. Он знает каждую вьючную тропу, каждое вади и каждый перевал между Тазой и Аль-Хусеймой, а горы, верно нанесённые на карту, уже наполовину завоёваны."
 MOR_michel_colonna: "Мишель Колонна"
 MOR_michel_colonna_desc: "Инженер портовых работ и профсоюзный агитатор, поставленный теперь над цехами, которые революция национализировала. Он говорит с мастерами на языке цеха и выжимает тоннаж из станков, которые прежние владельцы считали ломом."
 MOR_charles_dupuy: "Шарль Дюпюи"
 MOR_charles_dupuy_desc: "Железнодорожник с линии Фдала, организатор стачки 1936 года, а теперь хозяин подвижного состава, депо и узлов снабжения. Он скажет, какой узел удержит дивизию, а какой удержит только отговорку."
 MOR_paul_durel: "Поль Дюрель"
 MOR_paul_durel_desc: "Секретарь союзов докеров и грузчиков, человек протоколов и массовых пикетов. Он научился считать рабочих так, как интендант считает винтовки, — и ни того, ни другого партии всегда не хватает."
 MOR_edmond_amran_el_maleh: "Эдмон Амран Эль Малех"
 MOR_edmond_amran_el_maleh_desc: "Интеллектуал-иудей из Эс-Сувейры, пишущий для нелегальной прессы на трёх языках и переправляющий тиражи между ними. В его строках весь спор марокканского коммунизма: освобождение не имеет ни религии, ни расы."
 MOR_abraham_serfati: "Авраам Серфати"
 MOR_abraham_serfati_desc: "Электрик и технический организатор касабланкских советов, способный оживить остановившуюся турбину и потом объяснить, почему виноват владелец. Показатели производства ходят за ним, как молва."
 MOR_ali_yata: "Али Ята"
 MOR_ali_yata_desc: "Берберский рабочий из Мазагана, ставший партийным организатором, — терпеливый, гибкий в доктрине и неистощимый. Он делает работу, которую не снимают: карточки, ячейки, кассу, похороны — ту механику, на которой вообще держатся революции."
 MOR_mohammed_ferhat: "Мухаммед Ферхат"
 MOR_mohammed_ferhat_desc: "Редактор арабоязычного издания партии, перекладывающий Маркса на пословицы, о которых в медине спорят за мятным чаем. За заголовок его судили чаще, чем большинство людей судят вообще."
 MOR_fortune_sultan: "Фортуне Султан"
 MOR_fortune_sultan_desc: "Жена Леона Султана, редактор и организующая сила женского движения Касабланки. Она успевала отстоять право голоса, заводскую столовую и женскую школу на одном собрании, и никто никогда не упрекал её в малодушии."
 MOR_lucette_mazella: "Люсетт Мазелла"
 MOR_lucette_mazella_desc: " машинистка союзной типографии, ставшая министром труда нового режима и пишущая тарифные сетки, правила охраны труда и декреты о материнстве, которые прежние концессионеры называли утопией. Каждый договор она читает до подписи."
 MOR_freyha_ayache: "Фрея Айаш"
 MOR_freyha_ayache_desc: "Учительница еврейских школ Касабланки, бившаяся за смешанные, светские и бесплатные классы задолго до того, как революция сделала это политикой. Теперь она строит школьную сеть и не позволяет грамотности стать лозунгом вместо расписания."

 # --- названия трейтов министров ---
 mor_disloyal_grand_vizier: "Нелояльный великий визирь"
 mor_makhzen_financier: "Финансист махзена"
 mor_first_agronomist_engineer: "Первый инженер-агроном страны"
 mor_makhzen_educator: "Министр просвещения махзена"
 mor_master_of_royal_ceremonies: "Глава королевского протокола"
