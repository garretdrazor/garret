l_russian:
 MOR_power_balance: "Противостояние Мухаммеда V и Французского правления"
 MOR_sultan_side: "Султан Мухаммед V"
 MOR_resident_side: "Генерал-резидент"
 MOR_bop_balance_range: "Равновесие (0-25 %)"
 MOR_bop_sultan_25_range: "Влияние султана — 25 %"
 MOR_bop_sultan_50_range: "Влияние султана — 50 %"
 MOR_bop_sultan_75_range: "Влияние султана — 75 %"
 MOR_bop_sultan_100_range: "Полная власть султана"
 MOR_bop_resident_25_range: "Влияние резидента — 25 %"
 MOR_bop_resident_50_range: "Влияние резидента — 50 %"
 MOR_bop_resident_75_range: "Влияние резидента — 75 %"
 MOR_bop_resident_100_range: "Полное прямое администрирование"
 MOR_balance_of_power_category: "Баланс сил"
 MOR_balance_of_power_category_desc: "После установления протектората власть оказалась разделена между султаном и генеральным резидентом. Последний ничего не мог сделать без согласия султана, а тот, в свою очередь, также не мог предпринять ничего без санкции резидента. Недоставленное таким образом султану право вето было, по сути дела, главным элементом марокканского суверенитета. Подобная двойственность делала крайне затруднительным однозначное толкование понятия протектората. Но французы нашли свой путь: перехватив большую часть власти, они перешли в режим прямого администрирования. Султану придётся постараться, чтобы начать возвращать себе институты власти.\n§RЭта категория решений исчезнет, как только Марокко станет независимым или к власти придут коммунисты.§!"
 MOR_french_colonial_policy_category: "Колониальная политика в Марокко"
 MOR_french_colonial_policy_category_desc: "Каждый институт власти, который генерал-резидент вырывает у махзена, тянет баланс сил в Марокко в сторону Парижа — а каждый его шаг даёт резидентуре новый законный повод понизить статус Султаната."
 MOR_appeal_to_the_faithful: "Обратиться к верующим в мечети"
 MOR_appeal_to_the_faithful_desc: "Проповедь, произнесённая от имени Повелителя правоверных, напоминает стране, что её власть старше любой резолюции резидентуры: голоса мечетей Феса, Марракеша и Рабата значат для махзена больше, чем любая нота Парижа.\n§GСмещает баланс сил на 10 % в пользу Мухаммеда V.§!"
 MOR_request_support_from_metropole: "Получить поддержку из метрополии"
 MOR_request_support_from_metropole_desc: "Резидентура добивается от Парижа нового займа, новых чиновников и нового гарнизона — и каждый прибывший из Марселя клерк подтверждает, кто в протекторате хозяин.\n§RСмещает баланс сил на 10 % в пользу генерал-резидента.§!"
 MOR_restore_legislative_initiative: "Вернуть султану право законодательных инициатив"
 MOR_restore_legislative_initiative_desc: "По Фесскому договору дахир вступает в силу лишь после визы резидента, но само право сочинять законы принадлежит Престолу — и махзен намерен пользоваться им снова, а не переписывать французские проекты.\nОткрывает доступ к политикам, усиливающим поддержку демократии и монархии, и к части фокусов политического древа, связанных с укреплением позиций монарха.\n§GБаланс сил сдвигается на 20 % в пользу султана; тултип «Генерал-резидент обладает правом законодательных инициатив» теряется, «Султан обладает правом законодательных инициатив» получается.§!"
 MOR_restore_control_over_economy: "Вернуть султану контроль над экономикой"
 MOR_restore_control_over_economy_desc: "Хабусные земли, таможенные пошлины и права на фосфаты формально остаются достоянием Престола — достаточно перестать отдавать их французским компаниям и их назначенцам.\nОткрывает доступ к редактированию экономических законов и к части фокусов экономического древа, связанных с самостоятельным развитием.\n§GБаланс сил сдвигается на 20 % в пользу султана; тултип «Генерал-резидент контролирует экономику» теряется, «Султан контролирует экономику» получается.§!"
 MOR_restore_control_over_internal_order: "Вернуть султану контроль над внутренним порядком в стране"
 MOR_restore_control_over_internal_order_desc: "Махзен вновь набирает мухаллифов и каидов, которые отвечают перед султаном, а не перед французским контролёром, — и улицы медины охраняют свои же.\nОткрывает доступ к редактированию оккупационных законов и к части фокусов военного древа, связанных с полицией и оккупацией.\n§GБаланс сил сдвигается на 20 % в пользу султана; тултип «Генерал-резидент контролирует внутренний порядок Марокко» теряется, «Султан контролирует внутренний порядок Марокко» получается.§!"
 MOR_restore_control_over_army: "Вернуть султану контроль над армией"
 MOR_restore_control_over_army_desc: "Шарифская армия существует на бумаге и во французских мундирах; пора вернуть офицерские назначения и списки призыва под подпись султана, а не резидентуры.\nОткрывает доступ к редактированию законов о призыве и к части фокусов военного древа, связанных с реформированием армии.\n§GБаланс сил сдвигается на 20 % в пользу султана; тултип «Генерал-резидент контролирует армию» теряется, «Султан контролирует армию» получается.§!"
 MOR_restore_control_over_foreign_affairs: "Вернуть султану контроль над внешними связями"
 MOR_restore_control_over_foreign_affairs_desc: "Ни одно письмо за границу не уходило без визы резидента. Когда на шкале не осталось ничего другого, Престол забирает себе и внешние сношения — с этого момента Марокко говорит с миром собственным голосом.\nОткрывает доступ к редактированию законов о торговле и к части фокусов экономического древа, связанных с взаимодействием с иностранными державами.\n§GБаланс сил сдвигается на 20 % в пользу султана; тултип «Генерал-резидент контролирует внешние связи страны» теряется, «Султан контролирует внешние связи» получается.§!"
 MOR_strip_resident_executive_power: "Лишить генерал-резидента исполнительной власти"
 MOR_strip_resident_executive_power_desc: "Декреты резидентуры действуют лишь постольку, поскольку их исполняет махзен. Стоит каидам и пашиям получать приказы непосредственно из дворца — и администрация Парижа повисает в воздухе.\nОткрывает часть фокусов, связанных с самостоятельной политикой.\n§GБаланс сил сдвигается на 20 % в пользу султана; тултип «Генерал-резидент обладает исполнительной властью» теряется, «Султан обладает исполнительной властью» получается.§!"
 MOR_strip_resident_legislative_power: "Лишить генерал-резидента законодательной власти"
 MOR_strip_resident_legislative_power_desc: "Законы протектората писались в канцелярии резидента и лишь подписывались султаном. Перенос законодательной работы в шарифское правительство лишает резидентуру её главного оружия — бумаги.\nОткрывает часть фокусов, связанных с самостоятельной политикой.\n§GБаланс сил сдвигается на 20 % в пользу султана; тултип «Генерал-резидент обладает законодательной властью» теряется, «Султан обладает законодательной властью» получается.§!"
 MOR_strip_resident_judicial_power: "Лишить генерал-резидента судебной власти"
 MOR_strip_resident_judicial_power_desc: "Шариатские суды и суды каидов — древнейшая привилегия Престола; французским трибуналам оставляют дела поселенцев. Дело за малым: перестать передавать им марокканцев.\nОткрывает часть фокусов, связанных с судебными процессами против ярых сторонников французской власти и тех, кто брал от них взятки.\n§GБаланс сил сдвигается на 20 % в пользу султана; тултип «Генерал-резидент обладает судебной властью» теряется, «Султан обладает судебной властью» получается.§!"
 MOR_restore_spiritual_leader_title: "Вернуть титул духовного лидера"
 MOR_restore_spiritual_leader_title_desc: "Алауиты ведут род от самого пророка, и титул повелителя правоверных нельзя даровать ставленнику Парижа. Назначенный резидентурой муфтий смещается, а с ним смолкают и проповеди о верности Франции.\nОткрывает часть фокусов экономического древа, связанных с укреплением религии вокруг монарха.\n§GБаланс сил сдвигается на 20 % в пользу султана; тултип «Генерал-резидент установил подконтрольного духовного лидера» теряется, «Султан является духовным лидером Марокко» получается.§!"
 MOR_strip_sultan_executive_power: "Лишить султана исполнительной власти"
 MOR_strip_sultan_executive_power_desc: "Исполнение законов в протекторате — дело французских рук: контролёры, бюллетени резидентуры и отряды местной гвардии делают распоряжения султана бумагой, пока их не перепишут в канцелярии генерал-резидента.\nОткрывает часть фокусов, связанных с профранцузской политикой.\n§RБаланс сил сдвигается на 20 % в пользу генерал-резидента; тултип «Султан обладает исполнительной властью» теряется, «Генерал-резидент обладает исполнительной властью» получается.§!"
 MOR_strip_sultan_legislative_power: "Лишить султана законодательной власти"
 MOR_strip_sultan_legislative_power_desc: "Достаточно перенести подготовку дахиров в канцелярию резидентуры — и шарифское правительство превращается в то, чем его всегда считали в Париже: подпись под чужим текстом.\nОткрывает часть фокусов, связанных с профранцузской политикой.\n§RБаланс сил сдвигается на 20 % в пользу генерал-резидента; тултип «Султан обладает законодательной властью» теряется, «Генерал-резидент обладает законодательной властью» получается.§!"
 MOR_strip_sultan_judicial_power: "Лишить султана судебной власти"
 MOR_strip_sultan_judicial_power_desc: "Французские трибуналы объявляются компетентными во всех делах, где замешаны интересы протектората, — а это значит, что во всех. Шариатские суды остаются разбирать браки да наследство.\nОткрывает часть фокусов, связанных с судебными процессами против оппозиции французской власти.\n§RБаланс сил сдвигается на 20 % в пользу генерал-резидента; тултип «Султан обладает судебной властью» теряется, «Генерал-резидент обладает судебной властью» получается.§!"
 MOR_install_puppet_religious_leader: "Назначить нового духовного лидера"
 MOR_install_puppet_religious_leader_desc: "Титул повелителя правоверных — последняя опора Престола, и потому его стоит передать муфтию, обязанныму резидентуре карьерой. Проповедь о верности Франции стоит дешевле гарнизона.\nОткрывает часть фокусов экономического древа, связанных с религиозными альтернативами.\n§RБаланс сил сдвигается на 20 % в пользу генерал-резидента; тултип «Султан является духовным лидером Марокко» теряется, «Генерал-резидент установил подконтрольного духовного лидера» получается.§!"
 MOR_strip_sultan_legislative_initiative: "Лишить султана права законодательной инициативы"
 MOR_strip_sultan_legislative_initiative_desc: "Проект за подписью султана куда опаснее проекта резидентуры: он звучит как воля страны. Правотворчество целиком передаётся канцелярии генерал-резидента, махзену оставляют визу.\nОткрывает доступ к политикам, усиливающим поддержку авторитаризма и снижения автономии, и к части фокусов политического древа, связанных с поддержкой Франции.\n§RБаланс сил сдвигается на 20 % в пользу генерал-резидента; тултип «Султан обладает правом законодательных инициатив» теряется, «Генерал-резидент обладает правом законодательных инициатив» получается.§!"
 MOR_strip_sultan_control_over_economy: "Лишить султана контроля над экономикой"
 MOR_strip_sultan_control_over_economy_desc: "Фосфаты, порты, лес и хабусы приносят Франции столько, сколько она сама решит собирать. Директора компаний получают инструкции из резидентуры, а махзену оставляют церемониальную долю пошлин.\nЗакрывает доступ к редактированию экономических законов и открывает часть фокусов экономического древа, связанных с зависимым от Франции путём.\n§RБаланс сил сдвигается на 20 % в пользу генерал-резидента; тултип «Султан контролирует экономику» теряется, «Генерал-резидент контролирует экономику» получается.§!"
 MOR_strip_sultan_control_over_internal_order: "Лишить султана контроля над внутренним порядком в стране"
 MOR_strip_sultan_control_over_internal_order_desc: "Полицию, тюремно-лагерную часть и сыск передают французскому резиденту с марокканскими частниками под его командой — порядок в стране теперь дело резидентуры, а не махзена.\nЗакрывает доступ к редактированию оккупационных законов и открывает часть фокусов военного древа, связанных с французской помощью.\n§RБаланс сил сдвигается на 20 % в пользу генерал-резидента; тултип «Султан контролирует внутренний порядок Марокко» теряется, «Генерал-резидент контролирует внутренний порядок Марокко» получается.§!"
 MOR_strip_sultan_control_over_army: "Лишить султана контроля над армией"
 MOR_strip_sultan_control_over_army_desc: "Офицерские патенты, списки призыва и склады оружия переходят французскому генералитету: шарифская армия остаётся на бумаге, а командовать ею будут из резидентуры.\nЗакрывает доступ к редактированию законов о призыве и открывает часть фокусов военного древа, связанных с французским генералитетом.\n§RБаланс сил сдвигается на 20 % в пользу генерал-резидента; тултип «Султан контролирует армию» теряется, «Генерал-резидент контролирует армию» получается.§!"
 MOR_strip_sultan_control_over_foreign_affairs: "Лишить султана контроля над внешними связями"
 MOR_strip_sultan_control_over_foreign_affairs_desc: "Ни одна нота, ни один консул и ни одна торговая сделка не обходятся без визы резидента: внешние сношения Марокко становятся частью внешней политики Франции.\nЗакрывает доступ к редактированию законов о торговле и открывает часть фокусов экономического древа, связанных с взаимодействием с Францией.\n§RБаланс сил сдвигается на 20 % в пользу генерал-резидента; тултип «Султан контролирует внешние связи» теряется, «Генерал-резидент контролирует внешние связи страны» получается.§!"
 MOR_demand_puppet_status: "Добиться статуса марионетки"
 MOR_demand_puppet_status_desc: "При 25 % баланса сил в нашу пользу принадлежащие трону исполнительная, законодательная и судебная власти, титул духовного лидера и возвращённое право законодательных инициатив достаточны, чтобы Франция признала Султанат отдельным государством, а не отделом своей колониальной администрации."
 MOR_demand_colonial_status: "Добиться колониального статуса"
 MOR_demand_colonial_status_desc: "При 50 % баланса сил, когда к праву законодательных инициатив добавляются контроль над экономикой и внутренним порядком, Париж больше не может делать вид, что Марокко управляется напрямую — Фесский договор вспоминают, а колониальный статус восстанавливают."
 MOR_demand_dominion_status: "Добиться статуса доминиона"
 MOR_demand_dominion_status_desc: "При 75 % баланса сил в руках султана оказываются все инструменты внутренней власти; за его пределами остаются лишь внешние связи. Этого достаточно, чтобы вынудить Францию предоставить Марокко статус доминиона."
 MOR_proclaim_independence: "Провозгласить независимость"
 MOR_proclaim_independence_desc: "При 100 % баланса сил, когда султану принадлежат и внешние связи Марокко, управлять страной через протекторат больше нечем. Престол объявляет о конце договорного режима и полном суверенитете."
 MOR_impose_colonial_regime: "Ввести колониальное управление"
 MOR_impose_colonial_regime_desc: "Четверть баланса сил на стороне генерал-резидента и принадлежащая ему исполнительная власть позволяют Парижу оформить то, с чем махзен давно смирился: Марокко управляется как колония."
 MOR_take_over_legislation: "Взять законодательство под контроль"
 MOR_take_over_legislation_desc: "Половина баланса сил и сосредоточенные в резидентуре исполнительная и законодательная власти низводят Султанат до правительства-марионетки, которое подписывает то, что ему дали."
 MOR_establish_direct_administration: "Установить прямое администрирование"
 MOR_establish_direct_administration_desc: "Три четверти баланса сил, к которым добавляется и подотчётное Франции правосудие, не оставляют махзену ничего, кроме церемоний, — Марокко управляется напрямую."
 MOR_annex_morocco: "Аннексировать Марокко"
 MOR_annex_morocco_desc: "Когда баланс сил целиком на стороне генерал-резидента и все инструменты власти находятся во французских руках, Султанат упраздняется, а Марокко включается в состав Французской республики."
