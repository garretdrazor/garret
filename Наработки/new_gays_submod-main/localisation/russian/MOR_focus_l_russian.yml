l_russian:
 MOR_Conduct_labor_reforms:0 "Провести трудовые реформы"
 MOR_Conduct_labor_reforms_desc:0 "Рабочие условия в нашей стране оставляют желать лучшего и нам нужны трудовые реформы. Во Франции и раньше были лучшие условия для работников, а теперь они вновь улучшились. Неужели, марроканцы не заслуживают схожих условий? +НД «Трудовые реформы»: +5% к стартовой и максимальной эффективности производства, -5% полит власти."
 MOR_Powder_keg_of_red_june:0 "Пороховая бочка красного июня"
 MOR_Powder_keg_of_red_june_desc:0 "Июньские забастовки 1936 года не просто парализовали страну — они разожгли пожар, который Рабат больше не в силах потушить. Рабочие кварталы Касабланки и шахты Хурибги превратились в неприступные крепости пролетариата. Не уступки и авторитарная политика правительства лишь распалили гнев стачечных комитетов, а жесткий разгон демонстраций окончательно похоронил веру масс в законный порядок. Марокко — это пороховая бочка, зажатая между колониальным настоящим и возможным радикальным будущим. Фитиль уже зажжен подпольными ячейками Коммунистической партии Марокко. Нам остается лишь занять позиции до того, как прогремит неизбежный взрыв. Будет открыта категория решений «Революция Красного Июня» (Пороховая бочка, заложенная проблемами с трудовыми реформами, готова рвануть со дня на день. Очевидно, что, разозлив абсолютно все свои населения, Франция не может просто так взять, и приступить к окончательному разграблению нашей страны. Мы будем сопротивляться этому.) Будет запущена миссия «Горящий фитиль революции» (Ситуация в стране, накаляется, и отчёт идёт по месяцам. Чем больше слоёв населения подключится к революции против колониального режима, тем быстрее она полыхнёт)."
 MOR_Oppose_the_Moroccan_Action_Committee:0 "Противостоять Марокканскому комитету действий"
 MOR_Oppose_the_Moroccan_Action_Committee_desc:0 "Молодые интеллектуалы и буржуа из Комитета действий называют свои требования 'планом реформ', но в действительности они сеют семена хаоса и неповиновения. В то время как мир стоит на пороге тотального столкновения, мы не можем позволить кучке радикалов подрывать стабильность нашего Султаната изнутри. Их митинги и призывы к автономии лишь играют на руку нашим внешним врагам. Мы должны действовать решительно. Порядок в Марокко будет сохранен любой ценой! +10 влияния генерал-резидента, +5% поддержки авторитаризма, +НД «Противостояние МКД»: -0,2 к приросту демократии."
 MOR_Support_the_Moroccan_Action_Committee:0 "Оказать поддержку Марокканскому Комитету Действий"
 MOR_Support_the_Moroccan_Action_Committee_desc:0 "В условиях, когда Франция ослаблена внутренними кризисами и угрозой новой большой войны в Европе, лидеры национального движения громко заявили о себе. Их заявление прозвучало настолько убедительно. Что Султан, несмотря на давление генерал-резидента, решил оказать поддержку их планам. Поддержав Комитет, Мухаммед V фактически объявил о новом курсе султаната, идущем в стороне от авторитарного правления Франции. Будет получен НД «Единство МКД и султана»: Легитимность будет складываться из популярности демократии и монархизма, +1,4% прироста влияния султана в неделю В решения баланса сил будет добавлено следующее решение: 1. Поддержать действия националистов. Откат: 14 дней Стоимость: 10 полит власти"
 MOR_Seek_aid_from_the_Comintern:0 "Искать помощи у Коминтерна"
 MOR_Seek_aid_from_the_Comintern_desc:0 "Третий Интернационал создавался именно для того, чтобы раздуть пожар мировой революции и сокрушить империализм во всех углах земного шара. Подпольный ЦК МКП должен отправить секретных эмиссаров в Советский Союз. Мы докажем товарищу Сталину, что Марокко — это идеальный плацдарм для сокрушительного удара по позициям англо-французского и испанского капитала в Африке. Нам не нужны пустые слова — нам нужны советские военспецы, современные винтовки, пулеметы «Максим» и золото для финансирования восстания. Если Москва протянет нам руку помощи, колониальный режим в Рабате падет за считанные недели. На 15 день с момент прожатия фокуса, для СССР произойдёт событие: «Марокканские коммунисты просят об оружии» (В Москву прибыли доверенные эмиссары от Коммунистической партии Марокко. Их доклад рисует картину глубочайшего революционного кризиса в Северной Африке. Июньские забастовки раскололи колониальное общество, а успешная агитация среди берберских племен и местных солдат поставили Рабат на грань открытого пролетарского восстания. Марокканские товарищи заявляют, что готовы нанести сокрушительный удар по позициям французского империализма."
 MOR_Seek_compromise_with_the_new_France:0 "Искать компромисс с новой Францией"
 MOR_Seek_compromise_with_the_new_France_desc:0 "Капиталистический Париж был нашим тюремщиком, но «Красный Париж» может стать нашим главным союзником. С победой Французской коммунистической партии старый колониальный порядок рухнул. То, что вчера требовало пролития крови, сегодня можно решить за столом переговоров между товарищами. Французский рабочий класс не хочет гибнуть за интересы колонизаторов, а марокканский пролетариат нуждается в мире для построения нового общества. Мы должны отправить делегацию в Париж, чтобы предложить компромисс: официальное признание Марокко союзной республикой. Что означает сохранение присутствия Франции в Марокко, но уменьшение влияния генерал резидента, вместе с тем, Франция поможет нам установить новое правительство, состоящее из националистов и коммунистов. Отринем старые обиды ради мировой революции! В момент прожатия фокуса для Франции произойдёт событие «Марокканская коммунистическая партия ищет компромисса» (Из Рабата в Париж прибыла чрезвычайная делегация от Коммунистической партии Марокко. Ситуация в протекторате накалена до предела: июньские забастовки раскололи страну, и марокканские товарищи стоят на пороге гражданской войны против колониальной администрации и правых генералов."
 MOR_Dissolve_the_Moroccan_Action_Committee:0 "Распустить Марокканский комитет действий"
 MOR_Dissolve_the_Moroccan_Action_Committee_desc:0 "Полумеры больше не работают. Простого противостояния Комитету действий в прессе недостаточно — эта подрывная организация должна прекратить свое существование. Мы подписываем официальный декрет о немедленном и полном роспуске Комитета и всех его преемников. Их штабы будут опечатаны, типографии конфискованы, а финансовые активы перейдут в государственную казну для нужд обороны. Главные идеологи смуты отправятся в глубокую ссылку в отдаленные колонии, где их речи никто не услышит. Мы вырываем корень национализма из марокканской земли, чтобы обеспечить абсолютный порядок. +20 влияния генерал-резидента, +100 полит власти, НД «Ноябрьский кризис» будет удалён, -5% поддержки демократии, партия Демократии будет запрещена."
 MOR_Ban_all_workers_gatherings:0 "Запретить любые сходки рабочих"
 MOR_Ban_all_workers_gatherings_desc:0 "Трудовые реформы дали рабочим защиту, но некоторые из них восприняли нашу заботу как слабость. В условиях войны заводы Касабланки и фосфатные шахты Хурибги — это не дискуссионные клубы, а передовая линия экономического фронта. Любые забастовки, стачки, несанкционированные собрания и даже мирные сходки рабочих отныне приравниваются к саботажу и государственной измене. На стратегические предприятия будут введены армейские патрули и каждый, кто попытается остановить конвейер или поднять стачку, будет немедленно отправлен под трибунал. +НД «Запрет сходок рабочих»: -0,1 прирост коммунизма, +3% максимальной эффективности производства."
 MOR_Request_weapons_for_the_garrisons:0 "Запросить оружие для гарнизонов"
 MOR_Request_weapons_for_the_garrisons_desc:0 "Наши гарнизоны в Фесе, Касабланке и на границах Сахары несут тяжелую службу, охраняя порядок и стабильность. Но одной лишь верности присяге мало, когда солдаты вынуждены патрулировать улицы с устаревшим оружием времен прошлой Великой войны. Мы направляем официальный запрос нашему правительству-покровителю с требованием немедленно выделить субсидии и открыть арсеналы. Нам нужны тысячи современных винтовок, пулеметы для блокпостов и грузовики для мобильных патрулей. Если они хотят, чтобы Марокко оставалось надежным щитом Север Африки, они должны дать нам в руки достойное оружие -100 очков автономии, +2500 пехотного снаряжения, +200 доп оснащения."
 MOR_Allow_publication_of_nationalist_newspapers:0 "Разрешить публикацию националистических газет"
 MOR_Allow_publication_of_nationalist_newspapers_desc:0 "До сих пор колониальная цензура жестко подавляла любое проявление свободной марокканской мысли. Официальное разрешение на выпуск националистических газет, таких как «L'Action Marocaine», прорвет информационную блокаду. Печатное слово станет нашим главным оружием: оно разбудит национальное самосознание масс, донесет идеи Комитета до каждого грамотного марокканца и открыто осудит злоупотребления властей протектората. Пусть Париж и Мадрид пытаются закрывать глаза — голос Марокко теперь зазвучит на полную мощность. +10% влияния султана, +НД «Агитация МКД»(условие: во главе страны НЕ монархизм, НЕ демократия и НЕ фашизм): +0,1 к приросту демократии, -50% защита идеологии. В решения баланса сил будет добавлено следующее решение: 1. Обелить султана за уступки Франции. Откат: 30 дней Стоимость: 10 полит власти"
 MOR_Secure_support_of_the_Atlas_tribes:0 "Заручиться поддержкой племён Атласа"
 MOR_Secure_support_of_the_Atlas_tribes_desc:0 "Города могут быть сердцем нашей революции, но ее стальным щитом станут горы Атлас. Веками свободные берберские племена противостояли любым попыткам подчинить их — будь то султаны, французские колонизаторы или испанские генералы. Многие годы колониальное правительство фактически подкупали их, построив заводы и нанимая туда рабочих из числа племён, однако, низкие зарплаты и плохие условия труда заставили их подняться наравне с остальными. -40 дней из миссии «Горящий фитиль революции». Для категории решений «Революция Красного Июня» будет добавлено решение: 1. Мобилизовать племена Атласа Одноразовое. Требование: В состоянии войны против Франции. Длительность: 7 дней."
 MOR_Prepare_dynamite_work_of_miners:0 "Подготовить «взрывные работы» шахтёров"
 MOR_Prepare_dynamite_work_of_miners_desc:0 "Французские капиталисты выжимают все соки из марокканских горняков, держа их в скотских условиях и калеча за гроши. Но они забыли, что в руках этих обозленных людей находится то, что может разнести их власть в щепки — тонны промышленной взрывчатки. Мы должны направить партийных ячеек МКП на ключевые шахты. Шахтерские стачечные комитеты сформируют боевые дружины под видом «рабочих комитетов». Они начнут тайно выносить динамит с охраняемых складов, закладывать фугасы под ключевые железнодорожные узлы и готовить подрывы мостов. Когда Рабат отдаст приказ атаковать наши позиции в горах и городах, пути снабжения колониальных войск взлетят на воздух. +НД «Динамитчики Хурибги»: Атака тяжелой артиллерии и саперов +5%, прорыв +5% -40 дней из миссии «Горящий фитиль революции». Для категории решений «Революция Красного Июня» будет добавлено решение: 2. Подорвать снабжение в регионе Требование: В состоянии войны против Франции. Доступно в любом нац стейте Марокко ИЛИ в стейте Франции на который претендует Марокко (на случай Мавритании Алжира и т.д.). Откат: 30 дней"
 MOR_Arm_the_red_guard_bands:0 "Вооружить отряды Красной гвардии"
 MOR_Arm_the_red_guard_bands_desc:0 "Время тайных собраний и политических манифестов подошло к концу — пролетарская революция требует штыков. Рабочие кварталы Касабланки и Рабата бурлят от праведного гнева. Пора вывести наши боевые дружины из тени. Подпольный ЦК МКП объявляет о создании Красной гвардии Марокко. Тысячи портовых грузчиков, железнодорожников, шахтеров и примкнувших к нам горцев принимают присягу верности трудовому народу. Мы распределим накопленные винтовки, револьверы и патроны среди сформированных ячеек, назначим полевых командиров и установим каналы связи. Теперь у революции есть свое оружие, и когда колониальное правительство попытается нанести удар, его встретит слаженный залп пролетарской гвардии. +НД «Отряды Красной Гвардии»: +10% к подавлению, +10% к атаке и защите ополчения. -40 дней из миссии «Горящий фитиль революции». Для категории решений «Революция Красного Июня» будет добавлено решение: 3. Призвать городские отряды гвардии Одноразовое. Требование: В состоянии войны против Франции. Длительность: 2 дня"
 MOR_Trust_in_France:0 "Довериться Франции"
 MOR_Trust_in_France_desc:0 "Франция была нашей опорой и учителем на протяжении десятилетий протектората. В этот темный час, когда над Европой и Магрибом сгущаются тучи новой мировой войны, метания и предательство станут нашей гибелью. Наша промышленность поднялась на французские деньги, наши офицеры учились в Сен-Сире, а наши стрелки проливали кровь под французскими знаменами. Доверившись Франции и подтвердив нерушимость наших союзных обязательств, мы гарантируем безопасность Султаната. Париж оценит нашу преданность и откроет для нас свои военные арсеналы, а после победы — дарует Марокко заслуженное место в новом мире Отношения с Францией +50. Торговое влияние Франции на Марокко +30.0%. -100 очков автономии. +НД «Под французским крылом»: стоимость изучения сухопутных доктрин +10%, стоимость найма военных советников -25.0%."
 MOR_Accept_french_investments:0 "Принять французские инвестиции"
 MOR_Accept_french_investments_desc:0 "Марокко в достаточной степени доказало свою верность, французские промышленники и банкиры готовы открыть свои кошельки. Принимая масштабные инвестиции из Парижа, мы передадим модернизацию наших портов, железных дорог и электростанций в руки ведущих инженеров метрополии. От них мы получим новые фабрики, современные технологии и мощный импульс для всей марокканской индустрии -200 очков автономии, +1 инфраструктуры во всех нац стейтах Марокко, +1 фабрика в 806 стейте, и в столичном стейте."
 MOR_Begin_revision_of_the_reform_plan:0 "Начать пересмотр «плана реформ»"
 MOR_Begin_revision_of_the_reform_plan_desc:0 "В 1934 году Марокканский комитет действий представил Парижу «План реформ», который не требовал независимости, а лишь просил соблюдать условия договора о протекторате 1912 года и дать марокканцам гражданские права. Французы высокомерно его проигнорировали. Но времена изменились. На фоне грядущей мировой бури мы садимся за стол пересмотра этого документа. Теперь наши требования станут жестче, экономические претензии — бескомпромиссней, а намеки на автономию — очевиднее. Мы дадим метрополии последний шанс решить дело миром, прежде чем заговорит оружие. 1 ЭТАП ПЕРЕГОВОРОВ. В момент нажатия фокуса произойдёт событие «Все стороны за столом переговоров» (В резиденции генерального резидента Франции в Рабате открылись официальные слушания по пересмотренному «Плану реформ», подготовленному Марокканским комитетом действий. Атмосфера в зале заседаний накалена до предела. Наша делегация, вдохновленная поддержкой султана Мухаммеда V и растущим народным подъемом, открыто заявила: Марокко больше не будет терпеть колониальный диктат, нарушающий договор о протекторате 1912 года. Французские дипломаты из МИДа выглядят растерянными — они не ожидали от нас такой твердости и организованности."
 MOR_Replace_grand_vizier_with_prime_minister:0 "Заменить пост великого визиря премьер-министром"
 MOR_Replace_grand_vizier_with_prime_minister_desc:0 "Архаичная система нашего султаната давно изжила себя, и мы должны модернизировать её, чтобы идти дальше. В условиях бурного XX века великие визири, опирающиеся на феодальные кланы и консервативное духовенство, лишь тормозят развитие султаната. Марокко нуждается в гибком, профессиональном и современном правительстве. Мы упраздняем пост, который на данный момент занимает Мухаммад аль-Мукри, отличившийся слишком большой покладистостью перед колониальными властями, и заменим на пост премьер-министра, ответственного за экономику, индустриализацию и управление министерствами. Султан сохранит за собой высшую сакральную и военную власть, но исполнительный аппарат будет модернизирован. Это решительный шаг от феодального застоя к сильному современному государству. Мухаммад аль-Мукри (великий визирь) будет уволен со своего поста, +5% поддержки демократии, Будет добавлен НД «Безголовое правительство»: -15% стабильности, -15% поддержки войны, -15% прирост полит власти, +45% стоимости найма министров."
 MOR_Appoint_a_vizier_loyal_to_the_king:0 "Назначить лояльного королю визиря"
 MOR_Appoint_a_vizier_loyal_to_the_king_desc:0 "Пока амбициозные партийные лидеры ведут бесконечные и бесплодные споры о будущем государственного устройства Марокко, дворец не может оставаться пассивным наблюдателем. Высший пост великого визиря — это не просто дань традициям прошлого, а ключевой рычаг управления исполнительной властью, который должен находиться в надежных руках. Именно слабость аль-Мукри перед Францией виновата в некоторых трагедиях, и мы намеренно более этого не допустить и установить другого человека на этот пост. Мухаммад аль-Мукри (Нелояльный великий визирь) будет уволен со своего поста, Тами Эль Глави (Лояльный великий визирь) будем вместо него, его так же нельзя будет заменить. Тами Эль Глави (Thami El Glaoui) так же станет доступен как фельдмаршал 2 уровня, 3 атаки, 2 защиты, 2 логистики, 1 планирования. С трейтами: горняк, эксперт по артиллерии. +5% поддержки монархии, будет добавлен НД «Укрепление власти Муххамеда V»: +5% прироста полит власти. Произойдёт событие «МКД выступает против сохранение поста великого визиря» (Решение дворца сохранить архаичный пост Великого визиря и назначить на него лояльного короне аристократа вызвало бурю негодования в Рабате."
 MOR_Seek_help_among_nationalists:0 "Искать помощь среди националистов"
 MOR_Seek_help_among_nationalists_desc:0 "Идеологические разногласия блекнут перед лицом векового угнетения. Да, буржуазные националисты и традиционалисты мечтают о возрождении султаната, а не о диктатуре пролетариата, но сегодня у нас одна цель — разорвать цепи французского колониализма. Интеллигенты из Феса, торговцы из Марракеша и молодые патриоты из городов готовы взяться за оружие, но им не хватает организации. Подпольный ЦК МКП должен инициировать секретные переговоры с лидерами национального движения. Мы предложим им временный «Единый Антиимпериалистический Фронт». Мы гарантируем уважение к исламским традициям и автономию местной буржуазии на первом этапе революции, если они призовут своих сторонников влиться в ряды повстанцев. Вместе мы поднимем всю нацию на священную войну против колонизаторов, а с классовыми врагами внутри страны разберемся уже после победы. Часть советников националистов станут доступны после окончания войны за свободу. +НД «Поддержка националистов» (Условие: будет удалён, как только станет выполнен фокус «Новая страна рабочих» или «Новое правительство Марокко согласовано»): +0,1 прироста демократии, +150 человек военнообязанного селения в неделю, +1% поддержки войны в неделю."
 MOR_Declare_claims_on_former_territories:0 "Заявить о претензиях на бывшие территории"
 MOR_Declare_claims_on_former_territories_desc:0 "Колонизаторы провели границы в Африке по линейке, разрезав живое тело нашей родины ради удобства своей эксплуатации. До прихода европейских империалистов власть марокканских правителей простиралась далеко на юг и восток — от берегов Сенегала до оазисов Туата. Сегодня, когда марокканский пролетариат сбросил оковы, мы не имеем права забывать о наших братьях, оставшихся под властью испанского и французского капитала. Мы официально заявляем о своих законных исторических правах на земли Западной Сахары, Мавритании и приграничные районы Алжира. Будут получены претензии на стейты: на все стейты Мавритании, и на стейты 1067 и 513. Когда начнётся война за освобождение, вам так же понадобиться захватить и эти территории для её окончания."
 MOR_Poach_remnants_of_moroccans_from_the_army:0 "Переманить остатки марокканцев из армии"
 MOR_Poach_remnants_of_moroccans_from_the_army_desc:0 "Значительная часть марокканских солдат до сих пор служит Франции. Пора переманить их к себе: каждый вернувшийся стрелок это и штык, и живой пример для остальных."
 MOR_Introduce_martial_law_measures:0 "Ввести меры военного времени"
 MOR_Introduce_martial_law_measures_desc:0 "Пожар большой войны докатился до Средиземноморья, и Марокко больше не может жить законами мирного времени. Наша верность Франции обязывает нас действовать решительно и жестко. Отныне в Султанате вводятся чрезвычайные меры военного времени: комендантский час в городах, строгая цензура печати, суды военного трибунала для саботажников и полная реквизиция гражданского автотранспорта для нужд армии. Мы подчиним каждый аспект нашей жизни одной цели — удержанию порядка в тылу и бесперебойному снабжению фронта. Вся страна становится единым военным механизмом +НД «Меры военного времени»: -10% ФНП, +25% защиты идеологии, +10% лимита капитуляции"
 MOR_Ban_the_communist_party:0 "Запретить деятельность компартии"
 MOR_Ban_the_communist_party_desc:0 "Иностранные доктрины классовой борьбы и безбожного марксизма не имеют права на существование на священной земле нашего Султаната. Прикрываясь лозунгами о правах пролетариата, коммунистические агитаторы пытаются расколоть наше общество и превратить заводы в плацдарм для революции, управляемой из Москвы. Мы не позволим красной заразе пустить корни в Марокко. Марокканская коммунистическая партия и все связанные с ней рабочие союзы объявляются вне закона. Их подпольные типографии будут уничтожены, лидеры — арестованы за измену, а любая марксистская пропаганда будет караться по законам военного времени. Наша верность традициям и порядку непоколебима. +5% стабильности, -50 очков автономии, +20 влияния генерал-резидента, +5% поддержки авторитаризма, -5% поддержки коммунизма, партия коммунизма будет запрещена, НД «Запрет сходок рабочих» будет удалён, НД «Противостояние МКД» изменится на «Противостояние МКД и ПКМ» и получит ещё: -0,2 к приросту коммунизма, +5% к максимальной эффективности производства."
 MOR_Declare_the_lesser_jihad:0 "Объявить «Малый джихад»"
 MOR_Declare_the_lesser_jihad_desc:0 "Когда дипломатия бессильна, а колонизаторы оскверняют нашу землю своим присутствием, у нас остается лишь один законный путь — путь священной оборонительной войны. По благословению религиозных лидеров и призыву султана мы объявляем «Малый джихад» ради спасения нашей родины. Этот призыв сотрет любые внутренние разногласия между городскими комитетами и воинственными горными племенами. Сначала будет растоптан авторитет Французксого протектората, его институты, снабжение гарнизонов. Мы покажем всю грязную сторону колониального режим Франции нашему народу, и когда терпение марроканцев кончится, мы поднимем ружья против колонистов! Все нац стейты получат стейт-модификатор «Малый джихад»: скорость роста подчинения -100%, скорость роста сопротивления +100%, +НД «Малый джихад» (условие: пропадёт как только Марокко станет свободным): +20 атаки и защиты на нац территориях, лимит капитуляции +25%, -0,5 терпение марроканцев в неделю В категорию «Истекающее терпение Марроканского народа» будут добавлены следующие решения: 1."
 MOR_Prepare_a_replacement_for_the_makhzen:0 "Подготовить замену махзену"
 MOR_Prepare_a_replacement_for_the_makhzen_desc:0 "Сама ткань марокканского государства — древний «махзен» — представляет собой хаотичную сеть из полуфеодальных каидов, пашей и племенных старейшин. В условиях тотальной войны XX века эта система абсолютно недееспособна: налоги собираются неэффективно, учет населения отсутствует, а приказы из Рабата растворяются в провинциальном кумовстве. Мы должны подготовить комплексную замену махзену. Страна будет разделена на новые гражданские провинции, управление которыми доверят профессиональным бюрократам и юристам, а не местным феодалам. Традиции уступят место закону и строгой государственной дисциплине. +10% модернизации госаппарата, +75 полит власти, часть министров махзена будет уволена со своих постов, будут доступны министры-выходцы из МКД, НД «Безголовое правительство» получит: +5% стабильности, +5% поддержки войны, +5% прирост полит власти, +15% стоимости найма министров."
 MOR_Reform_the_makhzen:0 "Реформировать махзен"
 MOR_Reform_the_makhzen_desc:0 "Махзен — вековая система королевского управления, ведающая сбором налогов, безопасностью и наместничеством в провинциях, — долгое время была сердцем Марокко. Однако колониальный период и последующий хаос первых лет независимости превратили этот некогда эффективный аппарат в рассадник коррупции, кумовства и неэффективности. Старые паши и каиды в регионах часто действуют как независимые феодалы, саботируя приказы из Рабата. Махзен должен быть радикально реформирован. Мы не станем уничтожать его, как предлагают выходцы из МКД. Вместо этого мы проведем жесткую чистку рядов, внедрим современные методы учета и централизуем сбор налогов напрямую через султанскую казну. Каиды в провинциях станут подотчетны лично великому визирю. Мы превратим средневековый административный аппарат в дисциплинированную, преданную и эффективную бюрократическую машину абсолютной власти! НД «Укрепление власти Муххамеда V» получит: стоимость смены министра -50%"
 MOR_A_new_country_of_workers:0 "Новая страна рабочих!"
 MOR_A_new_country_of_workers_desc:0 "Оковы французского империализма разбиты, а колонизаторы с позором бежали с нашей земли. Кровью шахтеров Касабланки, крестьян Феса и отважных воинов Рифа мы вырвали свою свободу. Наша победа доказала: даже самый угнетенный народ способен сокрушить великую империю, если его сердца горят верностью марксизму-ленинизму, а в руках — надежное советское оружие. Но разрушить старый мир — это лишь половина дела. Теперь перед нами стоит монументальная задача: построить социалистическое государство на африканском континенте. Наша промышленность лежит в руинах, колониальная администрация саботировала экономику, а капиталистические соседи смотрят на нас с явной ненавистью. +10% поддержки коммунизма, +5% стабильности, +НД «Революционный энтузиазм» на 365 дней: +0,1 поддержки коммунизма, +30% к скорости ремонта, +10% к скорости строительства"
 MOR_New_Moroccan_government_agreed:0 "Новое правительство Марокко согласовано"
 MOR_New_Moroccan_government_agreed_desc:0 "Долгие споры между течениями национального движения завершились соглашением: создано единое временное правительство, способное говорить от имени всех марокканцев."
 MOR_Modernization_of_the_port_of_Casablanca:0 "Модернизация порта Касабланки"
 MOR_Modernization_of_the_port_of_Casablanca_desc:0 "К началу Второй мировой войны порт Касабланки уже был крупнейшим искусственным портом в Северной Африке. Однако для полноценного ведения войны его мощностей недостаточно. Французские инженеры и американские специалисты провели подготовили титанический проект, требующий: углубить дно, построить гигантский волнорез, расширить угольные и топливные терминалы, а также установить мощные береговые батареи Эль-Ханк. +4 уровня морской базы, +4 уровня морских укреплений, и +3 уровня ПВО в провке 7069."
 MOR_Support_unrest_in_Algeria:0 "Поддержать волнения в Алжире"
 MOR_Support_unrest_in_Algeria_desc:0 "Французское господство в Магрибе держится на принципе «разделяй и властвуй». Но пламя нашей борьбы за свободу невозможно удержать в границах султаната. В Алжире, который Париж высокомерно объявил «исконной частью Франции», миллионы наших братьев-мусульман точно так же страдают под колониальным гнетом и ждут искры. Через тайные тропы в горах и Сахаре Марокканский комитет действий наладит контрабанду оружия, заброску агитаторов и координацию с алжирскими националистами. Сковав французские дивизии восстанием в Алжире, мы перережем их линии снабжения и расчистим себе путь к полной победе в Магрибе. Для Франции произойдёт событие «Рост волнений в Алжире» (Худшие опасения нашего Генерального штаба оправдались. Рост национализма, вспыхнувший в Марокко, перекинулся через границу. По сообщениям из Орана и Константины, агенты Марокканского комитета действий смогли наладить связь с местным подпольем. В Алжир хлынул поток контрабандного оружия, а лозунги о «Малом джихаде» и национальном суверенитете нашли живой отклик среди коренного населения. Вспыхнули скоординированные забастовки, переросшие в вооруженные столкновения с жандармерией."
 MOR_Form_the_government:0 "Сформировать правительство"
 MOR_Form_the_government_desc:0 "Прежде чем начать формировать первое правительство, султан должен назначить премьер-министра которому будет поручено это дело. Новые партии ещё только начали появляться, поэтому, логичней всего будет назначить одного из ведущих деятелей МКД. +10% модернизации госаппарата, Демократическая партия станет правящей, король останется как второй лидер со стороны монархии. Произойдёт событие «МКД разделился» (Независимость Марокко, завоеванная с таким трудом, поставила перед молодой нацией суровый вызов — формирование первого суверенного правительства. Увы, общая победа не сплотила лидеров национального движения, а лишь обнажила глубокие идеологические трещины, которые раньше маскировались борьбой против колонизаторов. Марокканский комитет действий окончательно прекратил свое существование. Внутриполитическая арена раскололась надвое. Мухаммед Хасан аль-Уаззани объявил о создании «Патриотического движения», уводя за собой либеральную интеллигенцию. В противовес ему Аллаль аль-Фасси мобилизовал традиционные и консервативные массы под знаменем «Национальной партии». Произошедшее заметно ударило по репутации МКД, но выбор у султана по-прежнему невелик."
 MOR_Accept_the_title_of_king:0 "Принять титул короля"
 MOR_Accept_the_title_of_king_desc:0 "Веками правители Марокко носили древний титул султана, который подчеркивал их религиозный и традиционный статус. Однако в современном мире, где молодая нация строит новые институты и заявляет о себе на международной арене, старая терминология изжила себя. Для западных держав слово «султан» звучит как анахронизм из сказок о Востоке, а для внутренних реформаторов — как символ средневекового застоя. Отныне, Марокко провозглашается королевством, а правитель принимает титул короля, чтобы символизировать единство страны, несмотря на разногласия между арабами и берберами. Страна сменит название на Королевство Марокко. ЕСЛИ выполнен фокус «Провозгласить Великое Марокко», то на Великое Королевство Марокко. НД «Укрепление власти Муххамеда V» получит: +10% к скорости оправдания войны, +0,1 прироста популярности монархии, +10% к атаке на нац территориях."
 MOR_Allow_rallies_and_unions:0 "Разрешить митинги и профсоюзы"
 MOR_Allow_rallies_and_unions_desc:0 "Наш монарх милостиво разрешает митинги и профсоюзы, запрещённые во время военного положения. Он воспользуется всем тем, что накипело у марокканцев, чтобы ослабить позиции МКД, которое выступило против того, кто пригрел и поддержал их в тяжёлые времена. Будет открыта категория решений «Поддержка и направление народного недовольства» (Цель султана – ослабить МКД выступивший против него. Для этого будут использованы левые профсоюзы, каиды, жители племён, и даже сами националисты, среди которых нет единства.) (категория закроется, как только популярность демократии упадёт ниже 5%) 1. Указать профсоюзам на недостатки плана реформ. (Профсоюзы и рабочие – самые заинтересованные люди в изменениях, и видя их отсутствие, они хотят знать виновников застоя. Мы им укажем на них.) Стоимость: 50 полит власти Откат: 45 дне"
 MOR_Arabization_of_the_country:0 "Арабизация страны"
 MOR_Arabization_of_the_country_desc:0 "Десятилетия колониального господства оставили глубокий след на теле нашей культуры. Язык оккупантов заполонил наши школы, суды и государственные учреждения, вытесняя родную речь на обочину общественной жизни. Пора вернуть Марокко его истинное лицо. Мы провозглашаем арабский язык единственным государственным языком, реформируем систему образования и перепишем законы. Наше прошлое принадлежит исламскому и арабскому миру, и наше будущее будет строиться на этом прочном фундаменте. Единый язык — единая нация. +10% популярности правящей партии, +10% стабильности, +100 Политической власти, +20 отношения со всеми арабскими странами. _____________________________________________________________________________ ВЕТКА ВЕЛИКОГО МАРОККО"
 MOR_Purge_the_french_from_the_party:0 "Исключить французов из партии"
 MOR_Purge_the_french_from_the_party_desc:0 "Долгое время наше партийное руководство состояло из большого числа французских интеллектуалов, учителей лицеев и портовых чиновников из Касабланки, которые отказались присоединяться к нашей революции. Они часами дискутировали о марксизме в кофейнях Рабата, но оставались чужды духу нашей земли. Для них мы были лишь «отсталыми туземцами», которых нужно просветить. Хуже того, многие из них бессознательно сохраняли верность Парижу, призывая нас к «умеренности» в угоду французскому Народному фронту. Время салонных разговоров прошло. Нам нужна не европейская дискуссионная группа, а боевая авангардная партия коренных марокканцев — арабов, берберов и давно прижившихся евреев, готовых умирать за свободу. Мы очистим партийные ряды от французских элементов. Те из них, кто ставил интересы метрополии выше марокканской независимости, будут исключены и интернированы. Коренной пролетариат берет управление революцией в свои руки! -5% стабильности, -400 человек, +200 полит власти, Жан Дреш (Jean Dresch) будет уволен, Жан Пайдель (Jean Paidil) будет уволен, Шарль Дюпюи (Charles Dupuy) будет уволен, Мишель Колонна (Michel Colonna) будет уволен, Поль Дюрель (Paul Durel) будет уволен."
 MOR_Organization_of_the_communal_assembly:0 "Организация коммунальной ассамблеи"
 MOR_Organization_of_the_communal_assembly_desc:0 "Марокканская деревня веками жила по своим законам, основанным на племенном праве – урфе, и общинных традициях. Теперь, когда колониальные чиновники покинули свои посты, мы не должны навязывать крестьянам и пастухам чуждую им городскую бюрократию. Вместо этого комитет предлагает соединить традиционное общинное самоуправление с социалистической демократией. Мы учредим Коммунальную Ассамблею Марокко — высший совет народных делегатов от сельских округов, рабочих поселков и горных кланов. Через него бедные феллахи, шахтеры и старейшины берберов смогут напрямую распределять конфискованные земли, решать вопросы водопользования и координировать поставки продовольствия в города. +НД «Сельские коммуны»: Прирост политической власти: +0,05 в день, скорость строительства инфраструктуры: +10%, ФНП -2%, +5% прироста населения. Для баланса сил станут доступны два решения. Можно прожать лишь одно из них один раз, второе пропадает: 1. Позволить старейшинам возглавить местные советы: сдвиг на +10% в сторону Автономии племён. 2. Назначить партийных комиссаров председателями: сдвиг на +10% в сторону Централизации МКП."
 MOR_Fate_of_the_sultan:0 "Судьба султана?"
 MOR_Fate_of_the_sultan_desc:0 "Пролетарская революция смела колониальную администрацию, но во дворце Рабата все еще сидит человек, чья власть веками считалась священной. Султан — это не просто политическая фигура, это духовный лидер и символ старого феодального Марокко, пользующийся колоссальным авторитетом среди берберских племен и традиционалистов. Мы должны решить, что нам предпринять в отношении его фигуры. Марокко станет называться Марокканская народная республика. Произойдёт событие «Судьба султана» (Дворец в Рабате, веками бывший оплотом марокканских правителей, оцеплен патрулями Красной гвардии. Вооруженные рабочие и берберские ополченцы заменяют старую гвардию на постах, а в роскошных залах собран суд из числа членов комитета МКП. Султан Мухаммед V до конца суда взят под домашний арест. Вопрос о монархии встал ребром: социалистическое Марокко не может двигаться в будущее, пока этот символ феодального прошлого сохраняется в текущем виде. Ситуация накалена до предела. Для ортодоксальных марксистов султан — это классовый враг и крупный землевладелец, который должен быть немедленно низложен."
 MOR_Nationalization_of_the_banks:0 "Национализация банков"
 MOR_Nationalization_of_the_banks_desc:0 "Политическая власть без контроля над финансами — это иллюзия. До недавних пор Государственный банк Марокко и коммерческие кредитные учреждения Рабата де-факто управлялись из Парижа и Мадрида, служа инструментами выкачивания золота и ресурсов из нашей страны. Капиталисты могут использовать эти банки для саботажа наших реформ, организации искусственного дефицита и финансирования контрреволюционного подполья. Мы объявим о немедленной и полной национализации всех банковских активов, сбережений иностранных концессионеров и золотовалютных резервов на территории республики. Будет создан Народный Банк Марокканской Республики, которым не сможет владеть ни один иностранец и каждый дирхам в стране будет работать на нужды индустриализации, ликвидацию неграмотности и укрепление обороноспособности, а не утекать в карманы европейских буржуа. НД «Государственный банк Марокко» получит: +10% скорости строительства."
 MOR_Accept_french_refugees:0 "Принять французских беженцев"
 MOR_Accept_french_refugees_desc:0 "Французы – для нас братский народ, и нет ничего страшного, если мы окажем ему поддержку и примем тех, кто не хочет сражаться, или оказаться между ружьями. Сапоги консервативных генералов, не видят разницу между простыми обывателями, и теми, кто движет революцию, но в отличии от нас, они не пощадят никого, а мы спасём всех. +10 отношения Франции к Марокко, +НД «Беженцы из франции» (условие: Франция в состоянии гражданской войны): +100% прирост населения."
 MOR_Recap_of_the_Torch:0 "Подводя итоги «Факела»"
 MOR_Recap_of_the_Torch_desc:0 "После нескольких ожесточенных боев у Касабланки и Рабата, французские колониальные силы прекратили сопротивление и перешли на сторону антигитлеровской коалиции. Подводя итоги «Факела», Султан Мухаммед V и марокканская элита разыграли блестящую дипломатическую карту, где заполучили поддержку независимости от членов коалиции. +200 очков автономии."
 MOR_Nouasser_project:0 "Проект Нуассер"
 MOR_Nouasser_project_desc:0 "Век современной войны доказал: тот, кто не контролирует небо, обречен на поражение на земле и на море. Земли Нуассера, расположенные к югу от Касабланки, обладают идеальным плоским рельефом для создания крупнейшего авиационного хаба в Африке. С привлечением союзных инженеров и передовых технологий мы заложим сеть всепогодных бетонных взлетно-посадочных полос, ангаров для ремонта тяжелых бомбардировщиков и складов авиационного топлива. Проект Нуассер превратит Марокко в ключевой перевалочный пункт для воздушных флотов, позволяя нам координировать авиаудары и надежно прикрывать с воздуха конвои в Атлантике В проке 4139 появится авиабаза 4 уровня и ПВО 2 уровня"
 MOR_Support_unrest_in_Mauritania:0 "Поддержать волнения в Мавритании"
 MOR_Support_unrest_in_Mauritania_desc:0 "Французские колонизаторы искусственно провели границы по живой пустыне, отрезав от султаната наши южные территории в Мавритании. Племена мавров, кочующие по Сахаре, связаны с нами многовековыми религиозными, культурными и вассальными узами. Пришло время поджечь Французские колониальные тылы на юге. Мы отправим наших самых выносливых эмиссаров и проводников через пески Сахары, чтобы поднять кочевые племена на борьбу. Пусть Париж попытается удержать бескрайние пески, когда против них обратится сама пустыня. Для Франции произойдёт событие «Рост волнений в Мавритании» (Из Французской Западной Африки приходят тревожные новости: агенты Марокканского комитета действий сумели пересечь Сахару и вступить в контакт с вождями кочевых племен Мавритании. Агитаторы напоминают маврам о былых узах с султаном и призывают поднять оружие против Республики. Ситуация стремительно ухудшается. Подвижные отряды кочевников начали совершать налеты на изолированные французские форты, перерезать телеграфные линии и атаковать караваны снабжения. Удерживать порядок в этих бескрайних песках стандартными методами невозможно — здесь нет крупных городов, а враг растворяется в дюнах сразу после нападения."
 MOR_Support_unrest_in_Tunisia:0 "Поддержать волнения в Тунисе"
 MOR_Support_unrest_in_Tunisia_desc:0 "Французский протекторат в Тунисе — это восточные ворота Магриба. Местные патриоты из партии «Новый Дестур» уже подняли голос против колониального господства, а их лидеры подверглись арестам. Марокко не оставит братьев один на один с угнетателями. Расширяя наше подпольное влияние на восток, мы свяжемся с тунисскими ячейками, обеспечим их финансированием и передадим им наш успешный опыт борьбы за верховенство права и суверенитет. Когда весь Магриб вспыхнет вслед за Марокко, колониальная империя Франции в Северной Африке окончательно прекратит свое существование. Для Франции произойдёт событие «Рост волнений в Тунисе» (События в Северной Африке окончательно приняли катастрофический оборот. Из Туниса сообщают о скоординированном и мощном восстании, за которым отчетливо прослеживается рука Марокканского комитета действий. Агенты МКД смогли объединить усилия с подпольными ячейками запрещенной партии «Новый Дестур». Вооружившись контрабандным оружием и вдохновившись лозунгами «Малого джихада», тысячи тунисцев вышли на баррикады."
 MOR_Patriotic_Ouazzani_movement:0 "Патриотичное движение Уаззани"
 MOR_Patriotic_Ouazzani_movement_desc:0 "Марокканский комитет действий мертв, и старые методы управления должны уйти в прошлое вместе с ним. Мухаммад Хасан аль-Уаззани предлагает нашей молодой нации альтернативный путь. Мы не можем позволить консерваторам и традиционалистам из Национальной партии запереть независимое Марокко в рамках средневековых догм. Патриотичное движение станет щитом для либеральной интеллигенции, реформаторов и всех тех, кто видит Марокко современным, светским и конституционным государством."
 MOR_Fassi_National_Party:0 "Национальная партия Фасси"
 MOR_Fassi_National_Party_desc:0 "Распад Марокканского комитета действий показал истинное лицо либеральных отщепенцев. Пока Уаззани и его так называемое «Патриотичное движение» пытаются навязать нашей молодой нации чуждые, слепо скопированные западные ценности, мы должны помнить, за что боролся наш народ. Независимость Марокко была завоевана кровью верных сынов ислама и короны, а не пустой болтовней интеллигенции в кофейнях. Аллаль аль-Фасси призывает сплотиться вокруг традиций, веры и незыблемых устоев нашего общества. Национальная партия опирается на широкие народные массы, ремесленников и консервативную элиту. Мы не отдадим власть модернизаторам, готовым продать суверенитет за иностранные кредиты."
 MOR_Reduce_the_influence_of_the_nationalists:0 "Сократить влияние националистов"
 MOR_Reduce_the_influence_of_the_nationalists_desc:0 "Крики МКД о поправении свобод и договорённостей портят репутацию султана, создавая трещины в единстве народов Марокко. Настало время жестко ограничить их влияние, закрыть радикальные газеты и арестовать ключевых подстрекателей. Порядок в Марокко будет удерживаться твердой рукой закона, а не хаосом народных восстаний. НД «Противостояние с националистами» будет удалён. НД «Единство МКД и султана» будет удалён. Останется только Муххамед 5 как лидер."
 MOR_Communist_associations:0 "Коммунистические ассоциации"
 MOR_Communist_associations_desc:0 "Создание Коммунальной ассамблеи дало нам структуру управления, но теперь мы должны вдохнуть в нее истинно пролетарский дух. Марокканские крестьяне веками находились под культурным влиянием феодалов и религиозных орденов, державших их в покорности. Мы создадим ассоциацию коммунистических тружеников села, отправив сотни молодых партийных активистов и грамотных рабочих из Касабланки в отдаленные деревни и горные общины. Их задача — создавать ячейки взаимопомощи, организовывать кооперативные союзы, читать лекции о классовой борьбе и разъяснять феллахам цели нашей революции. Сплотив деревенскую бедноту в мощные ассоциации, мы навсегда вырвем массу крестьян из-под влияния консервативных каидов и подготовим их к переходу на рельсы коллективного труда. +НД «Крестьянские ассоциации»: +0,05 прироста коммунизма, защита идеологии +10%, скорость роста сопротивления -10%. Для баланса сил станут доступны два решения. Можно прожать лишь одно из них один раз, второе пропадает: 1. Дать племенным союзам право на создание своих ассоциаций: сдвиг на +10% в сторону Автономии, +НД «Создание ассоциаций на племенной базе» на 180 дней: Скорость роста сопротивления -15% 2."
 MOR_Agrarian_reform:0 "Аграрная реформа"
 MOR_Agrarian_reform_desc:0 "Долгие годы марокканская земля принадлежала кому угодно, только не тем, кто её возделывал. Французские колониальные плантаторы захватили самые плодородные долины, а местная феодальная знать, и крупные землевладельцы-каиды, веками держали простых феллахов в кабале. Пора положить конец этой вопиющей несправедливости. Все земли колонизаторов, предателей и крупных собственников конфискуются без всякого выкупа и переходят в общенародное достояние. Через Коммунальную ассамблею мы справедливо перераспределим эти угодья среди безземельных батраков и бедных крестьянских семей. +временный НД на 180 дней «Хаос из-за перераспределения земель»: скорость строительства -15%. НД «Сельские коммуны» получит: Стабильность +5%, ФНП -2%, +5% прироста населения. Для баланса сил станут доступны два решения. Можно прожать лишь одно из них один раз, второе пропадает: 1. Позволить общинам распределять землю по традиционным законам: сдвиг на +10% в сторону Автономии, +5% стабильности, НД «Хаос из-за перераспределения земель» увеличится на 90 дней или снова привоится 2."
 MOR_Literacy_programs:0 "Программы повышения грамотности"
 MOR_Literacy_programs_desc:0 "Половина успеха нашей перестройки куется не на заводах, а за школьными партами. Французский колониальный режим сознательно держал марокканский народ во тьме невежества: более 90% населения протектората не умеют ни читать, ни писать. Для партии очевидно — безграмотный человек стоит вне политики, он легко поддается слухам контрреволюционеров и религиозных фанатиков. Для борьбы с этой проблемой, будут созданы программы, по которым студенты, прогрессивные учителя и активисты МКП отправятся в города и деревни, чтобы развернуть масштабные сети вечерних курсов для рабочих и крестьян. +1 ячейка исследований, + НД «Программы повышения грамотности»: +3% максимальной эффективности производства"
 MOR_Active_support_of_the_unions:0 "Активная поддержка профсоюзов"
 MOR_Active_support_of_the_unions_desc:0 "Национализация банков дала нам финансовые рычаги, но на самих предприятиях порядок должны наводить те, кто стоит у станков. Старые колониальные профсоюзы Марокко были бесправны, а марокканских рабочих туда часто и вовсе не допускали. Отныне профсоюзы станут полноценными соуправителями производства. Рабочие комитеты получат право контролировать фабричные бюджеты, увольнять саботирующих инженеров, следить за безопасностью труда и формировать отряды рабочей самообороны. Мы превратим каждый завод и каждую мастерскую в цитадель революционной дисциплины и пролетарского самосознания. +НД «Профсоюзный контроль»: +5% роста эффективности производства, +20% скорости конверсии."
 MOR_Legalize_the_antifascist_committee:0 "Легализовать Антифашистский комитет"
 MOR_Legalize_the_antifascist_committee_desc:0 "Фашизм поднимает голову по всему Средиземноморью. Франкисты в Испании, Муссолини в Ливии и правые радикалы внутри самого Магриба мечтают утопить наши социалистические завоевания в крови. Мы не можем сидеть сложа руки и ждать удара. До сих пор Антифашистский комитет Марокко действовал полуподпольно, координируя рабочих и интеллигенцию в городах. Эта организация станет интеллектуальным и боевым щитом нашей республики. Комитет займется выявлением фашистских шпионов, созданием интернациональных добровольческих бригад, изданием антифашистской прессы и идеологической подготовкой населения к неизбежному столкновению с силами реакции. Фашизм не пройдет! -30 отношения с фаш странами, -10% популярности фашизма, будет установлено правило: может отправлять добровольцев, +НД «Антифашистский комитет»: +10% поддержка войны, эффективность контрразведки +1.0, +3 максимума дивизий для отправки добровольцами. Для баланса сил станут доступны два решения. Можно прожать лишь одно из них один раз, второе пропадает: 1."
 MOR_Support_from_the_United_States:0 "Поддержка США"
 MOR_Support_from_the_United_States_desc:0 "Соединенные Штаты признали стратегическую важность нашего Султаната и готовы превратить его в свой главный плацдарм в Северной Африке. Американские военные миссии прибывают в Касабланку и Нуассер не как колонизаторы, а как партнеры. Поддержка США — это не просто дипломатические ноты, это бесконечный поток Ленд-лиза. С такой поддержкой, Султанат больше никто не посмеет назвать слабой колонией. + 20 отношения с США, США получает 20% торгового влияния на Марокко, +2500 пехотного снаряжения, +НД «Поддержка США»: Эффективность получения Ленд-лиза от США +40.0%."
 MOR_Repair_dockyard:0 "Ремонтная верфь"
 MOR_Repair_dockyard_desc:0 "Океан безжалостен, но еще более безжалостны торпеды и бомбы наших врагов. Касабланка стала ключевым узлом атлантических конвоев, и её порту необходимо нечто большее, чем просто краны для разгрузки. Строительство капитальной ремонтной верфи и современных сухих доков позволит нам возвращать встрой поврежденные корабли прямо здесь, на передовой Магриба. Каждое отремонтированное судно, каждый заваренный борт эсминца или транспорта — это спасенные припасы, сохраненные жизни и новые стволы орудий, готовые обрушиться на врага. Наша верфь станет госпиталем для израненных стальных гигантов +1 верфь в стейте 806."
 MOR_Begin_the_fight_for_our_freedom:0 "Начать борьбу за нашу свободу"
 MOR_Begin_the_fight_for_our_freedom_desc:0 "Годы покорности, колониальной цензуры и высокомерного пренебрежения со стороны Парижа подошли к концу. Мы исчерпали все мирные и юридические методы борьбы. Наши требования о верховенстве права были высмеяны, а «План реформ» выброшен в урну. Но поджигая фитили восстаний от Туниса до Мавритании, мы не просто ослабляли врага — мы готовили почву для главного удара. Сегодня Султан Мухаммед V благословляет нацию на священный бой, а Марокканский комитет действий берет на себя руководство восстанием. Час пробил. Мы сбрасываем маски, разрываем кабальный договор 1912 года и начинаем открытую борьбу за нашу свободу. Свобода или смерть! +10% поддержки войны"
 MOR_Modernization_on_the_western_model:0 "Модернизация по западному образцу"
 MOR_Modernization_on_the_western_model_desc:0 "Нужно вытащить Марокко из экономической и технологической отсталости. Взгляд назад, в сторону традиционализма, обречет нашу молодую республику на статус слабого аграрного придатка. Путь к подлинному суверенитету лежит через перенятие опыта передовых держав Запада. Мы должны открыть наши двери для иностранных инженеров, реформировать правовую систему по европейскому образцу и заложить фундамент для современной промышленности. +10% модернизации госаппарата, +1 фабрика в двух случайных нац регионах, + ИЛИ продление НД «Адаптация общества» на 2 года: -10% стабильности; на три года будет добавлен НД «Модернизация по западному образцу»: +5% к темпам исследований, +10% к скорости строительства, мажоры с демократией у власти получают модификатор отношений «Реформирование по западному образцу» +30 улучшения отношений к Марокко и наоборот."
 MOR_Separate_religious_and_secular_power:0 "Разделить духовную и светскую власть"
 MOR_Separate_religious_and_secular_power_desc:0 "Вера — это глубоко личное дело каждого гражданина, но, когда религиозные догмы начинают диктовать законы суверенному государству, прогресс останавливается. Мы не сможем построить современное, равноправное и демократическое общество, пока судебные решения принимаются по законам прошлых веков, а духовенство имеет право вето на решения парламента. Пришло время провести четкую черту между Богом и государством. Религиозные суды должны быть упразднены, а их функции переданы единой гражданской судебной системе. Образование, законы и управление нацией должны опираться на разум, конституцию и права человека. +10% модернизации госаппарата, +50 полит власти, +ИЛИ продление НД «Адаптация общества» на 1 год: -10% стабильности."
 MOR_Carry_out_religious_renewal:0 "Провести религиозное обновление"
 MOR_Carry_out_religious_renewal_desc:0 "Попытки либералов вытравить веру из сердец марокканцев и заменить наши вековые устои бездушными западными законами провалились. Ислам — это не просто религия, это сама суть марокканской нации, стержень, который помог нам выстоять против колонизаторов и сохранить свою идентичность. Новый курс на Великое Религиозное Обновление вернёт духовенству его законный статус духовного наставника государства. Религиозные фонды получат налоговые льготы для ведения благотворительности и поддержки бедных. Мы очистим школы от радикального секуляризма и вернем веру в центр общественной жизни. Пусть наши враги называют это шагом назад — мы знаем, что это единственно верный путь к духовному очищению и национальному триумфу! +10% модернизации госаппарата, +НД «Великое Религиозное обновление»: +5% стабильности, +10% к росту населения, +15% защита идеологии."
 MOR_Sole_rule_of_Muhammad_V:0 "Единоличная власть Мухаммеда V"
 MOR_Sole_rule_of_Muhammad_V_desc:0 "Сплотив вокруг себя нацию, султан Мухаммед V доказал, что является единственным истинным лидером Марокко. Политический хаос, фракционность и амбиции отдельных группировок лишь ослабляют молодое государство перед лицом внешних угроз. Мы должны закрепить за троном статус высшего арбитра и законодателя. Вся полнота исполнительной и духовной власти переходит в руки Его Величества. Корона станет гарантом стабильности, а воля монарха — законом для каждого марокканца +20% популярности монархизма, подъидеология монархизма сменится на абсолютную монархию, НД «Укрепление власти Муххамеда V» получит: +10% к приросту полит власти"
 MOR_Increase_loans_to_the_fellahin:0 "Увеличить кредиты феллахам"
 MOR_Increase_loans_to_the_fellahin_desc:0 "Дать феллахам землю — это лишь половина дела. Без семян для посева, без плугов, рабочего скота и современных удобрений марокканский крестьянин останется один на один со своей нищетой и засухой, а города не получат хлеба. Банки откроют беспрецедентную программу льготного долгосрочного кредитования для сельских тружеников. Эти деньги пойдут на централизованный закуп инвентаря, бурение колодцев и создание первых машинно-тракторных станций. Мы докажем марокканскому крестьянству, что социалистическое правительство заботится о них не лозунгами, а реальным делом. -100 полит власти, +1 фабрика, НД «Сельские коммуны» получит: ФНП -4%, +5% прироста населения. Для баланса сил станут доступны два решения. Можно прожать лишь одно из них один раз, второе пропадает: 1. Передать распределение кредитов традиционным советам старейшин: сдвиг на +10% в сторону Автономии, -30 полит власти, +1% стабильности 2. Выдавать кредиты строго через партийные ячейки МКП: сдвиг на +10% в сторону Централизации, +3% стабильности"
 MOR_Open_schools_for_the_fellahin:0 "Открыть школы для феллахов"
 MOR_Open_schools_for_the_fellahin_desc:0 "Кампания ликбеза показала отличные результаты в промышленных центрах, но сердце Марокко бьется в его деревнях и горных ущельях. Феллахи и пастухи Атласа веками оставались отрезанными от образования. Для них школа всегда была недоступной роскошью колонизаторов или инструментом религиозного подчинения. Мы начнём масштабное строительство начальных сельских школ и оборудуем учебные классы в каждой крупной коммуне и деревне. Эти школы станут не просто центрами грамотности для крестьянских детей и взрослых, но и очагами новой социалистической культуры. Там феллахи научатся читать, освоят основы современной агрономии и гигиены, навсегда порвав с феодальной отсталостью. +НД «Школы для феллахов»: +3% к темпам исследований."
 MOR_Nationalization_of_the_phosphate_companies:0 "Национализация фосфатных кампаний"
 MOR_Nationalization_of_the_phosphate_companies_desc:0 "Фосфатные рудники Хурибги — это подлинное сокровище Марокко, но до сегодняшнего дня вся прибыль от «белого золота» Магриба оседала в карманах иностранных банкиров и колониальных акционеров. Марокканские горняки гибли в шахтах от кремниевой пыли и обвалов за жалкие гроши, пока французские синдикаты спонсировали правые партии в Европе. Мы объявим полную аннуляцию иностранных концессий и тотальной национализации всех фосфатных и хромовых кампаний. Отныне экспорт марокканских фосфатов, жизненно необходимых для мирового сельского хозяйства и химической индустрии, станет главным источником золота и станков для нашей собственной индустриализации. +3 фабрики, +24 единицы хрома в стейте"
 MOR_End_the_gross_exploitation_of_women:0 "Прекратить вопиющую эксплуатацию женщин"
 MOR_End_the_gross_exploitation_of_women_desc:0 "Построение социализма в Марокко невозможно, пока половина населения нашей страны скована цепями двойного угнетения. Марокканские женщины годами подвергались вопиющей эксплуатации: капиталисты на швейных и табачных фабриках Касабланки платили им втрое меньше, чем мужчинам, за тот же изнурительный труд, а в сельской местности феодальные и патриархальные традиции низводили женщину до положения бесправной собственности. Мы законодательно запретим женский сверхнормативный труд, вводим жесткий запрет на занижение зарплат по половому признаку. -5% стабильности, +5% популярность коммунизма, +НД «Эмансипация марокканок»: +4% фактор военнообязанного населения, эффективность роста производства +5%."
 MOR_Support_the_popular_front_alliance:0 "Оказать поддержку альянсу Народного фронта"
 MOR_Support_the_popular_front_alliance_desc:0 "Приход коммунистов к власти во Франции вызвал ещё больший кризис, предшествующий этому. Реакция не могла оставить это без ответа, и при поддержке консервативного генералитета, они восстали против «революционеров». В это тяжелое время, мы должны поддержать своих коллег по цеху. Марокко получит право отправлять добровольцев, +20 отношения Франции к Марокко."
 MOR_Tangier_Fes_railway_loop:0 "Железнодорожная петля Танжер - Фес"
 MOR_Tangier_Fes_railway_loop_desc:0 "Горы Эр-Рифа и искусственные колониальные границы долгое время отрезали стратегический порт Танжера от сердца нашего Султаната. Но современная тотальная война не терпит транспортных тупиков. Используя французские инвестиции и инженерную мысль, мы завершим модернизацию сложнейшей железнодорожной петли Танжер — Фес. Прорубая туннели в скалах и возводя мосты над ущельями, мы свяжем северное побережье Гибралтара с нашими центральными оборонительными узлами. Отныне снабжение из Танжера будет доходить до Феса за считанные часы, а наши поезда смогут бесперебойно доставлять снаряды и подкрепления на передовую Будет проложена ЖД по провкам: 11987, 10013, 10113, 13907, 13313"
 MOR_Naval_air_base_Port_Lyautey:0 "Военно-морская авиабаза Порт-Лиоте"
 MOR_Naval_air_base_Port_Lyautey_desc:0 "Гибралтарский пролив и прибрежные воды Марокко стали охотничьими угодьями для вражеских подводных лодок, терзающих наши торговые конвои. Обычных аэродромов в глубине страны недостаточно — нам нужен специализированный аванпост на самом побережье Атлантики. Модернизация базы в Порт-Лиоте позволит разместить там эскадрильи морской патрульной авиации и тяжелых торпедоносцев. Оснащенная передовыми американскими радарами и гидросамолетами, база Порт-Лиоте станет грозным щитом Магриба. Мы закроем небо над Атлантикой и заставим субмарины противника навсегда забыть дорогу к нашим берегам! В провке 1194 добавится аэродром 5-го уровня и радар 2-го уровня, а также морская база 4го уровня, морские укрепления 3го уровня, и ПВО 2го уровня."
 MOR_Declare_claims_on_Mauritania:0 "Объявить о своих притязаниях на Мавританию"
 MOR_Declare_claims_on_Mauritania_desc:0 "Границы, прочерченные европейскими колонизаторами в песках Сахары, никогда не имели под собой законных оснований. Земли Шингети, известные сегодня как Мавритания, на протяжении веков присягали на верность марокканским султанам. Местные эмиры и кочевые племена мавров связаны с Рабатом неразрывными узами веры и истории. Теперь, наш долг — официально заявить о своих исторических правах на эти территории. Великое Марокко не будет полным, пока наши южные братья остаются под властью Парижа или в искусственной изоляции. Мы объявляем Мавританию неотъемлемой частью султаната. Будут получены претензии на все стейты Мавритании. ЕСЛИ, Марокко всё ещё в состоянии ограниченной войны с Францией, то война расширится на эти стейты."
 MOR_Return_Tangier_to_the_Sultan:0 "Вернуть Танжер под руку Султана"
 MOR_Return_Tangier_to_the_Sultan_desc:0 "Танжер — жемчужина Марокко и стратегические ворота в Средиземное море — был насильно отторгнут от султаната. Лицемерный статус «Международной зоны» превратил наш исконный город в гнездо европейских шпионов, контрабандистов и колониальных чиновников, наживающихся на марокканской торговле. Но Танжер помнит своего законного правителя. Теперь, когда Марокко вновь стало сильным и независимым, мы не потерпим иностранного присутствия на нашей земле. Мы выдвинем ультиматум державам-гарантам международного статуса. Время дипломатических уловок прошло: Танжер должен вернуться под руку Султана, а его порты — служить интересам марокканского народа. Будут получена претензия на все стейт 1042. ЕСЛИ, Марокко граничит с Танжером, то он аннексируется Марокко. Произойдёт мировое событие «Марокко аннексирует международную зону Танжер» (Из Северной Африки приходят срочные известия: Марокко официально объявило об аннексии Международной зоны Танжер. Город, который с 1923 года управлялся совместным консорциумом европейских держав как свободный порт и нейтральная территория, полностью перешел под контроль Рабата. Султан Мухаммед V ввел в город свои войска и упразднил международную администрацию."
 MOR_Progressive_social_policy:0 "Прогрессивная социальная политика"
 MOR_Progressive_social_policy_desc:0 "Построение истинной демократии невозможно без обеспечения достойного уровня жизни для каждого гражданина. Свобода слова и право голоса теряют всякий смысл, если рабочий на фабрике бесправен перед лицом капитала, а половина населения страны исключена из общественной жизни. Наша цель — превратить государственные институты в инструмент социальной справедливости. Мы вводим всеобщие трудовые гарантии, жестко ограничиваем рабочий день и устанавливаем минимальный размер оплаты труда. +10% модернизации госаппарата, сокращение НД «Адаптация общества» на 1 год, +НД «Социальные гарантии»: +5% максимальной эффективности производства, +5% стабильности."
 MOR_Introduce_the_zakat:0 "Ввести закят"
 MOR_Introduce_the_zakat_desc:0 "Западная капиталистическая система построена на ростовщичестве и эгоизме, где богатые безжалостно угнетают бедных, провоцируя классовую рознь. Но Марокко не пойдет по пути безбожного материализма. Наша экономика должна строиться на принципах справедливости, заложенных в священных текстах. Аллаль аль-Фасси объявляет о введении закята — обязательного религиозного налога в пользу бедных, сирот и нуждающихся. Отныне каждый состоятельный гражданин и крупный землевладелец обязан отдавать фиксированную долю своего имущества на нужды общества. Государственный комитет закята, действующий совместно с духовенством, обеспечит честное распределение этих средств. Эта мера не только выбьет почву из-под ног левых агитаторов, но и докажет, что традиционное исламское общество способно заботиться о своих сынах гораздо лучше, чем любые западные социальные реформы. +10% модернизации госаппарата, НД «Великое Религиозное обновление» получит: -15% ФНП"
 MOR_Oath_of_the_tribes:0 "Присяга племён"
 MOR_Oath_of_the_tribes_desc:0 "Раньше существовал ритуал - Байа, когда вожди всех племен лично клялись в верности королю, но со временем его перестали использовать. Это привело к тому, что каиды начали показывать свою нелояльность, а иногда и вовсе поднимали мятежи. Теперь это будет их личной ответственностью. НД «Укрепление власти Муххамеда V» получит: +10% к стабильности, +1,5% военнообязанного населения, +10% к атаке и скорости кавалерии."
 MOR_Moroccan_communist_youth_party:0 "Марокканская молодёжная коммунистическая партия"
 MOR_Moroccan_communist_youth_party_desc:0 "Нашей главной опорой в деле модернизации Магриба должна стать молодежь - свободная от предрассудков прошлого, энергичная и жаждущая знаний. Под эгидой МКП мы объявляем о создании Марокканской молодёжной коммунистической партии. Мы объединим молодых рабочих, студентов и вчерашних неграмотных батраков в единый авангард. Именно эти юноши и девушки станут «ударными бригадами» нашей перестройки: они будут строить новые школы, проводить коллективизацию, бороться с религиозным фанатизмом в провинциях и первыми запишутся добровольцами в Красную армию Марокко. Сдвиг на +10% в сторону Централизации, +1 ячейка для министров, НД «Крестьянские ассоциации» сменит название на «Сельские и молодёжные организации МКП» и получит: +15% скорости мобилизации, +10% фактор военнообязанного населения, скорость строительства социальной инфраструктуры +20%. ЕСЛИ выполнен фокус «Союз женщин Марокко», то будут удалены следующие НД: «Крестьянские ассоциации», «Женские и антифашистские организации МКП»."
 MOR_Collectivization:0 "Коллективизация"
 MOR_Collectivization_desc:0 "Мелкие крестьянские хозяйства, раскиданные по долинам и предгорьям Атласа, неспособны накормить растущие социалистические города и молодую армию Марокко. Пока феллах пашет свой крошечный надел деревянным плугом, мы остаемся заложниками неурожаев и технической отсталости. Пришло время для решительного шага вперед — объединения единоличных хозяйств в крупные, технически оснащенные сельскохозяйственные кооперативы и коллективные коммуны. Объединив землю, скот и инвентарь под управлением Коммунальной ассамблеи, мы сможем победить засуху и навсегда ликвидировать кулачество как класс. Земля Марокко должна стать единым цветущим садом социализма! -100 полит власти, +1 ячейка для строительства в каждом нац стейте Марокко, НД «Сельские коммуны» и НД «Школы для феллахов» будут удалены. Будет получен НД «Коллективное хозяйство»: +3% к темпам исследований, прирост политической власти +0,1, скорость строительства инфраструктуры +15%, ФНП -12%, +20% прироста населения, стабильность +10%, Для баланса сил станут доступны два решения. Можно прожать лишь одно из них один раз, второе пропадает: 1."
 MOR_Establish_social_security:0 "Организовать социальную защиту"
 MOR_Establish_social_security_desc:0 "Капиталистическая система относилась к марокканскому труженику как к одноразовому инструменту: искалеченный на шахте горняк, заболевший текстильщик или овдовевшая мать с детьми выбрасывались на улицу умирать от голода. Социалистическое государство обязано гарантировать, что ни один гражданин не останется один на один с бедой. Мы введём первые в истории Африки государственные пенсии по старости и инвалидности, оплачиваемые декретные отпуска для женщин, а также пособия для семей, потерявших кормильца. Средства на это будут напрямую изыматься из прибылей национализированных банков и фосфатных компаний. Наша республика — это не только заводы и штыки, это забота о каждом человеке труда. НД «Программы повышения грамотности» сменится на «Социальные программы и защита» и получит ещё: +6% минимальной эффективности производства, +3% максимальной эффективности производства."
 MOR_Set_minimum_wages_in_factories:0 "Установка минимальных зарплат на заводах"
 MOR_Set_minimum_wages_in_factories_desc:0 "Легализация профсоюзов дала рабочим голос, но их благосостояние должно быть гарантировано железным законом республики. При колониальном режиме фабриканты Касабланки и Рабата выжимали из марокканского пролетариата все соки, выплачивая за четырнадцатичасовой рабочий день жалкие гроши, которых едва хватало на хлеб. Отныне устанавливается единый жесткий тарифный минимум для всех промышленных предприятий, обязательный к исполнению. Любая попытка управляющих занизить ставку, задержать выплаты или ввести систему незаконных штрафов будет караться как экономическое преступление против революции. Сытая и уверенная в завтрашнем дне рабочая семья — это залог нерушимости социалистического строя! +10% популярности коммунизма, НД «Профсоюзный контроль» получит: +5% роста эффективности производства, +5% стабильности."
 MOR_Womens_Union_of_Morocco:0 "Союз женщин Марокко"
 MOR_Womens_Union_of_Morocco_desc:0 "Под руководством жены Леона Султана мы объявляем о создании Союза женщин Марокко. Эта массовая государственная организация развернет свои комитеты во всех городах, шахтерских поселках и отдаленных берберских общинах. СЖМ возьмет под контроль условия труда на текстильных и пищевых фабриках, откроет первые в истории страны женские медицинские консультации, ясли и детские сады, а также организует специальные вечерние курсы по ликвидации неграмотности среди женщин-феллахов. Социализм в Марокко победит окончательно, когда марокканка займет равное место в строю строителей нового общества! +1 ячейка для министров, НД «Эмансипация марокканок» и «Антифашистский комитет» будут удалены, взамен будет получен НД «Женские и антифашистские организации МКП»: +8% фактор военнообязанного населения, эффективность роста производства +8%, +10% поддержка войны, эффективность контрразведки +1.0, +3 максимума дивизий для отправки добровольцами, +0,05 прироста коммунизма ЕСЛИ выполнен фокус «Марокканская молодёжная коммунистическая партия», то будут удален НД: «Сельские и молодёжные организации МКП»."
 MOR_Strike_spanish_Morocco:0 "Нанести удар по Испанскому Марокко"
 MOR_Strike_spanish_Morocco_desc:0 "Испания находится в таком же положении, как и Франция, и это прекрасная возможность для нас, чтобы вернуть наши земли, которыми управляет националистическое правительство Испании. Центральное правительство готово признать эти земли за нами, если мы поможем им и разгромим силы врага в Африке. Стейты 290, 1066, 1015, 699 станут национальными для Марокко, а Республиканская Испания потеряет любые претензии на эти земли. +20 отношения Республиканской Испании к Марокко."
 MOR_Support_in_Europe:0 "Поддержка в Европе"
 MOR_Support_in_Europe_desc:0 "Та помощь, которую мы оказали революционному правительству Франции – недостаточна. Мы должны мобилизовать все свои силы и отправить помощь на континент, чтобы вместе разгромить фашистскую гидру Аксьон Франсеза! Марокко получит право вступить в ГВ Франции и помочь ей. +40 отношения Франции к Марокко."
 MOR_Evacuation_military_hospitals:0 "Военные госпитали эвакуации"
 MOR_Evacuation_military_hospitals_desc:0 "Наши доблестные стрелки и гумы проливают кровь на полях сражений в Италии и Франции, взламывая самые неприступные укрепления врага. Но цена этих побед высока, и наш долг — позаботиться о каждом раненом сыне Султаната. Развертывая сеть современных военных госпиталей эвакуации, мы организуем четкую цепочку спасения жизней: от передовых санитарных отрядов до тыловых медицинских центров в Касабланке и Рабате. Привлечение лучших врачей, использование передовых медикаментов и американского оборудования позволят нам победить гангрену и тиф. Мы вернем тысячи закаленных ветеранов в строй и сохраним генофонд нашей нации. Во всех нац стейтах будет получен +1 уровень соц инфраструктуры, 1х 100% к темпам изучения полевых госпиталей, +НД «Госпитали эвакуации»: Снижение безвозвратных потерь армии на 15%. _____________________________________________________________________________ ВЕТКА МКД И СУЛТАНА"
 MOR_Declare_claims_on_part_of_Algeria:0 "Объявить о своих притязаниях на часть Алжира"
 MOR_Declare_claims_on_part_of_Algeria_desc:0 "Французская колониальная администрация произвольно перекраивала карту Магриба, расширяя границы Алжира за счет исторических земель Марокканского султаната. Земли вокруг Тиндуфа и Туата веками омывались кровью марокканских воинов и подчинялись Рабату, но Париж передал их под управление своей алжирской администрации. Пришло время исправить эти географические преступления. Мы официально объявляем о своих правах на западные регионы Алжира. Граница в Сахаре и на западе будет пересмотрена, и справедливость восторжествует — мирно или силой оружия. Будут получена претензия на стейты: 1067 и 513. ЕСЛИ, Марокко всё ещё в состоянии ограниченной войны с Францией, то война расширится на этот стейт."
 MOR_Declare_the_greater_jihad:0 "Объявить «Большой джихад»"
 MOR_Declare_the_greater_jihad_desc:0 "Мы победили врагов на поле боя и очистили наши земли от иностранных гарнизонов, но «Малый джихад» был лишь прелюдией. Настоящая битва за будущее Марокко разворачивается в умах и сердцах нашего народа. Нами объявлен «Большой джихад» — священная внутренняя борьба за духовное очищение, искоренение колониального менталитета, коррупции и кумовства. Под мудрым руководством султана, как Повелителя правоверных, мы объединим модернизм и вековые традиции Ислама. Мы построим справедливое, высокоморальное и монолитное общество, где каждый гражданин трудится ради процветания родины. Нация, победившая свои слабости, станет по-настоящему непобедимой. +НД «Большой джихад» на 2 года: +20% к скорости строительства, +10% к темпам исследований, +5% к росту и максимуму эффективности производства."
 MOR_Limit_the_power_of_the_monarch:0 "Ограничить власть монарха"
 MOR_Limit_the_power_of_the_monarch_desc:0 "Независимое Марокко не сможет стать современным правовым государством, пока вся полнота власти сосредоточена в руках одного человека. Монархия сыграла свою роль как символ единства в борьбе против колонизаторов, но теперь амбиции дворца и старой аристократии стали тормозом. Настало время обуздать абсолютизм и провести конституционную реформу, превратив короля в церемониальную фигуру и передать реальное управление страной избранному парламенту и премьер-министру. +10% модернизации госаппарата, -30% популярности монархии, субъидеология демократии сменится на Национал-либерализм, субъидеология монархии сменится на дуалистическую монархию. + ИЛИ продление НД «Адаптация общества» на 1 год: -10% стабильности;"
 MOR_Penitentiary_reform:0 "Пенитенциарная реформа"
 MOR_Penitentiary_reform_desc:0 "Мы начинаем масштабную реформу системы исполнения наказаний. Тюрьмы должны превратиться из мест пыток в институты реабилитации и исправления. Мы ликвидируем бесчеловечные условия содержания, введем программы профессионального обучения для заключенных и обеспечим строгий судебный надзор за действиями тюремной администрации. Гуманизм и законность должны торжествовать даже там, где человек оступился. Сильная нация не ломает своих граждан — она возвращает их в общество! +10% модернизации госаппарата, сокращение НД «Адаптация общества» на 150 дней, НД «Социальные гарантии» получит: +5% стабильности, +5% скорости строительства"
 MOR_Expand_religious_movements:0 "Расширить религиозные движения"
 MOR_Expand_religious_movements_desc:0 "Настоящая сила нашего государства сокрыта не в штыках регулярной армии, а в непоколебимой вере марокканского народа. Исламские братства, суфийские ордены и местные религиозные союзы веками были костяком нашего сопротивления чужеземцам. Теперь, когда независимость завоевана, они должны стать фундаментом нового общества. Аллаль аль-Фасси призывает открыть двери для широкой деятельности массовых религиозных движений. Государство окажет им полную финансовую и организационную поддержку. Мы позволим им основывать новые общины, открывать благотворительные центры и легально вести проповедь во всех уголках страны — от крупных городов до затерянных в горах берберских деревень. Эти движения станут нашими глазами и ушами, нашей главной защитой от подрывной пропаганды светских либералов и левых радикалов. +10% модернизации госаппарата, НД «Великое Религиозное обновление» получит: +25% защита идеологии, +0,1 поддержки демократии, +0,1 поддержки монархизма, +1 ячейка оперативника, + 5% стабильности, -5% прироста полит власти, _____________________________________________________________________________ ВЕТКА МОНАРХИИ"
 MOR_Give_refuge_and_protection_to_the_jews:0 "Предоставить евреям укрытие и защиту"
 MOR_Give_refuge_and_protection_to_the_jews_desc:0 "Перед лицом преследований и жестокости, охвативших Европу, Марокко должно остаться оплотом справедливости. На протяжении веков еврейская община была неотъемлемой частью нашего общества, внося неоценимый вклад в его культуру и экономику. Султан Мухаммед V ясно заявляет: подданные Марокко равны перед лицом престола, независимо от их веры. Мы откроем наши двери для беженцев, обеспечим безопасность местных общин и отвергнем любые попытки внешних сил навязать нам законы ненависти. Под защитой короны они найдут мир. +НД «Предоставлении укрытия евреям»: +30% прироста населения."
 MOR_Full_nationalization_of_french_property:0 "Полная национализация французского имущества"
 MOR_Full_nationalization_of_french_property_desc:0 "Десятилетиями французские банкиры, промышленники и латифундисты выкачивали богатства из нашей земли, оставляя марокканскому народу лишь нищету и тяжелый, рабский труд. Этому несправедливому порядку пришел конец. Наша независимость будет пустой декларацией, если экономика останется в руках врага. Мы объявляем о полной, безвозмездной национализации всех французских предприятий, концессий, банковских активов и крупных земельных угодий на территории Марокканской Советской Республики. Все, что создано на марокканской земле, отныне будет принадлежать марокканскому народу! Мировое напряжение +1%, +1 военный завод, +1 фабрика, +10% популярности коммунизма."
 MOR_Raising_the_living_standard:0 "Повышение уровня жизни населения"
 MOR_Raising_the_living_standard_desc:0 "Пороховая бочка «Красного июня» не просто взорвала старый мир — на её обломках мы возвели прочный фундамент нового общества. Земля отдана тем, кто её пашет, заводы и фосфатные богатства принадлежат тем, кто стоит у станков и спускается в забой, а тьма неграмотности рассеяна первыми тысячами народных школ. Перестройка достигла своей главной, заветной цели. Социализм в Марокко — это больше не лозунг на транспарантах Красной гвардии, это сытый хлеб в каждом доме, качественная медицина для марокканских матерей, уверенность в завтрашнем дне, и гордость за свободную родину. Мы доказали всему миру, что освобожденный пролетариат Африки способен построить справедливое, передовое и процветающее государство. Тултип: Эффект будет полностью зависеть от того, в какую сторону сдвинут баланс сил. +200 полит власти, +10 стабильности, баланс сил исчезнет.Если весы сдвинуты в сторону «Централизации МКП» более чем на 25%: будет получен эффект +1 ячейка исследований, +НД «Африканский социалистический прорыв»: Скорость строительства +20%, максимум эффективности производства +10%, прирост коммунизма +0,2, прирост политической власти +0,2."
 MOR_Negotiations_for_independence:0 "Переговоры о независимости"
 MOR_Negotiations_for_independence_desc:0 "Выстрелы во Франции прекратились, ознаменовав начало новой эпохи для Франции, но возможно, что это новая эпоха и для нас? Прошло достаточно времени, чтобы мы могли поднять вопрос нашей полной независимости, и вероятно, успех этих переговоров будет зависеть полностью от наших предыдущих действий. Тултип: Чем больше была ваша поддержка во время войны, тем больше шанс, что ваш суверенитет будет признан. Для Франции произойдёт событие «Марокко просит признания независимости их республики» (Кровь, пролитая на баррикадах, скрепляет союзы крепче любых договоров. Когда реакционные генералы и правое движение «Аксьон Франсез» подняли оружие против молодой Французской Коммуны, Марокканская Союзная Республика не осталась в стороне. Рабат не просто соблюдал обновленный Фесский договор — марокканский пролетариат и бесстрашные горцы Атласа прислали свои лучшие интербригады, помогшие нам сокрушить правую гидру прямо здесь, на улицах европейской Франции. Но теперь, когда гражданская война позади и дым сражений рассеялся, марокканские товарищи вежливо, но непреклонно напоминают нам о цене этой верности. Из Рабата прибыла делегация во главе с ЦК МКП."
 MOR_Support_anticolonial_positions_in_the_arab_world:0 "Поддержать антиколониальные позиции в арабском мире"
 MOR_Support_anticolonial_positions_in_the_arab_world_desc:0 "Наш собственный триумф над колониализмом доказал всему миру: даже самые мощные европейские империи можно сокрушить, если нация едина в своем стремлении к свободе. Но Марокко не может оставаться безучастным, пока наши братья на Ближнем Востоке — от берегов Нила до песков Междуречья — все еще томятся под британскими мандатами и французским управлением. Мы станем главным голосом и надежным щитом угнетенных арабских народов. Рабат превратится в центр панарабского сопротивления. Мы будем тайно и явно поставлять оружие, финансировать национально-освободительные движения и координировать восстания. Арабский мир должен сбросить оковы Запада от Атлантики до Персидского залива! +НД «Антиколониальная война»: Будет установлено правило – может объявлять войны всем, -50% к росту напряжения от освободительных войн, +50% к скорости оправдания освободительных войн, -50% к стоимости создания марионетки, +25% к росту подчинения."
 MOR_Pan_arab_ambitions_of_Muhammad_V:0 "Панарабские амбиции Мухаммеда V"
 MOR_Pan_arab_ambitions_of_Muhammad_V_desc:0 "Процесс деколонизации, запущенный нами, навсегда изменил ход мировой истории. Марокко не просто вернуло себе свободу, но и смогло стать главным центром силы в регионе, изгнав европейские гарнизоны из ключевых точек Магриба и Ближнего Востока. Однако независимость по отдельности делает молодые арабские государства уязвимыми перед новым экономическим и военным давлением великих держав. Взоры миллионов мусульман от Касабланки до Багдада обращены к нашему правителю. Султан Мухаммед V, как Повелитель правоверных, обладает неоспоримым правовым, духовным и светским авторитетом, способным объединить разделенные нации. Настало время объявить о намерении объединить арабский мир в единое государство под скипетром марокканской династии. Станет доступна НАША категория решений «Объединить Магриб». Станет доступна НАША категория решений «Объединить арабский мир». +НД «Панарабские амбиции Мухаммеда V»: Будет установлено правило – может объявлять войны всем, +50% к скорости оправдания войны, -75% лимита напряжённости для объявления войны, атака +10%, скорость дивизий +10%."
 MOR_Expand_student_movements:0 "Расширить студенческие движения"
 MOR_Expand_student_movements_desc:0 "Борьба за будущее Марокко разворачивается не только в министерских кабинетах и залах суда, но и в университетских аудиториях. Молодежь — это авангард нашей модернизации, самый чуткий и решительный союзник Патриотичного движения. Пока консерваторы из Национальной партии опираются на закостенелые деревенские общины и духовенство, мы взрастим новую опору прогресса. Новые государственные стипендии, поддержка создания независимых студенческих союзов и свобода политического слова. Мы превратим университеты Рабата, Феса и Касабланки в кузницы кадров для нового государственного аппарата. +10% модернизации госаппарата, +НД «Студенческие движения»: +0,5% военнообязанного населения, +0,1 к приросту демократии, +3% к темпам исследований, -10% стоимости министров, -10% полит власти."
 MOR_Land_reform:0 "Земельная реформа"
 MOR_Land_reform_desc:0 "Независимость принесла свободу нашей стране, но не принесла хлеба тем, кто эту землю обрабатывает. Огромная часть плодородных угодий до сих пор сконцентрирована в руках узкого круга феодальной аристократии, крупных колониальных латифундистов и религиозных фондов. Пока миллионы безземельных крестьян живут в нищете и работают за гроши, экономика Марокко будет оставаться отсталой и уязвимой. Мы объявляем о начале масштабной земельной реформы. Излишки земель крупных магнатов будут принудительно выкуплены государством по справедливой цене и распределены среди крестьянских общин и мелких фермеров. Мы прекратим эти феодальные связи между феллахами и их невольниками! +10% модернизации госаппарата, -200 полит власти, НД «Социальные гарантии» сменит название на «Итоги демократических реформ» и получит: +5% стабильности, +20% к росту населения, +10% свободных ячеек, -5% ФНП."
 MOR_Join_the_Comintern:0 "Вступить в Коминтерн"
 MOR_Join_the_Comintern_desc:0 "В одиночку нам не выдержать затяжного противостояния с капиталистическим миром. Французский империализм жаждет реванша, а британский флот в Гибралтаре стережет наши берега как хищник. Единственное спасение для молодой Марокканской Советской Республики — это официальный, нерушимый союз с Первым в мире государством рабочих и крестьян. Наши эмиссары отправляются в Москву, чтобы подписать соглашение о вступлении в Коммунистический Интернационал. Отныне безопасность Рабата — это обязанность Кремля. Под сенью советских штыков и под защитой Красного Флота мы превратим Марокко в неприступную крепость социализма на берегах Атлантики! Для СССР произойдёт генерик событие на вступление Марокко в Коминтерн. _____________________________________________________________________________ КОМВЕТКА ПОД ВЛИЯНИЕМ ФРАНЦИИ"
 MOR_Active_support_of_internationalism:0 "Активная поддержка интернационализма"
 MOR_Active_support_of_internationalism_desc:0 "Наша революция в Марокко увенчалась триумфом, но истинный марксизм-ленинизм учит нас, что социализм не может замкнуться в границах одного государства, особенно в колониальном Магрибе. Мы окружены империалистическими хищниками, угнетающими миллионы людей по расовому, национальному и религиозному признаку. Отныне внешняя политика новой Марокканской Народной Республики базируется на принципах пролетарского интернационализма. Мы открываем наши двери и ресурсы для всех угнетенных народов, революционных беженцев и национально-освободительных движений мира. Мы станем безопасной гаванью для тех, кто борется против фашизма и колониализма, и зажжем маяк интернационального братства на берегах Африки. Свобода Марокко — это лишь первый шаг к свободе всего человечества! Поддержка войны +10%, с комм, тро и анархами будет добавлен модификатор отношений «Интернационалистическая солидарность»: +40 отношения к Марокко, +1.0 мировой напряги, +НД «Факел интернационализма»: +2 к максимуму добровольческих дивизий"
 MOR_Annext_Tangier:0 "Аннексировать Танжер"
 MOR_Annext_Tangier_desc:0 "Танжер — это незаживающая рана на теле нашей родины. Статус «Международной зоны» — это лишь циничная ширма, за которой европейские империалисты превратили этот великий марокканский порт в рассадник контрабанды, притон для беглых буржуа и гнездо капиталистического шпионажа. Пока Танжер находится под контролем западных держав, безопасность Марокканской Народной Республики под угрозой, а наш флот заперт в гаванях. Комитет Леона Султана заявляет: эпоха колониальных анклавов окончена. Мы выдвигаем ультиматум международному комитету Танжера. Они должны немедленно спустить свои флаги и передать управление городом в руки марокканского пролетариата. Если империалисты откажутся уйти добровольно — Красная гвардия и полки гумьеров заставят их сделать это силой оружия. Танжер будет марокканским! Будут получена претензия на стейт 1042. Танжер аннексируется Марокко. Произойдёт мировое событие «Марокко аннексирует международную зону Танжер» (Из Северной Африки приходят срочные известия: Марокко официально объявило об аннексии Международной зоны Танжер."
 MOR_Remain_an_ally_of_France:0 "Остаться союзником Франции"
 MOR_Remain_an_ally_of_France_desc:0 "Полная независимость может подождать. Мы остаёмся в орбите Франции, выторговывая у сюзерена права и полномочия шаг за шагом."
 MOR_Drive_the_colonizers_from_the_Libyan_plateau:0 "Прогнать колонизаторов с Ливийского плато"
 MOR_Drive_the_colonizers_from_the_Libyan_plateau_desc:0 "Французские и испанские колонизаторы отступили, но на востоке, за нашими тунисскими рубежами, итальянский фашизм продолжает душить Ливию. Рим заявляет, что Ливийское плато и побережье Магриба — это их «Четвертый берег», законная часть новой Римской империи. Они жестоко подавили восстание Омара аль-Мухтара, но угольки сопротивления всё еще тлеют. Марокко не может чувствовать себя в безопасности, пока у наших ворот стоит мощная европейская военная машина. Мы протянем руку помощи ливийским братьям-сенуситам, поднимем племена Киренаики и Триполитании на восстание и навсегда изгоним итальянских захватчиков с Ливийского плато. Африка принадлежит африканцам! Будет получена цель войны «освобождение» Ливана, Судана, Египта."
 MOR_Remove_the_shackles_from_the_Berbers:0 "Снять кандалы с берберов"
 MOR_Remove_the_shackles_from_the_Berbers_desc:0 "Французские колонизаторы долгие годы пытались расколоть наше общество, навязывая так называемый «Берберский дахир». Они искусственно разделяли нас по законам и языку, пытаясь противопоставить арабские города и берберские горы по принципу «разделяй и властвуй». Но именно бесстрашные воины Атласа и Рифа первыми проливали кровь за свободу султаната. Пришло время окончательно сокрушить эти колониальные оковы. Мы официально отменяем все дискриминационные декреты, признаем берберов полноправными и свободными гражданами («Имазиген»), а их язык и древние суды — законной частью нашей государственности. Марокко монолитно, и его сыны больше не знают разделения! Будет получена цель войны «освобождение» Туниса, Алжира."
 MOR_Extend_our_rule_over_the_Maghreb:0 "Распространить свою власть на Магриб"
 MOR_Extend_our_rule_over_the_Maghreb_desc:0 "Регион Магриба — от песчаных берегов Атлантики до залива Габес — всегда представлял собой единое цивилизационное, культурное и историческое пространство. Веками марокканские династии объединяли эти земли под своей эгидой, защищая их от внешних угроз. Колониальный раздел искусственно раздробил арабский Запад, но сегодня Марокко вновь обрело силу и голос. Мы не можем ограничиваться собственными границами, пока наши соседи слабы или находятся под чужим влиянием. Султанат должен заявить о своих законных правах на лидерство в Северной Африке. Мы распространим свое политическое, экономическое и военное влияние на весь Магриб. Будут получены претензии на нац стейты Алжира и Туниса. Будет получена цель войны против владельцев этих стейтов"
 MOR_Campaign_on_the_Libyan_plateau:0 "Поход на Ливийское плато"
 MOR_Campaign_on_the_Libyan_plateau_desc:0 "Наши позиции в Алжире и Тунисе прочны, но объединение арабского Запада не может быть завершено, пока обширные территории Ливийского плато остаются под чужим контролем или в руках слабых правителей. Эти бескрайние пустыни и ключевые порты на побережье Средиземного моря имеют колоссальное стратегическое значение. Контроль над Ливией позволит нам создать единый оборонительный вал в Северной Африке и вплотную подойти к границам Аравийского полуострова. Настало время отправить наши моторизованные колонны и закаленных в боях воинов через пустыню. Поход на Ливийское плато решит вопрос о том, кто является истинным хозяином южного Средиземноморья. Будут получены претензии на нац стейты Ливии, Египта и Судана. Будет получена цель войны против владельцев этих стейтов."
 MOR_Attract_spanish_refugees:0 "Привлечь испанских беженцев"
 MOR_Attract_spanish_refugees_desc:0 "Испанская Республика пала, преданная западными «демократиями» и растоптанная фашистскими сапогами. Но поражение в Мадриде не означает конец борьбы. Тысячи закаленных бойцов Интербригад, коммунистов, анархистов, инженеров, врачей и ученых бегут от франкистского террора. Мы не закроем перед ними двери. Марокканская Народная Республика объявляет программу спасения и привлечения испанских левых эмигрантов. Мы предоставим им убежище, подъемные средства, жилье и рабочие места на наших национализированных заводах и шахтах. Эти люди — ценнейший человеческий и интеллектуальный капитал, закаленный в боях. Приютив их, мы не только проявим истинную пролетарскую солидарность, но и получим тысячи опытных рук для модернизации Марокко, а также преданных солдат для будущего ответного удара по фашизму. +20 очков опыта, +1000 опыта для генералов, +1,500 пехотного снаряжения, 100 артиллерии, -30 отношения с нац испанией, +НД «Беженцы из Испании» на два года: +500 человек в неделю, +0,1 прирост военного опыта армии, +4% к темпам исследования, +4% к максимальной эффективности производства, +15% ФНП."
 MOR_Support_for_national_minorities:0 "Поддержка нац меньшинств"
 MOR_Support_for_national_minorities_desc:0 "Марокко веками было плавильным котлом культур, где бок о бок жили арабы, коренные берберские племена и одна из крупнейших еврейских общин исламского мира. Однако и колониальные власти, и старая феодальная элита всегда использовали политику «разделяй и властвуй», разжигая межнациональную и межрелигиозную рознь ради удержания своих богатств. Теперь в Марокко больше не будет людей «второго сорта». Мы законодательно гарантируем полное равенство всех национальных и религиозных общин. Еврейские кварталы Касабланки и Феса навсегда освобождаются от старых сегрегационных ограничений, а берберские кланы Атласа получают официальное признание своего языка и самобытности. НД «Факел интернационализма» получит: фактор военнообязанного населения +10%, рост сопротивления на захваченных вами землях -20%"
 MOR_Uphold_universal_human_rights:0 "Поддерживать всеобщие права человека"
 MOR_Uphold_universal_human_rights_desc:0 "Наша социалистическая перестройка не будет полной, если мы заменим колониальный террор партийным деспотизмом. Настоящий, гуманный марксизм провозглашает: высшей ценностью республики является человек труда, его свобода, достоинство и безопасность. Мы официально утверждаем Всеобщую декларацию прав человека Марокканской Народной Республики. Наша конституция гарантирует неприкосновенность личности, абсолютную свободу совести и вероисповедания, свободу слова для антиимпериалистической прессы и защиту от любых форм дискриминации по расовому, гендерному или национальному признаку. С дем странами будет добавлен модификатор отношений «Поддержка всеобщих прав человека»: +20 отношения к Марокко, +НД «Гражданские свободы в Магрибе»: Прирост политической власти +0,15, эффективность контрразведки +10%."
 MOR_Liberate_the_Arabian_peninsula:0 "Освободить Аравийский полуостров"
 MOR_Liberate_the_Arabian_peninsula_desc:0 "Аравийский полуостров — колыбель нашей веры и сердце арабской цивилизации — скован по рукам и ногам. С одной стороны, британский империализм намертво вцепился в стратегические порты Адена, Омана и Договорного Омана, превратив их в свои колониальные базы. С другой — полуостров раздирают внутренние династические споры, подпитываемые европейским золотом и интересами нефтяных магнатов. Мы не можем называть себя защитниками арабского мира, пока священные земли Мекки, Медины и бескрайние просторы Неджда остаются уязвимыми перед лицом западного диктата. Марокко поведет священный поход на Восток. Мы изгоним британские гарнизоны, свергнем марионеточные режимы и объединим Аравию под знаменем истинной независимости. Будет получена цель войны «освобождение» Палестины, Трансиордании, Касири, Куайти, Махры, Омана, Маската, Договорного Омана, Катара, Бахрейна, Кувейта"
 MOR_Restore_the_holy_shrines_of_Arabia:0 "Вернуть религиозные святыни Аравии"
 MOR_Restore_the_holy_shrines_of_Arabia_desc:0 "Наш Султан, как Повелитель правоверных и прямой потомок Пророка, обладает неоспоримым духовным авторитетом во всем исламском мире. Однако святые города Мекка и Медина — сердце нашей веры — находятся в руках чужаков. Аравийский полуостров либо раздроблен под властью местных правителей, либо скован британскими колониальными сетями. Деньги, нефтяные интересы и иностранный шпионаж оскверняют священную землю Хиджаза. Марокко больше не может оставаться в стороне. Наш религиозный и исторический долг — организовать великий поход на Восток, изгнать неверных, навести порядок на полуострове и вернуть религиозные святыни Аравии под праведную руку Султана. Наша армия пойдет вперед под знаменем веры, и никто не сможет остановить этот священный марш. Будут получены претензии на нац стейты Палестины, Трансиордании, Касири, Куайти, Махры, Омана, Маската, Договорного Омана, Катара, Бахрейна, Кувейта, Саудов, Ирака, Йемена. Будет получена цель войны против владельцев этих стейтов. Будет получена цель войны против владельцев этих стейтов."
 MOR_Promote_Arab_Muslim_Moroccan_national_identity:0 "Продвигать арабо-мусульманскую марокканскую национальную идентичность"
 MOR_Promote_Arab_Muslim_Moroccan_national_identity_desc:0 "Колонизаторы пытались доказать, что марксизм чужд африканской и арабской почве. Но истинное освобождение Марокко невозможно без опоры на наши великие культурные и духовные корни. Наш социализм — это не слепое копирование европейских доктрин; это плод нашей собственной истории. Мы соединим идеалы социальной справедливости, равенства и взаимопомощи, заложенные в исламской традиции, с марксистской классовой теорией. Арабский язык и культура очищаются от колониальных наслоений и станет главным инструментом просвещения. Прогрессивное духовенство, признавшее власть трудящихся, приравнивается к строителям социализма. Этот уникальный синтез навсегда выбьет почву из-под ног контрреволюционеров, пытающихся разжечь религиозную войну, и сплотит нацию вокруг МКП. Станет доступна НАША категория решений «Объединить Магриб». Станет доступна НАША категория решений «Объединить арабский мир»."
 MOR_No_mandates_in_the_Syrian_region:0 "Никаких мандатов в Сирийском регионе"
 MOR_No_mandates_in_the_Syrian_region_desc:0 "Лига Наций выдала европейским державам так называемые «мандаты» на управление арабскими землями. Это не более чем юридическая ширма для прикрытия самого позорного и грабительского колониализма. Французская администрация в Сирии и Ливане жестоко подавляла восстания, бомбила Дамаск и грабила богатства Леванта, обещая независимость лишь на словах. Но время французского диктата на Ближнем Востоке истекло. Мы открыто заявляем: Левант принадлежит сирийцам и ливанцам. Марокко окажет прямую военную и политическую поддержку местным национально-освободительным силам. Мы сотрем само понятие «мандат» с политической карты мира и изгоним французских наместников из Сирийского региона раз и навсегда! Будет получена цель войны «освобождение» Серии, Ливана, Джабаль аль-Друза, государство алавитов."
 MOR_Capture_distant_lands:0 "Захват дальних земель"
 MOR_Capture_distant_lands_desc:0 "Лига Наций выдала европейским державам так называемые «мандаты» на управление арабскими землями, что на деле оказалось лишь юридической ширмой для жестокой колониальной эксплуатации. Французская администрация в Сирии и Ливане годами подавляла местное население, удерживая контроль над Левантом силой оружия. Но эпоха европейского диктата на Ближнем Востоке подошла к концу. Марокко, утвердив свое лидерство в Северной Африке, обязано распространить свою власть на восток. Мы не потерпим чужеродных военных баз и наместников в самом сердце Леванта. Наши армии готовы форсировать Суэц и пески Синая. Мы сотрем само понятие «мандат» с политической карты мира и подчиним сирийский регион воле нашего султаната! Будут получены претензии на нац стейты Сирии, друзов, алавитов и Ливана. Будет получена цель войны против владельцев этих стейтов."
 MOR_Offer_unification_to_Israel:0 "Предложить Израилю объединиться"
 MOR_Offer_unification_to_Israel_desc:0 "Вопрос Палестины и Израиля – длится слишком долго, а всё из-за разногласий евреев и мусульман. Наш пример отлично показывает, что мы можем жить в мире и процветании, что мы и предложим этим землям, истощённым вечным конфликтом. Наша общая идентичность — классовое братство. Мы отправим дипломатическую миссию в Тель-Авив и Иерусалим. Мы предложим еврейским и арабским товарищам революционный пакт: отказаться от узкого буржуазного национализма и объединиться с Марокко в единую Ближневосточную Социалистическую Федерацию. Это государство станет общим домом, где гарантированы права каждого рабочего, крестьянина и ремесленника, а штыки наших армий сольются в единый антиимпериалистический фронт. Для Британской Палестины, Израиля или Палестины произойдёт событие «Рабат предлагает сформировать Ближневосточную Федерацию» (Чрезвычайный марокканский атташе от Комитета Леона Султана прибыл в наше правительство с беспрецедентным предложением. Ссылаясь на успешный опыт мирного сосуществования арабов и евреев в Марокканской Коммуне, Рабат призывает нас остановить братоубийственную войну на Ближнем Востоке."
 MOR_Liberate_the_holy_land:0 "Освободить Святую землю"
 MOR_Liberate_the_holy_land_desc:0 "Земля Леванта, священная для миллионов мусульман, иудеев и христиан, слишком долго оставалась разменной монетой в геополитических играх западных империалистов. Британская корона превратила Палестину в свой военный плацдарм, залив её кровью арабских крестьян и еврейских беженцев, искусственно стравливая их друг с другом. Но уникальный опыт Марокканской Народной Республики доказал: интернациональное братство способно залечить любые раны. Мы не можем спокойно смотреть, как наши ближневосточные товарищи стонут под гнетом британских штыков. Мы бросим открытый вызов колониальной империи и изгоним оккупантов из Палестины, превратив Иерусалим в интернациональную столицу мира, равенства и социализма! Будет получена цель войны (аннексия) против этого тега, Марокко получит претензии на все нац земли Израиля/Палестины ЕСЛИ эти земли принадлежат кому то другому, то появится цель войны против этих тегов, Марокко получит претензии на все нац земли Израиля/Палестины"
 MOR_Father_of_all_Arabs:0 "Отец всех арабов"
 MOR_Father_of_all_Arabs_desc:0 "Победы нашего оружия и дипломатии на Ближнем Востоке и в Северной Африке создали новую геополитическую реальность. Мы не просто изгнали колонизаторов — мы стерли искусственные границы, веками разделявшие наш народ. Теперь, когда Магриб и Машрик объединены под сенью нашего государства, Султан Мухаммед V перестал быть просто правителем Марокко. Для миллионов людей от Атлантического океана до Персидского залива он стал живым символом возрождения, справедливости и единства. Как прямой потомок Пророка и Повелитель правоверных, Султан принимает титул «Отца всех арабов» (Аб аль-Араб). Этот шаг окончательно закрепляет сакральный статус нашей династии, превращая верность монарху в главный закон и высшую добродетель новой евразийской сверхдержавы. Мухаммед V получит трейт «Отец всех арабов»: +20% стабильности, +1000 военнообязанного населения в неделю, +20% поддержка войны, +10% атаки и защиты на нац территориях. _____________________________________________________________________________ ВЕТКА ДЕМОКРАТОВ"
 MOR_Embrace_the_Ahuvat_Amim_concept:0 "Принять концепцию «Ахуват амим»"
 MOR_Embrace_the_Ahuvat_Amim_concept_desc:0 "Буржуазные националисты с обеих сторон пытаются превратить Левант в вечную зону братоубийственной войны, играя на руку британским колонизаторам. Правые сионисты мечтают об изолированном капиталистическом государстве, а арабские феодалы жаждут сбросить рабочих в море. Но мы нашли верный путь - концепцию «Ахуват Амим» — Братства народов. Мы заявляем на весь мир: Палестина не должна принадлежать только одной нации. Будущее Леванта — это двунациональная социалистическая республика, где арабские феллахи и еврейские пролетарии будут обладать абсолютно равными правами, совместно управляя землей и заводами через Советы. Марокко, где этот синтез уже стал реальностью, берет на себя роль главного гаранта и идеологического архитектора этого великого союза. Все нац земли Израиля/Палестины станут национальными для Марокко. +НД «Ахуват амим»: -0,2 прироста фашизма, +10% поддержки войны, +10% защиты нац территорий."
 MOR_The_perfect_Morocco:0 "Идеальное Марокко"
 MOR_The_perfect_Morocco_desc:0 "Нам говорили, что марксизм утопичен, что арабский и еврейский народы обречены на вечную рознь, а колониальная отсталость Магриба неизлечима. Наша партия доказала обратное. Мы построили «Идеальное Марокко» — общество, где ликвидированы бедность и неграмотность, где заводы и колхозы работают как единый швейцарский хронометр, а меллахи и арабские кварталы навсегда слились в монолит пролетарского братства. Мы создали не просто сильное государство, мы создали витрину будущего для всего человечества. Наша родина — это цветущий социалистический оазис, на который с надеждой смотрят угнетенные народы всей планеты. Наш путь истинен, и наше будущее нерушимо! +25% стабильности, +25% поддержи коммунизма, +200 полит власти, в каждом стейте Великого Марокко принадлежащим вам будет добавлено по 1 уровню инфраструктуры и по 1 фабрике. Аналогично со стейтами Израиля. paragraphs scanned: 1811 DOCX-END"
 MOR_Ties_with_world_zionist_movements:0 "Связи с мировыми сионистскими движениями"
 MOR_Ties_with_world_zionist_movements_desc:0 "Ядро нашей партии знает, что трагедия еврейского народа в Европе, страдающего от фашистского и буржуазного антисемитизма, может быть решена только через призму классовой солидарности. Мы должны установить прочные рабочие контакты с мировыми сионистскими движениями. Организации вроде «Поалей Цион», «Ха-Шомер ха-Цаир», «Друзья СССР» и прогрессивные рабочие кибуцы в Палестине видят будущее Ближнего Востока так же, как и мы — свободным от британских колонизаторов, арабских феодалов и правых еврейских капиталистов. Мы откроем в Касабланке координационные центры, предоставим им финансовые каналы наших национализированных банков и поможем организовать тайный транзит людей и снаряжения. Марокко станет надежным тылом для левого крыла еврейского национального движения. Будет открыта категория решений «Возможности мирового сионизма» (Лишённые собственного дома, евреи разошлись по всему миру. Мы можем пользоваться этими плодами, привлекая рабочих, семьи беженцев, солдат, еврейский капитал и другие блага на пользу нашей стране.) 1."
 MOR_Devalue_the_Moroccan_franc:0 "Девальвировать Марокканский франк"
 MOR_Devalue_the_Moroccan_franc_desc:0 "Привязка нашей валюты к колеблющемуся французскому франку ограничивает наш суверенитет и связывает руки марокканской промышленности. Намеренно обесценив марокканский франк, мы сделаем наше сырье — мавританское железо, резину и консервы — невероятно дешевыми и привлекательными на мировом рынке. Да, это вызовет недовольство населения, но приток иностранного капитала и загрузка наших заводов экспортными заказами с лихвой окупят эти временные трудности. +2 фабрика, -10% влияния генерал-резидента, +временный НД «Девальвация Марокканского франка» на 420 дней: -10% ФНП, +20% ресурсов на продажу, -5% стабильности."
 MOR_Modernization_of_the_camps_in_Fes:0 "Модернизация лагерей в Фесе"
 MOR_Modernization_of_the_camps_in_Fes_desc:0 "Экономика, заводы и банки — это прочный фундамент, но без сильной армии наше богатство станет лишь легкой добычей для врага. Старые военные лагеря в Фесе веками служили местом сбора воинов Султаната, но их инфраструктура безнадежно устарела. Мы проведем полную модернизацию этих стратегических объектов. Вместо тесных казарм будут возведены современные тренировочные комплексы, оснащенные радиосвязью, тактическими классами и стрельбищами. Здесь мы выкуем дисциплинированную, профессиональную и преданную Марокко армию, готовую к вызовам современной войны +20 опыта, НД «Марокканская армия» получит: +5% получения опыта, +10 максимума командного ресурса"
 MOR_Build_the_Kasba_Tadla_dam:0 "Построить плотину Касба-Тадла"
 MOR_Build_the_Kasba_Tadla_dam_desc:0 "Река Умм-эр-Рбия обладает колоссальным гидроэнергетическим потенциалом, который до сих пор оставался неиспользованным. Возведя монументальную плотину и гидроэлектростанцию в районе Касба-Тадла, мы решим сразу две важнейшие проблемы Марокканского государства. Мы дадим Касабланке и Фесу дешевое электричество для выплавки мавританской руды и одновременно оросим бесплодные равнины Тадла, навсегда обезопасив страну от голода и засухи. В стейте 462 будет построена плотина, а также усиленная энергосеть и высокая энергосеть. НД «Аграрная страна» получит: Ежемесячный прирост населения -10%, военнообязанное население +0,1%, -1% ФНП, скорость строительства +1%, +1% макс. эффективности производства"
 MOR_Construction_of_the_southern_railway:0 "Строительство Южной железной дороги"
 MOR_Construction_of_the_southern_railway_desc:0 "Наши новые сельскохозяйственные секторы и шахты на юге задыхаются без логистики. Гужевой транспорт и разбитые грунтовые дороги не способны справиться с миллионами тонн грузов, которые производит возрождающееся Марокко. Строительство Южной железной дороги свяжет внутренние районы Атласа и Марракеша с портами побережья. Этот амбициозный проект потребует колоссальных усилий, стали и бетона, но результат превзойдет все ожидания. Мы не только ускорим вывоз ресурсов и снабжение южных рубежей, но и намертво свяжем отдаленные племена с султанским престолом единой стальной нитью. Будет пущена жд по провкам 7069-10023-4139-4108. Так же от 11943 до 4139. В 4108 так же будет создан узел снабжения. НД «Аграрная страна» получит: Ежемесячный прирост населения -10%, военнообязанное население +0,1%, -1% ФНП, скорость строительства +1%, +1% макс. эффективности производства"
 MOR_Launch_the_public_works_service_program:0 "Запуск программы «Службы общественного труда»"
 MOR_Launch_the_public_works_service_program_desc:0 "Мировой экономический кризис и зарождающаяся в Европе война больно ударили по Марокко. На улицах наших городов скапливаются тысячи молодых, безработных и озлобленных людей, готовых поддаться на радикальную пропаганду. Мы направим эту стихийную энергию во благо Султаната. Запуская программу 'Службы общественного труда', государство берёт на себя обязательство дать работу каждому нуждающемуся. Мы сформируем из безработных трудовые отряды. Под руководством наших инженеров они займутся возведением дамб, прокладкой дорог, расширением портов Касабланки и Сафи, а также строительством приграничных укреплений. Дисциплина в этих отрядах будет железной, почти армейской. Так мы не только спасем экономику, но и получим миллионы рабочих рук, привыкших к строю и приказам. + НД «Служба общественного труда»: скорость строительства +10% НД «Аграрная страна» получит: Ежемесячный прирост населения -10%, военнообязанное население +0,1%, -1% ФНП, скорость строительства +1%, +1% макс. эффективности производства"
 MOR_Continue_relying_on_tribal_troops:0 "Продолжить опираться на племенные войска"
 MOR_Continue_relying_on_tribal_troops_desc:0 "Сила Марокко в его племенах. Гумовые таборы и верблюжьи отряды дешевле, мобильнее и куда надёжнее в горах, чем вымуштрованные батальоны."
 MOR_Abandon_irregular_formations:0 "Отказаться от иррегулярных формирований"
 MOR_Abandon_irregular_formations_desc:0 "Французские советники настаивают на жесткой централизации и формировании армии по европейским лекалам. Но они забывают, что истинная сила Марокко всегда крылась в преданности племен своему Султану. Каиды и старейшины Атласа готовы выставить тысячи преданных бойцов, если мы проявим уважение к их автономии и традициям. Опираясь на племенные войска, мы получим неиссякаемый источник мотивированных воинов, готовых защищать каждый бархан и каждое ущелье нашей родины без оглядки на сложные логистические цепочки НД «Марокканская армия» получит: +5% защиты и атаки на нац территориях. При призыве ополчения будет дополнительно призываться 2 верблюжих дивизий по 6 батальонов."
 MOR_Strip_Tangier_of_its_international_status:0 "Лишить Танжер международного статуса"
 MOR_Strip_Tangier_of_its_international_status_desc:0 "Танжер долго оставался гнездом иностранных шпионов, контрабандистов и спекулянтов, существующих вне марокканских законов. Конвенция 1923 года превратила наш великий порт в инструмент европейского диктата, лишив нас контроля над воротами в Средиземное море. Но эпоха компромиссов подошла к концу. Мы не потерпим чужих флагов и международных комитетов на нашей суверенной земле. Настало время расторгнуть навязанные договоры, упразднить администрацию колонизаторов и вернуть Танжер в лоно единого Марокко. Стейт 1042 станет национальным."
 MOR_Mauritania_a_southern_province_of_Morocco:0 "Мавритания – южная провинция Марокко"
 MOR_Mauritania_a_southern_province_of_Morocco_desc:0 "Границы, начертанные европейскими колонизаторами — это искусственные шрамы на теле нашей родины. Земли Мавритании исторически признавали верховную власть марокканских султанов, а местное население связано с нами неразрывными узами веры, культуры и общей судьбы. Она — законная южная провинция Марокканского государства, и сегодня, мы официально это закрепим. Стейты 1068, 1017, 557 станут национальными."
 MOR_Deprive_the_Caliph_of_power:0 "Лишить власти халифа"
 MOR_Deprive_the_Caliph_of_power_desc:0 "Халиф, поставленный править Северным Марокко от имени султана, полностью провалился, игнорируя султана и полностью подчиняясь Исанскому командованию. Его надлежит лишить поста, а управление регионом взять под свой прямой контроль. Стейты 1015, 699, 290 и 1066 станут национальными."
 MOR_Franco_Berber_schools:0 "Франко-берберские школы"
 MOR_Franco_Berber_schools_desc:0 "Образовательная политика, унаследованная от Франции, предлагает нам эффективный, хоть и опасный инструмент модернизации. Развивая сеть франко-берберских школ в Атласских горах и на юге, мы обучаем коренное население европейским наукам, техническим специальностям и французскому языку в обход традиционных исламских институтов. Это позволит нам воспитать новое поколение лояльных инженеров, чиновников и офицеров. Однако арабское городское население и религиозные авторитеты видят в этом прямую угрозу единству нации. +10% влияния генерал-резидента, -5% стабильности, НД «Необразованное население» получит +5% к темпам изучения. +НД «Траты на образования»: +10% ФНП и -10% прироста полит власти на 180 дней."
 MOR_Support_the_free_schools_project:0 "Поддержать проект «свободных школ»"
 MOR_Support_the_free_schools_project_desc:0 "В ответ на попытки колонизаторов разделить наш народ, патриоты и меценаты создают по всей стране 'свободные школы'. Поддержав этот проект на государственном уровне, мы нанесем удар по французскому культурному влиянию. Эти школы объединят арабских и берберских детей под знаменем единой веры, языка и верности Султану. Мы укрепим внутреннее единство и поднимем патриотический дух, доказав, что Марокко способно модернизироваться, сохраняя свою идентичность. +10% влияния султана, НД «Необразованное население» получит +2,5% к темпам изучения. +НД «Траты на образования»: +10% ФНП и -10% прироста полит власти на 180 дней."
 MOR_Development_of_the_canning_industry:0 "Развитие консервной промышленности"
 MOR_Development_of_the_canning_industry_desc:0 "Сытая армия — это победоносная армия, а процветающая экономика — та, что экспортирует готовый продукт, а не дешевое сырье. Наши прибрежные воды в Сафи и Агадире кишат рыбой, а модернизированные секторы сельской местности производят тонны мяса, овощей и фруктов. Однако без должной переработки большая часть этого богатства пропадает зря. Строительство современных консервных заводов и жестяно-прокатных цехов решит эту проблему. Мы превратим Марокко в главного поставщика мясных и рыбных рационов в Средиземноморье. Закатанные в жесть припасы смогут годами храниться на армейских складах, гарантируя, что наши солдаты никогда не останутся без провианта в грядущих походах. +2 фабрики в стейте 806, НД «Результаты службы общественного труда»: -10% потери от истощения, +24 часа до истощения. НД «Аграрная страна» получит: Ежемесячный прирост населения -10%, военнообязанное население +0,1%, -1% ФНП, скорость строительства +1%, +1% макс. эффективности производства"
 MOR_Modernization_of_the_phosphate_conveyors:0 "Модернизация фосфатных конвейеров"
 MOR_Modernization_of_the_phosphate_conveyors_desc:0 "Марокканская земля скрывает в себе величайшее сокровище — три четверти мировых запасов фосфатов. Однако до сегодняшнего дня на шахтах Хурибги и в портах погрузки преобладал тяжелый, неэффективный ручной труд, а транспортировка велась вагонетками. Чтобы улучшить добычу, мы заменим тысячи кирок на механические экскаваторы, внедрим электрические дробильные установки и запустим километры автоматизированных конвейерных лент. Модернизация фосфатных конвейеров увеличит добычу в разы. +1 фабрика в стейте 461, 2х 100% к темпам изучения технологи1 производства, +10 хрома и стали в стейте 461 НД «Аграрная страна» получит: Ежемесячный прирост населения -10%, военнообязанное население +0,1%, -1% ФНП, скорость строительства +1%, +1% макс. эффективности производства"
 MOR_Reforming_the_Moroccan_Rifles:0 "Реформирование Марокканских стрелков"
 MOR_Reforming_the_Moroccan_Rifles_desc:0 "Век романтических войн и племенных набегов ушел в прошлое. Современная тотальная война выигрывается не индивидуальной отвагой, а дисциплиной, плотностью огня и четкой координацией родов войск. Наши полки тиральеров должны быть полностью реорганизованы. Мы внедрим жесткие европейские уставы, стандартизируем стрелковое оружие за счет мощностей Касабланкского арсенала и начнем насыщение частей батальонной артиллерией и радиосвязью. Марокканский стрелок станет образцовым солдатом регулярной армии, способным на равных противостоять лучшим дивизиям великих держав. В столице будет получена 1 дивка на 6 касок 4 уровня опыта, +15 опыта, НД «Марокканская армия» получит: Снижение времени подготовки пехотных дивизий на 25%"
 MOR_Create_the_goum_auxiliary_institute:0 "Создать институт гумов вспомогательной службы"
 MOR_Create_the_goum_auxiliary_institute_desc:0 "Регулярные дивизии хороши на равнинах, но в суровых ущельях Атласа и Рифа обычная тактика бессильна. Наш истинный щит — это воинственные племена берберов, чьи предки веками защищали эти земли. Создавая официальный институт гумов вспомогательной службы, мы упорядочим призыв и снабжение горцев. Мы не станем лишать их вековых традиций и уникальных навыков следопытов, но дадим им современное оружие и четкую координацию. Пусть их традиционные кинжалы-кумми и наши новые винтовки станут кошмаром для любого, кто рискнет зайти в наши горы Все призванные ополченцы получат по доп роте обеспечения и разведки"
 MOR_Deployment_of_the_1st_and_3rd_Moroccan_divisions:0 "Развертывание 1-й и 3-й Марокканских пехотных дивизий"
 MOR_Deployment_of_the_1st_and_3rd_Moroccan_divisions_desc:0 "Новые 1-я и 3-я Марокканские пехотные дивизии станут элитными соединениями французской Свободной армии, сформированными преимущественно из марокканских стрелков – тиральеров, и горных гумьеров. Развертывание этих дивизий — это переход Марокко к созданию кадровых, отлично подготовленных регулярных соединений. +20 влияния генерал-резидента, + 2 дивки по 3 каски горняков, 6 касок пехоты, 1 батальон артиллерии, и поддержка разведки, сапёрной роты 4го уровня опыта. Они получат названия: 1-я Марокканская пехотная дивизия (1ère Division d'Infanterie Marocaine) и 3-я Марокканская пехотная дивизия (3ème Division d'Infanterie Marocaine)."
 MOR_Longer_term_of_service:0 "Увеличение срока службы"
 MOR_Longer_term_of_service_desc:0 "Мир неудержимо катится в бездну новой тотальной войны, и Марокко не сможет остаться в стороне. Чтобы защитить наши границы от посягательств и доказать свою ценность на полях сражений, нам нужно больше, чем просто новобранцы. Увеличивая срок обязательной военной службы, мы превратим вчерашних крестьян в профессиональных солдат. Страна получит армию, способную выдержать затяжной конфликт. +НД «Армейские реформы»: +1% военнообязанного населения."
 MOR_Recruit_elite_soldiers_into_the_guard:0 "Набрать элитных солдат в гвардию"
 MOR_Recruit_elite_soldiers_into_the_guard_desc:0 "Суверенитет Марокко должны охранять лучшие из лучших. Из тысяч новобранцев, прошедших суровое обучение в лагерях Феса и закаленных переходами в Атласе, мы отберем самых стойких, верных и бесстрашных воинов. Они сформируют обновленную национальную гвардию. Эти солдаты получат лучшее оружие мастерских Рабата, безупречное гвардейское обеспечение и будут принесены к личной присяге на верность Султану и Родине. Гвардия станет не просто парадным украшением дворца — она будет стальным щитом Махзена, готовым в любой момент подавить племенной мятеж или возглавить штурм ключевых позиций врага. Там, где дрогнет обычный солдат, гвардеец сделает шаг вперед и победит +25 опыта армии, в столице заспавнится 1 верблюжья дивка из шести касок с конеразведкой пятого уровня"
 MOR_Regular_troops_from_tribal_soldiers:0 "Регулярные войска из племенных солдат"
 MOR_Regular_troops_from_tribal_soldiers_desc:0 "Ликвидация племенных ополчений не означает, что мы должны отказаться от воинского духа наших братьев из гор Риф и песков Сахары. Берберы и туареги веками считались одними из лучших воинов мира: они способны совершать марш-броски по удушающей жаре, выживать без воды, прекрасно ориентируются на местности и бьют без промаха. Мы не уволим их со службы — мы превратим их в элиту наших регулярных войск. Направив вчерашних племенных бойцов в модернизированные лагеря Феса, мы обучим их тактике современного боя, радиосвязи и взаимодействию с артиллерией. Сохранив их врожденную стойкость и насадив жесткую армейскую дисциплину, мы получим уникальные регулярные полки, способные стать непреодолимой преградой для любого европейского агрессора в горах и пустынях +НД «Набор регуляров из пламенных солдат»: +2,5% военнообязанного населения."
 MOR_Free_port_of_Tangier:0 "Свободный порт Танжера"
 MOR_Free_port_of_Tangier_desc:0 "Уникальное географическое положение Танжера — слишком ценный актив, чтобы просто растворить его в общей экономической системе страны. Танжер привык быть перекрестком мировых торговых путей, финансовым хабом и раем для свободного предпринимательства. Мы провозглашаем Танжер свободной экономической зоной и открытым портом. Сохранив льготный налоговый режим, упростив таможенные пошлины для иностранных судов и снизив ограничения на движение капитала, мы превратим Танжер в главные морские ворота Африки. +4 уровня морской базы в регионе Танжера, +НД «Свободный порт Танжера»: Скорость строительства верфей +10%, влияние на торговлю +15%, -5% ФНП"
 MOR_Tangier_capital_of_espionage:0 "Танжер — столица шпионажа"
 MOR_Tangier_capital_of_espionage_desc:0 "Годы пребывания под международным контролем превратили Танжер в уникальное, но опасное место. Из-за отсутствия жёстких законов, обилия иностранных банков и дипломатических миссий, город стал настоящим гнездом для тайных агентов со всего света. Вместо того чтобы пытаться выжечь это подполье, Марокко должно обратить его себе на пользу. Мы внедрим наших собственных агентов в эту паутину слухов, создадим сеть подставных информаторов и возьмем под негласный контроль Танжерский черный рынок информации. Позволив великим державам шпионить друг за другом на нашей территории, мы не только узнаем их главные тайны, но и превратим Танжер в теневой щит нашей национальной безопасности +НД «Столица шпионажа»: +1 ячейка оперативника, скорость сбора информации вражеским агентом -15%, контрразведка +1."
 MOR_Trans_saharan_railway_Fes_Nouakchott:0 "Транссахарская железная дорога: Фес — Нуакшот"
 MOR_Trans_saharan_railway_Fes_Nouakchott_desc:0 "Веками Сахара была непреодолимым барьером, разделявшим Магриб и Черную Африку. Караванные пути, шедшие через пески неделями, ушли в прошлое, но полноценной замены им так и не появилось. Если Марокко хочет стать настоящим экономическим и геополитическим лидером региона, мы должны бросить вызов самой пустыне. Стальные магистрали свяжут древнюю столицу Фес, пройдут через пески и дойдут до самого Нуакшота, открывая нам прямой выход к портам и рынкам Западной Африки. Этот мегапроект потребует колоссального напряжения сил, закупки тысяч тонн рельсов и привлечения сотен иностранных инженеров. Но когда первый состав прибудет в Нуакшот, Марокко навсегда кует свой статус главных ворот и экономического мотора всего африканского континента! Будет проложена железная дорога из провинции 11987 до 5034. В 5034 так же будет создан узел снабжения."
 MOR_Mauritanian_acacia_and_gum_arabic:0 "Мавританские Акажу и Гуммиарабик"
 MOR_Mauritanian_acacia_and_gum_arabic_desc:0 "Мавритания и пограничные регионы Сахеля скрывают в себе колоссальные объемы ценнейшего сырья: плантации деревьев акажу, дающих редкое красное дерево, и бескрайние леса сенегальской акации — главного мирового источника гуммиарабика. Эта смола критически необходима развивающейся химической, текстильной и фармацевтической промышленности по всему миру. Мы выстроим жесткую государственную монополию на экспорт этих уникальных ресурсов. Великие державы будут вынуждены платить золотом марокканским компаниям, чтобы обеспечить работу своих фабрик! +32 резины в стейте 557"
 MOR_Recruit_spanish_regulares_into_the_army:0 "Набрать испанских регулярисов в армию"
 MOR_Recruit_spanish_regulares_into_the_army_desc:0 "Самой грозной и дисциплинированной силой колониальной эпохи были Регулярес — элитные тактические подразделения, набранные из числа коренных марокканцев и берберов Эль-Рифа под командованием испанских офицеров. Эти бойцы прошли через огонь Гражданской войны в Испании, заслужив репутацию бесстрашных штурмовиков и непревзойденных мастеров ближнего боя. С обретением независимости тысячи этих закаленных ветеранов остались не у дел. Мы объявим о масштабной амнистии и наборе бывших регулярисов в наши части, сохранив их уникальную структуру, знаки отличия и тактические наработки, но теперь они будут присягать на верность не Мадриду, а своему суверенному государству. 2х -50% стоимости сухопутной доктрины, +НД «Набор регулярис»: Военнообязанное население +1%, прирост опыта для армии +0,2 еженедельно, прорыв дивизий +10%. Будет получен фельдмаршал: Мохамед Мезиан (Mohamed Meziane) (уровень 3, 3 атаки, 2 обороны, 2 логистики, 3 планирования) трейты: строгий лидер, авантюрист, блестящий стратег. Так же он будет доступен как высшее военное командование на атаку +10%, Так же он будет доступен как теоретик доктрины массированного штурма."
 MOR_Subdue_the_Riff_tribes:0 "Подчинить власти Рифские племена"
 MOR_Subdue_the_Riff_tribes_desc:0 "Горы Рифа на севере страны веками были оплотом непокорности и свободы. Гордые берберские племена под знаменами Абд аль-Крима нанесли сокрушительные поражения испанским и французским армиям вовремя Рифской войны, доказав свою невероятную стойкость. Но теперь, когда Марокко стало единым и независимым государством, паши и вожди племен Рифа отказываются платить налоги центральному правительству, живя по собственным племенным законам и держа под ружьем тысячи верных лично им бойцов. Мы не можем строить централизованное государство, пока целая провинция подчиняется лишь воле своих старейшин. Нам придётся подчинить их. -10% стабильности, -2000 населения в стейте 290, в этом стейте появится 2 дивизии горняков по 6 касок с 3 уровнем опыта."
 MOR_Create_colleges_for_women:0 "Создать колледжи для женщин"
 MOR_Create_colleges_for_women_desc:0 "Модернизация Марокко не может быть полной, пока половина нашего населения отрезана от грамотности и общественной жизни. Открытие специализированных женских колледжей позволит подготовить тысячи квалифицированных учительниц, акушерок, медсестер и административных работников. Давая женщинам доступ к высшему знанию, мы не только наносим удар по вековой отсталости, но и высвобождаем колоссальный трудовой ресурс, способный заменить мужчин на фабриках и в госпиталях, когда Родина призовет их на фронт. Однако, не всем консервативным кругам может это понравиться. -5% стабильности, +НД «Женское образование» +5% к темпам изучения. +НД «Траты на образования»: +10% ФНП и -10% прироста полит власти на 180 дней."
 MOR_French_endowments_for_the_fellahin:0 "Французские дотации для феллахов"
 MOR_French_endowments_for_the_fellahin_desc:0 "Договор в Фесе 1912 года лишил наш Султанат независимости, но сохранил институты власти и махзен. Сейчас, когда Париж ищет стабильности в Северной Африке перед лицом надвигающейся европейской катастрофы, французская администрация готова выделить колоссальные франки на субсидирование марокканских крестьян — феллахов. Протекторат хочет умиротворить деревню и выкачать больше продовольствия. Мы примем эти субсидии. Пусть французские колонизаторы строят за свой счёт дамбы, закупают тракторы и улучшают наши земли. Модернизировав сельское хозяйство руками Парижа, мы накормим марокканский народ и заложим фундамент для будущей независимости нашей Родины. +5% стабильности, +20% вливания генерал-резидента, -100 очков автономии, +Временный НД «Французский Фонд Солидарности» (Администрация генерал-резидента ввела чрезвычайный налог на сверхприбыли крупных европейских компаний для закупки зерна. Были отменены пошлины на ввоз пшеницы из Алжира и Франции. В пострадавших регионах французы открыли пункты бесплатной раздачи супа и зерна, чтобы остановить голодные марши на Касабланку."
 MOR_Start_the_El_Kansera_hydro_plant:0 "Запуск ГЭС Эль-Кансера"
 MOR_Start_the_El_Kansera_hydro_plant_desc:0 "Французские инженеры возвели величественную плотину Эль-Кансера на реке Бехт, преследуя лишь собственные интересы — ирригацию земель европейских колонов в долине Рарб. Но потенциал этой гигантской бетонной стены гораздо выше. Установив у её основания мощные гидротурбины и завершив прокладку высоковольтных линий, мы вдохнем жизнь в энергетическую систему Марокко. Запуск ГЭС Эль-Кансера не только обеспечит стабильным током наши новые консервные заводы в Касабланке и портовые доки, но и позволит регулировать паводки, навсегда застраховав модернизированные поля феллахов от разрушительных наводнений. Электричество — это кровь современной индустрии, и теперь этот ресурс принадлежит Махзену. +1 фабрика в стейте 461, также усиленная энергосеть и высокая энергосеть, НД «Результаты службы общественного труда»: +5% максимальной эффективности производства. НД «Аграрная страна» получит: Ежемесячный прирост населения -10%, военнообязанное население +0,1%, -1% ФНП, скорость строительства +1%, +1% макс. эффективности производства"
 MOR_Shift_mining_to_war_production:0 "Перевести добычу на военные рельсы"
 MOR_Shift_mining_to_war_production_desc:0 "В связи с военным положением, будет введен жесткий контроль над экспортом стратегического сырья. Весь объем добычи теперь принудительно станет направляться на металлургические заводы для производства стали. Перевести всю экономику на военные рельсы. Для продуктов будет введена карточная система: жесткое нормирование и купоны на базовые товары: сахар, чай, ткани, горючее и мыло. Будут введены суровые наказания за спекуляцию и жёсткие ограничения на вывоз валюты и золота из протектората, чтобы предотвратить панику и бегство европейских капиталов. +1 военный завод в стейте 461, будет введен закон «военная экономика», +10 хрома и стали в стейте 461"
 MOR_Mobilize_the_plain_tribes:0 "Мобилизовать племена с равнин"
 MOR_Mobilize_the_plain_tribes_desc:0 "Если горы дают нам непревзойденных охотников и партизан, то бескрайние равнины Марокко — это живое сердце нашей оборонной мощи. Потенциал наших городов и равнинных племен огромен. Развернув сеть централизованных призывных пунктов, мы призовем под ружье тысячи опытных всадников. + При призыве ополчения будет дополнительно призываться 3 дивизии верблюдов по 3 каски. Если решение уже было прожато, то на время войны в столице будет призвано 3 дивизии верблюдов по 3 каски."
 MOR_Mobilization_of_the_goums:0 "Мобилизация гумов"
 MOR_Mobilization_of_the_goums_desc:0 "Час пробил. Враг у ворот, и горы Атласа больше не могут молчать. Вожди племен сдержали свое слово: по первому зову Султана тысячи бесстрашных воинов спустились с гор в призывные пункты. Нам не нужно тратить месяцы на их обучение — они умеют выживать и убивать с самого детства. Достаточно раздать им винтовки из Касабланкского арсенала и указать направление. Пусть весь мир узнает, на что способны марокканские таборы, когда защищают свою свободу При призыве ополчения будет дополнительно призываться 3 дивизии горняков по 6 касок. Если решение уже было прожато, то на время войны в столице будет призвано 3 дивизии горняков по 6 касок."
 MOR_Integration_of_the_foreign_legion_in_Fes:0 "Интеграция Иностранного легиона в гарнизон Феса"
 MOR_Integration_of_the_foreign_legion_in_Fes_desc:0 "Фес — культурное и историческое сердце Марокко, и его безопасность не может быть поставлена под угрозу. Размещенные здесь части Французского Иностранного легиона состоят из ветеранов, не знающих страха и преданных только своему приказу. Интегрируя Легион в постоянный гарнизон Феса и координируя их действия с нашими регулярными частями, мы получим не только элитную силу для обороны города, но и надежный инструмент для поддержания железной стабильности в регионе. +5000 людских ресурсов в столичный регион."
 MOR_Defense_plan_for_Moroccan_Sahara:0 "План обороны Марокканской Сахары"
 MOR_Defense_plan_for_Moroccan_Sahara_desc:0 "Бескрайние пески Сахары кажутся необитаемыми, но они представляют собой уязвимое подбрюшье нашего Султаната. Мы не можем позволить врагу обойти наши основные силы через пустыню. Создавая сеть укрепленных фортов, колодцев и мобильных пустынных патрулей, мы заставим саму природу сражаться на нашей стороне. Пусть жара и логистический кошмар истощат любого, кто осмелится посягнуть на Марокканскую Сахару. НД «Армейские реформы» получит: акклиматизация к жаре +25%. Будет получена технология войны в пустыне."
 MOR_Lessons_of_the_Atlas_mountains:0 "Уроки Атласских гор"
 MOR_Lessons_of_the_Atlas_mountains_desc:0 "Французские генералы полагаются на свои тяжелые танки, бронетранспортеры и доктрины блицкрига, рожденные на плоских равнинах Европы. Но Марокко — это не Европа. Горные хребты Атласа, изрезанные глубокими ущельями и узкими перевалами, веками хоронили чужеземные армии. Мы тщательно изучили опыт Рифской войны и восстаний в Высоком Атласе. Колонизаторы сильны, пока они держатся асфальтированных дорог и побережья. Стоит им углубиться в наши горы, как их техника превращается в груду бесполезного железа. Усвоив уроки Атласа, мы обучим наши регулярные полки тактике засад, минирования горных троп, внезапных ночных налетов и удержания господствующих высот. Если враг осмелится пойти войной на Султанат, каждый утес и каждая скала Атласа станут для него смертельной ловушкой Будет получена технология ведения войны в горах, будет получено 3 дивизии горняков по 6 касок, НД «Набор регуляров из пламенных солдат» получит: +25 дивизий спец назначения."
 MOR_Tangier_shipyard:0 "Танжерская судостроительная верфь"
 MOR_Tangier_shipyard_desc:0 "Марокко, омываемое водами Атлантики и контролирующее Гибралтарский пролив, обязано иметь собственные производственные мощности на море. Мы закладываем фундамент Танжерской судостроительной верфи. Используя льготные тарифы свободной зоны, мы привлечем лучших инженеров и судостроителей. Это предприятие станет сердцем нашей тяжелой промышленности. Здесь будут рождаться не только сухогрузы для марокканских торговых компаний, но и первые боевые корабли нашего суверенного флота. Марокко должно прочно утвердиться на морских путях. +2 верфи в стейте 1042, +50 опыта ВМС"
 MOR_Tangier_offshore_and_smuggling:0 "Танжерский офшор и контрабанда"
 MOR_Tangier_offshore_and_smuggling_desc:0 "Через пролив у Танжера каждую ночь курсируют десятки быстроходных катеров, забитых контрабандным оружием, валютой, медикаментами и дефицитным сырьем. Одновременно с этим Танжер превратился в мировую столицу офшоров, где сомнительные капиталы прячутся от налогов крупнейших держав. Официально Рабат больше не будет закрывать глаза на этот подпольный рай — мы возглавим его. Заключив негласный союз с лидерами контрабандистов и банкирами Танжера, мы обложим их теневой бизнес «патриотическим налогом». Государство получит колоссальный приток неучтенного золота, а наши вооруженные силы — доступ к передовому иностранному оружию и оборудованию в обход любых международных санкций и эмбарго. Танжерский черный рынок станет финансовым и материальным тараном нашей национальной независимости!"
 MOR_Integrate_nationalists_of_the_spanish_protectorate:0 "Интегрировать националистов из Испанского протектората в систему"
 MOR_Integrate_nationalists_of_the_spanish_protectorate_desc:0 "Игнорирование лидеров национально-освободительного движения на Севере — это долгий путь к окончательному подчинению региона. Да, Партия Марокканского Единства и Партия Национальных Реформ ведут себя обособленно и опираются на наследие испанской зоны. Но они — такие же патриоты, проливавшие кровь за независимость Марокко. Вместо того чтобы ломать их через колено, мы протянем им руку сотрудничества, пригласив в общенациональную политическую и административную систему. Абдельхалек Торрес и Мухаммад Насири получат министерские портфели и места в государственном совете. Мы признаем их заслуги, легализуем их прессу и дадим Северу представительские квоты. Абдельхалек Торрес и Мохаммед аль-Макки ан-Насири станут доступны как министры. +5% стабильности"
 MOR_Repress_members_of_the_Moroccan_Unity_Party:0 "Репрессировать членов Партии Марокканского Единства"
 MOR_Repress_members_of_the_Moroccan_Unity_Party_desc:0 "Партия Марокканского Единства – искусственная партия, созданная ещё верховным комиссаром Испании. Она должна была стать противовесом партии национальных реформ Торреса. Мекки Насыри – популист, который пытался подняться на националистической волне, он много чего говорил, но ничего не делал, полностью поддерживая курс Испанского колониального господства. Мы должны репрессировать их, до того, как они освоятся в новых реалиях. +100 полит власти, +10% популярности правящей партии, стабильность -5%."
 MOR_Restart_the_Riff_iron_mines:0 "Вернуть железные рудники Эль-Рифа к работе"
 MOR_Restart_the_Riff_iron_mines_desc:0 "Местные холмы и ущелья скрывают богатейшие залежи высококачественной железной руды, которые во время колониального правления варварски эксплуатировались испанскими кампаниями. Из-за войны за независимость и последующего саботажа племен добыча была полностью парализована, а шахты заброшены и затоплены. Марокко не сможет построить тяжелую индустрию, современные верфи и танки без собственного металла. Мы национализируем все бывшие испанские активы, откачаем воду из шахт, и направим туда государственные инвестиции. +32 стали в стейте 290, +1 фабрика в этом стейте, -15 отношения с Испанией."
 MOR_Rural_modernization_sectors:0 "Секторы модернизации сельской местности"
 MOR_Rural_modernization_sectors_desc:0 "Разрозненных субсидий и точечной медицинской помощи больше недостаточно. Чтобы превратить Марокко в современное аграрно-индустриальное государство, нам необходим системный подход. Мы учреждаем 'Секторы модернизации сельской местности' — специальные государственные кооперативы и технические станции по всей стране. В эти секторы будут стягиваться закупленные тракторы, семена высокого качества, агрономы и ветеринары. Секторы станут не просто центрами экономического роста, но и новыми опорными пунктами Султаната в провинциях. +3 ячейки, +1 фабрика, +НД «Секторы модернизации сельской местности»: +5% ФНП, +25% прироста населения."
 MOR_Sanitary_reforms:0 "Санитарные реформы"
 MOR_Sanitary_reforms_desc:0 "Ни одна нация не может ковать своё величие, пока её и скот косит тиф, малярия и трахома. Долгое время современная медицина в протекторате была роскошью, доступной лишь французским колонистам в чистых кварталах Рабата и Касабланки. Марокканские кварталы — медины — и нищие деревни феллахов брошены на произвол судьбы. По новой реформе будет создана сеть мобильных медицинских отрядов, которые будут перемещаться по Сахаре и помогать кочевым племенам берберов. Власти так же организуют принудительную бесплатную вакцинацию оставшегося скота от ящура и чумы. +5% стабильности, +2х 100% к темпам изучения полевых госпиталей +НД «Санитарные реформы»: +15% к приросту населения, +15% к строительству соц инфраструктуры, -10% к потерям от истощения."
 MOR_Create_the_State_Bank_of_Morocco:0 "Создать государственный банк Марокко"
 MOR_Create_the_State_Bank_of_Morocco_desc:0 "Истинный суверенитет куется не только на оружейных заводах, но и в банковских хранилищах. До сих пор колониальный 'Государственный банк Марокко' служил лишь инструментом выкачивания золота из нашей страны. Мы положим конец этому финансовому диктату. Махзен учреждает собственный, национальный Центральный банк в Рабате, полностью подконтрольный престолу Султана. Мы объявляем о введении национальной валюты и принудительном выкупе золотовалютных резервов у иностранных агентов. Взяв под контроль печатный станок и кредитную систему, мы сможем напрямую инвестировать в наш ОПК, выдавать дешевые займы модернизированным феллахам и полностью избавимся от остатков влияния Франции. +НД «Государственный банк Марокко»: -5% ФНП, +10% к скорости строительства. НД «Аграрная страна» получит: Ежемесячный прирост населения -10%, военнообязанное население +0,1%, -1% ФНП, скорость строительства +1%, +1% макс. эффективности производства"
 MOR_Open_war_plants_in_Meknes_and_Rabat:0 "Запустить военные заводы и мастерские в Макнесе и Ребате"
 MOR_Open_war_plants_in_Meknes_and_Rabat_desc:0 "Наличие пороха и стали бессмысленно, если у нас нет станков, способных превратить их в винтовки и патроны. Настало время сделать Мекнес и Рабат новыми кузницами марокканского оружия. В Рабате, мы откроем точные оптические и ремонтные мастерские. В Мекнесе, надежно укрытом от ударов с моря, мы развернем полноценные патронно-гильзовые заводы и линии по сборке артиллерии. Используя электроэнергию ГЭС Эль-Кансера и накопленные запасы фосфатов, эти предприятия обеспечат армию бесперебойным потоком снаряжения. Марокко больше не будет просить оружие у чужаков — мы выкуем его сами. +1 военный завод в стейте 461 и в стейте 806. НД «Аграрная страна» получит: Ежемесячный прирост населения -10%, военнообязанное население +0,1%, -1% ФНП, скорость строительства +1%, +1% макс. эффективности производства"
 MOR_Tighten_control_over_the_tribes:0 "Ужесточить контроль над племенами"
 MOR_Tighten_control_over_the_tribes_desc:0 "Старые времена племенной вольницы подошли к концу. Мы не можем позволить себе иметь государство в государстве, когда на кону стоит выживание нашей нации в этой войне. Пришло время жесткой рукой подчинить каидов закону центрального правительства. Всякое сопротивление реквизициям и призыву будет караться по законам военного времени. дивизии верблюдов по фокусу «Мобилизовать племена с равнин» увеличат количество батальонов до 8 касок дивизии горняков по фокусу «Мобилизация гумов» увеличат количество батальонов до 10 касок."
 MOR_Train_local_officers_the_french_way:0 "Обучение местных офицеров французской школе"
 MOR_Train_local_officers_the_french_way_desc:0 "Храбрость марокканского солдата бесспорна, но без грамотного руководства она будет растрачена впустую. Мы больше не можем полагаться исключительно на присылаемых из Парижа командиров. Нашим войскам нужны собственные лидеры, говорящие с ними на одном языке. Открывая военные училища под руководством лучших французских инструкторов, мы обучим местную элиту передовой тактике, штабному планированию и искусству маневренной войны. Эти молодые офицеры станут хребтом новой, современной марокканской армии +1 уровень опыта всех генералов, полученных по фокусу «Поставить марроканцев на часть генеральских должностей», х2 -50% стоимости сухопутных доктрин, +25 опыта армии."
 MOR_Fortify_the_Taza_pass:0 "Фортификация прохода Таза"
 MOR_Fortify_the_Taza_pass_desc:0 "Проход Таза — это ключ к сердцу Марокко. На протяжении веков завоеватели использовали это ущелье, чтобы сокрушать наши династии. Век тотальной войны требует современных решений: мы превратим эти скалы в стену из бетона и стали. Артиллерийские капониры, пулеметные гнезда в скалах и противотанковые надолбы заблокируют проход. Любая вражеская армия, которая попытается прорваться к Фесу с востока, будет обескровлена и уничтожена в этих теснинах. +5 уровень укреплений в провке 7958"
 MOR_Appoint_moroccans_as_generals:0 "Поставить марокканцев на часть генеральских должностей"
 MOR_Appoint_moroccans_as_generals_desc:0 "Согласно Договору в Фесе, Франция обязалась обучать марокканцев и развивать наши институты власти, но на деле узурпировала все военные посты. Ссылаясь на нехватку европейских кадров из-за бушующей войны и отмечая феноменальную грамотность наших выпускников из лагерей Феса, мы потребуем от Генерального резидента передать часть генеральских и штабных должностей марокканцам. Париж будет вынужден пойти на уступки, чтобы сохранить стабильность в тылу. Посадив наших людей в кресла начальников снабжения, командиров бригад и штабных аналитиков, мы получим легальный доступ к французским шифрам, планам обороны и военным складам, продолжая скрытно ковать ядро будущей независимой армии. НД «Марокканская армия» получит: +5% получения опыта, +10 максимума командного ресурса, +0,5 прироста автономии, +0,1 прироста влияния султана. Ассу Убасслам (Assou Oubasslam) (уровень 3, 2 атаки, 3 обороны, 2 логистики, 2 планирования) трейты: Опытный партизан, мастер засад, упрямый защитник. Так же будет доступен как военный министр: Маскировка (эксперт) Дрис Бен Омар Эль Алами (Driss Ben Omar El Alami) (уровень 1, 2 атаки, 1 обороны, 1 логистики, 2 планирования) трейты: Лис пустыни."
 MOR_Proclaim_Greater_Morocco:0 "Провозгласить Великое Марокко"
 MOR_Proclaim_Greater_Morocco_desc:0 "От берегов Средиземного моря до бескрайних песков Сахары, от Атлантического океана до самой реки Сенегал — разорванные части нашей родины вновь объединены под единым знаменем. Границы колонизаторов навсегда стерты с карты мира, а те, кто сомневался в нашей силе, теперь вынуждены считаться с нашей волей. Султан Мухаммед V (или лидер нации) провозглашает рождение Империи Великого Марокко. Наше великое прошлое возрождено, и наступает новая эпоха нашего доминирования. Африка и весь мир видят пробуждение нового исполина! Страна сменит название на Великий Султанат Марокко. Если был выполнен фокус «Принять титул короля», то на Великое Королевство Марокко. Будет установлено правило: можно создавать альянсы. Франция и Испания теряют претензии на эти стейты. Популярность правящей идеологии +20%, +НД «Возрождённая империя»: Фактор военнообязанного населения +5%, прирост командного ресурса: +0.10 в день, организация дивизий: +10%, лимит капитуляции: +15%"
 MOR_Secure_support_of_the_mufti_of_Jerusalem:0 "Заручиться поддержкой муфтия Иерусалима"
 MOR_Secure_support_of_the_mufti_of_Jerusalem_desc:0 "Борьба за возрождение былого величия Марокко не должны ограничиваться рамками Магриба. Великий муфтий Иерусалима, Амин аль-Хусейни, является ключевой, хоть и крайне спорной фигурой всего исламского и арабского мира. Изгнанный британцами, он ищет союзников, готовых бросить вызов колониальным империям Запада. Воспользовавшись связями с ближневосточными националистами, мы отправим секретную миссию к муфтию, предложив ему политическое убежище и дипломатическое прикрытие, взамен Амин аль-Хусейни использует свой колоссальный авторитет, чтобы объявить действия Марокко священной борьбой за освобождение исламских земель. Его фетвы мобилизуют мусульманские добровольческие батальоны со всего Ближнего Востока под наши знамена. Марокко станет легитимным лидером панисламского сопротивления! Поддержка правящей партии +5% Если Амин аль-Хусейни (Amin al-Husseini) во главе BPL, то обе страны получат модификатор отношений «Общий курс на освобождение арабов» +50 отношений Палестины к Марокко и наоборот. Если Амин аль-Хусейни (Amin al-Husseini) НЕ возглавляет BPL, то будет создан ДУБЛЬ персонажа (т.е."
 MOR_Utilize_the_Fityan_movement:0 "Использовать движение «Фитьян»"
 MOR_Utilize_the_Fityan_movement_desc:0 "Новое Марокко нуждается в надежной опоре, способной защитить завоевания султаната от внутренних и внешних угроз. Старые колониальные институты мертвы, а нынешние слишком неповоротливы. Партия Национальных Реформ готова взяться за воспитание нового поколение граждан, свободных от предрассудков прошлого. Мы официально объявляем о создании движения «Фитьян». Эта массовая молодежная организация объединит под своим крылом школьников и студентов со всей страны. Движение станет не просто школой патриотизма и гражданского долга, но и кузницей кадров для нового государственного аппарата. Сочетая спортивную, дисциплинарную и политическую подготовку, мы взрастим монолитный авангард нации. Станет доступен новый министр Мухаммад Дауд (Muhammed Daoud) +НД «Фитьян»: +1% военнообязанного населения, +10% поддержка войны, +50% к скорости подготовки дивизий, +25% к скорости мобилизации. _____________________________________________________________________________ ОБЩАЯ ГВ ВЕТКА КОММУНИЗМА"
 MOR_Break_the_National_Reform_Party:0 "Лишить влияния партию Национальных Реформ"
 MOR_Break_the_National_Reform_Party_desc:0 "Партия Национальных Реформ, ведомая Абдельхалеком Торресом, долгие годы пользовалась огромным авторитетом на севере страны, в бывшей испанской зоне протектората. Опираясь на свою популярную газету «Аль-Хуррия» и старые связи с испанскими кругами, Торрес сколотил мощную региональную силу. Но теперь, когда Марокко восстановило единство, попытки Торреса подражать Испанской фаланге выглядят излишне. Нельзя допустить, чтобы молодое подобие фалангистов направило ружья против нас. +100 полит власти, -10% популярности фашизма, -5% стабильность."
 MOR_Develop_the_industry_of_the_north:0 "Развить промышленность севера"
 MOR_Develop_the_industry_of_the_north_desc:0 "Рудники Эль-Рифа снова дают стране ценнейшую сталь, но мы не должны превращать северный регион в банальный сырьевой придаток. Долгие годы колониальные власти сознательно сдерживали развитие Севера, оставляя города Рифа без электричества, дорог и современных предприятий. Пора разорвать этот порочный круг. Государство запускает масштабную программу индустриализации северных провинций. Мы построим современные металлообрабатывающие заводы в Тетуане, ткацкие фабрики в Аль-Хосейме и пищевые комбинаты вдоль побережья. Новые рабочие места займут вчерашние повстанцы и горцы: честный труд и стабильный заработок станут лучшим лекарством против сепаратизма. В стейте 290: +1 военный завод, +2 фабрики, +2 уровня инфраструктуры,"
 MOR_Boost_heavy_industry:0 "Дать толчок тяжёлой промышленности"
 MOR_Boost_heavy_industry_desc:0 "Современная война требует танков, автомобилей, тяжелых орудий и сотен тысяч артиллерийских снарядов. Мы больше не можем зависеть от импорта промышленного оборудования. Опираясь на финансовую мощь нашего нового Государственного банка, неисчерпаемые запасы фосфатов Хурибги и чистую энергию Эль-Кансеры, мы заложим основу марокканской тяжелой индустрии. Строительство металлургических комбинатов в Касабланке и химических заводов по производству азотных соединений в Сафи навсегда избавит нас от клейма 'аграрной колонии'. Марокко должно научиться плавить собственный металл. Только так мы сможем защитить свой суверенитет в эпоху стальных машин и тотальной войны. +2 военных завода и 1 фабрика. НД «Аграрная страна» получит: Ежемесячный прирост населения -10%, военнообязанное население +0,1%, -1% ФНП, скорость строительства +1%, +1% макс. эффективности производства"
 MOR_Compulsory_primary_education:0 "Обязательное начальное образование"
 MOR_Compulsory_primary_education_desc:0 "Сила государства измеряется не только тоннами выплавленной стали, но и грамотностью его граждан. Долгие годы протекторат намеренно держал марокканский народ во тьме невежества, лишая нас доступа к современным знаниям. Пора разорвать этот круг. Мы объявляем о введении всеобщего обязательного начального образования для всех детей Султаната. На базе новых сельских секторов и городских мастерских мы откроем сеть начальных школ. Обучение будет вестись на арабском языке с упором на точные науки, историю нашей великой Родины и базовые технические дисциплины. Ликвидировав неграмотность, мы вырастим новое поколение марокканцев — квалифицированных рабочих, грамотных офицеров и преданных граждан, готовых вести страну к процветанию и свободе. НД «Необразованное население» получит +7,5% к темпам изучения. +НД «Траты на образования»: +10% ФНП и -10% прироста полит власти на 180 дней."
 MOR_Unified_curriculum_and_evening_schools:0 "Единая учебная программа и вечерние школы"
 MOR_Unified_curriculum_and_evening_schools_desc:0 "Марокканское образование долгое время было расколото: французские лицеи готовили лояльных колонизаторам чиновников, а традиционные медресе давали лишь религиозные знания, оторванные от вызовов XX века. Мы создадим Единую государственную учебную программу. Она объединит исламские ценности, точные науки и передовую техническую мысль, выкинув из учебников французскую пропаганду. Однако мы не можем ждать, пока вырастут наши дети. Тысячам взрослых рабочих на консервных фабриках, фосфатных конвейерах и оружейных заводах Мекнеса грамотность нужна уже сегодня. Открывая сеть бесплатных Вечерних школ, мы даем шанс каждому взрослому марокканцу освоить черчение, математику и чтение. Грамотный рабочий у станка — это удвоенная скорость производства снарядов для нашей свободы. НД «Необразованное население» получит +7,5% к темпам изучения. +НД «Траты на образования»: +10% ФНП и -10% прироста полит власти на 180 дней."
 MOR_Moroccan_spahis:0 "Марокканские спаги"
 MOR_Moroccan_spahis_desc:0 "Традиции марокканских всадников насчитывают столетия, но на полях сражений двадцатого века одной отваги недостаточно. Наши полки спагов должны быть переформированы по самым строгим регулярным стандартам. Эти гордые сыны Марокко, пересевшие с коней на лёгкие бронеавтомобили, станут глазами и ушами нашей армии. Обладая непревзойденной мобильностью, они смогут мгновенно перебрасываться на уязвимые участки фронта или жестко пресекать любые попытки бунта в далеких провинциях. Спаги — это карающий и стремительный клинок Султаната Будет получена моторизированная дивизия на 8 касок с 4 уровнем опыта. Дает скидку 50% на исследование бронеавтомобилей. НД «Марокканская армия» получит: увеличение максимальной скорости кавалерийских и моторизованных шаблонов на +10%. _____________________________________________________________________________ ИСТОРИЧЕСКАЯ ВЕТКА ПРОТЕКТОРАТА"
 MOR_Arsenal_in_Casablanca:0 "Арсенал в Касабланке"
 MOR_Arsenal_in_Casablanca_desc:0 "Армия не может сражаться без патронов и снарядов, а возить каждый винтовочный затвор из Марселя в условиях мировой войны — непозволительная роскошь. Касабланка с её развитым портом и промышленной базой станет сердцем нашей военной индустрии. На базе местных мастерских мы заложим центральный Марокканский арсенал. Это предприятие обеспечит бесперебойный ремонт техники, модернизацию французского оружия и собственное производство боеприпасов. Наша независимость и боеспособность должны коваться на наших собственных заводах + 1 военный завод в стейте 806"
 MOR_Secure_support_of_the_kings:0 "Заручиться поддержкой королей"
 MOR_Secure_support_of_the_kings_desc:0 "Чтобы удержать власть и защитить суверенитет Марокко, нам жизненно необходима сильная легитимация на международной арене. И здесь решающую роль сыграют давние личные связи нового министра. Абдельхалек Торрес, долгие годы координировавший антиколониальную борьбу, лично знаком с ключевыми фигурами арабского мира. Торрес задействует свои старые контакты при королевском дворе Египта, а также выйдет на прямую связь с Саудитами в Эр-Рияде и Хашимитами в Аммане и Багдаде. +10% стабильности, +50 полит власти. Если Ирак не левый, то обе страны получат модификатор отношений «Общий курс на освобождение арабов» +50 отношений Ирака к Марокко и наоборот. Если Сауды у власти, то обе страны получат модификатор отношений «Общий курс на освобождение арабов» +50 отношений Саудовской Аравии к Марокко и наоборот. Если Ливан не левый, то обе страны получат модификатор отношений «Общий курс на освобождение арабов» +50 отношений Ливана к Марокко и наоборот. Иордания существует, то обе страны получат модификатор отношений «Общий курс на освобождение арабов» +50 отношений Иордании к Марокко и наоборот."
 MOR_Secure_support_of_the_Andalusian_nobility:0 "Заручиться поддержкой потомков Аль-Андалусской знати"
 MOR_Secure_support_of_the_Andalusian_nobility_desc:0 "Абдельхалек Торрес, сам являющийся потомком знатного андалусского рода, бежавшего из Испании много веков назад, протягивает руку элите страны. Вернув былое влияние старой андалусской знати (морискам) Тетуана, Феса и Рабата, веками составлявшей интеллектуальное, судебное и торговое ядро Марокко. Объединив реформаторский запал Севера с вековым авторитетом консервативных элит и аристократии, мы создадим дополнительную опору для власти! Поддержка партии фашизм +5%, +НД «Консенсус с Андалусской знатью»: +0,15 к приросту полит власти. Сиди Ахмед Бен аль-Ахмар (Ahmed Bin al-Ahmar), Али Бен аль-Ахмар (Ali Bin al-Ahmar) - станут доступны как министры. Мухаммад Бен аль-Ахмар (Mohammed Bin al-Ahmar) станет доступен как генерал (2 уровень, 2 атаки, 2 обороны, 1 логистики, 2 планирования, трейт на горы и зиму. Так же будет доступен как военный министр: диверсионные войска."
 MOR_Return_to_active_tangerine_trade:0 "Вернуться к активной торговле мандаринами"
 MOR_Return_to_active_tangerine_trade_desc:0 "Марокканские мандарины и клементины веками славились своим уникальным вкусом по всей Европе и миру. Гражданская война в Испании и война за независимость Марокко нанесли сокрушительный удар по нашему аграрному сектору, но цитрусовые — это настоящее „золото“ марокканской земли. Мы восстановим оросительные каналы, выделим государственные субсидии владельцам плантаций и заключим новые масштабные торговые соглашения с крупнейшими державами. Экспорт сочных плодов поднимет доходы крестьян и наполнит государственную казну. +НД «Экспорт мандаринов»: Фабрики, приобретаемые от торговли +10%, -5% ФНП."
 MOR_Begin_the_path_of_industrialization:0 "Начать путь индустриализации Марокко"
 MOR_Begin_the_path_of_industrialization_desc:0 "Столетиями великое Марокко оставалось в глазах европейских держав лишь источником дешевого зерна, рыбы и сырой руды. Французский протекторат намеренно консервировал нашу отсталость, превращая медины и деревни в нищие анклавы, полностью зависимые от поставок промышленных товаров из Марселя и Парижа. Но мир стремительно меняется, и мы должны использовать этот исторический шанс. Объединив ресурсы Султаната, волю Махзена и энергию нашего народа, мы объявляем о начале Первой марокканской индустриализации. Мы построим собственные заводы, проведем дороги, укротим реки и докажем всему миру, что Марокко способно обеспечивать себя само. +НД «Первая Марокканская индустриализация» на 5 лет: +20% к скорости строительства, +15% свободных слотов в ячейках, -10% ФНП. НД «Аграрная страна» получит: Ежемесячный прирост населения -10%, военнообязанное население +0,1%, -1% ФНП, скорость строительства +1%, +1% макс. эффективности производства"
 MOR_Integrate_french_institutions_into_education:0 "Интегрировать Французские учреждения в новую систему образования"
 MOR_Integrate_french_institutions_into_education_desc:0 "Французские колонизаторы построили на нашей земле великолепные лицеи, лаборатории и исследовательские центры, но превратили их в закрытые замки, куда марокканцам путь был заказан. Мы не собираемся разрушать то, что было создано на налоги нашего же народа. Мы поступим мудрее — интегрируем французские учреждения в единую систему образования. Все колониальные лицеи, включая медицинские факультеты и отделения Института Пастера, отныне переходят под прямой контроль министерства просвещения Султаната. Французским профессорам и ученым, которые согласятся принять новые учебные программы и присягнуть новому правительству, будут сохранены их оклады и привилегии. Мы заставим передовую европейскую науку работать на благо Марокко. НД «Необразованное население» получит +5% к темпам изучения. +НД «Траты на образования»: +10% ФНП и -10% прироста полит власти на 360 дней."
 MOR_Introduce_the_Moroccan_dirham:0 "Внедрить Марокканский дирхам"
 MOR_Introduce_the_Moroccan_dirham_desc:0 "Пока наши рынки и заводы наводнены франками, наша независимость остается иллюзией. Колониальный франк — это цепь, которой Париж привязывал богатства Марокко к своему тонущему кораблю. Опираясь на авторитет новосозданного Государственного банка, мы объявляем о возвращении нашей законной исторической валюты — марокканского дирхама. Отныне все налоги, сделки внутри страны, зарплаты рабочих на оборонных заводах Мекнеса и выплаты феллахам будут производиться исключительно в дирхамах. Французский франк объявляется иностранной валютой. Мы берем под контроль собственный печатный станок, защищая Марокко от военной инфляции Европы и создавая финансовый щит для нашей будущей свободы НД «Государственный банк Марокко» получит: -5% ФНП, +5% прироста полит власти."
 MOR_Build_our_own_defense_industry:0 "Создание собственных ВПК"
 MOR_Build_our_own_defense_industry_desc:0 "Пока оружие приходит из Франции, мы уязвимы. Собственный военный завод и конструкторские бюро первый шаг к настоящей независимости."
 MOR_Create_a_new_general_staff:0 "Создание нового генерального штаба"
 MOR_Create_a_new_general_staff_desc:0 "До сегодняшнего дня стратегическое планирование в протекторате оставалось исключительной монополией французских офицеров, видевших в марокканцах лишь пушечное мясо. Мы создаем собственный, Генеральный штаб в Рабате. В его залах за одной картой сойдутся боевые ветераны-гумьеры, блестящие военные инженеры, знатоки Сахары и молодые аналитики, прошедшие реформированный Аль-Карауин. Больше наши планы не будут утверждаться в Париже. Новый штаб разработает доктрины маневренной пустынной и горной войны, подчинит себе логистику Южной железной дороги и подготовит детальные директивы по освобождению арабов от колонизаторов. НД «Марокканская армия» получит: +20 максимума командных очков, +20% прирост командных очков, +10% скорости планирования, +10% максимума планирования."
 MOR_Reform_of_al_Qarawiyyin:0 "Реформа Аль-Карауина"
 MOR_Reform_of_al_Qarawiyyin_desc:0 "Священные стены Аль-Карауина в Фесе веками хранили свет исламской мысли и оберегали идентичность нашего народа от чужеземного влияния. Однако в эпоху танков, радио и тотальной войны мы не можем позволить нашему старейшему университету оставаться лишь памятником былых эпох. Мы проведем масштабную реформу Аль-Карауина: сохраняя его незыблемый духовный авторитет, мы введем в учебную программу современные инженерные дисциплины, политэкономию, международное право и иностранные языки. Объединив глубокую религиозную мораль с передовой наукой, Аль-Карауин станет кузницей новой марокканской элиты — дипломатов, судей и администраторов, которые будут защищать независимый Султанат не только верой, но и острым современным умом. +1 ячейка исследований, +НД «Траты на образования»: +10% ФНП и -10% прироста полит власти на 180 дней."
 MOR_Open_the_country_to_foreign_banks:0 "Пустить иностранные банки в страну"
 MOR_Open_the_country_to_foreign_banks_desc:0 "Мы открываем марокканские рынки для крупнейших финансовых институтов Соединенных Штатов, Британской империи и других возможных инвесторов. Позволив банкирам открывать свои филиалы в Касабланке и Фесе, мы привлечем колоссальные иностранные кредиты на закупку передового оборудования и станков. Более того, когда Уолл-стрит и Сити вложат миллионы в наши фосфатные конвейеры и верфи, Вашингтон и Лондон костьми лягут, но не позволят Франции развязать против нас новую войну. Их доллары и фунты станут лучшей броней для нашей независимости НД «Государственный банк Марокко» получит: +20% фабрик от торговли, +20% влияния на торговые сделки _____________________________________________________________________________ АРМИЯ"
 MOR_Organize_the_air_force_of_Morocco:0 "Организовать ВВС Марокко"
 MOR_Organize_the_air_force_of_Morocco_desc:0 "Современная война выигрывается не только в ущельях Атласа и песках Сахары, но и в бескрайнем небе над ними. До сих пор воздушное пространство нашего Султаната безраздельно контролировалось французскими эскадрильями, готовыми обрушить бомбы на любую непокорную деревню. Этому господству пора положить конец. Используя золото нашего Государственного банка и доллары из новых иностранных филиалов Касабланки, мы инициируем создание Военно-воздушных сил Марокко. На базе аэродромов Рабата и Феса мы развернем первые учебные центры для марокканских пилотов и техников. Мы начнем закупку современных истребителей и легких бомбардировщиков, способных прикрыть наши заводы в Мекнесе с воздуха и обеспечить штурмовую поддержку Шерифской гвардии в грядущих битвах. +30 очков опыта ВВС, НД «Марокканская армия» получит: -10% стоимости доктрин ВВС"
 MOR_Found_the_navy_of_Morocco:0 "Основать ВМФ Марокко"
 MOR_Found_the_navy_of_Morocco_desc:0 "Марокко омывается водами Атлантического океана и Средиземного моря, но до сегодняшнего дня наши порты и прибрежные воды оставались беззащитны перед иностранными орудиями. Французский флот чувствует себя здесь как дома, но если мы хотим и дальше отстаивать свою независимость, мы должны запереть наши морские ворота для колонизаторов. Используя прибыли от экспорта фосфатов, мы закладываем основу Военно-морского флота Марокко. На верфях Касабланки начнется строительство первых патрульных кораблей, тральщиков и быстроходных торпедных катеров. Мы заминируем ключевые подходы к побережью и обучим наших матросов противолодочной и противокорабельной борьбе. Океан больше не будет дорогой для вражеских интервентов — он станет непреодолимым рвом для защиты Марокко. +30 очков опыта ВМФ, НД «Марокканская армия» получит: -10% стоимости доктрин ВМФ"
