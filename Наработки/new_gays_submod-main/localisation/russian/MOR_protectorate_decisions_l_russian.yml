l_russian:
 MOR_protectorate_administration_category: "Деятельность специального управления протекторатами"
 MOR_protectorate_administration_category_desc: "Управление колониальными землями поручено Министерству колоний, но Тунис и Марокко — протектораты, а значит ведутся Министерством иностранных дел. При нём создано отдельное подразделение, контролирующее деятельность протекторатов: именно через него Париж влияет на генерал-резидентов и на общую картину происходящего в протекторатах."
 MOR_recall_ponsot: "Отстранить мягкосердечного Понсо с поста генерал-резидента Марокко"
 MOR_recall_ponsot_desc: "Понсо — дипломат, а не военный, и там, где требовался жёсткий ответ, он пытался лавировать. Для Парижа такая мягкость грозит потерей протектората, так что резидента стоит заменить человеком, уже подавлявшим националистов в Тунисе. Исторически решение принято 22 марта 1936 года."
 MOR_recall_peyrouton: "Отстранить Пейрутона от управления Марокко"
 MOR_recall_peyrouton_desc: "«Резидент-сатрап» не идёт на компромиссы даже там, где они дешевле крови: его отказ продвигать трудовую реформу срывает всю линию Парижа. Пора ставить на его место военного, который умеет и воевать, и договариваться. Исторически решение принято 16 сентября 1936 года."
 mor_resident.1.t: "Огюст Анри Понсо снят с поста генерал-резидента Марокко"
 mor_resident.1.d: "Правительство Французской Республики официально сместило Огюста Анри Понсо с должности генерал-резидента из-за чрезмерно мягкой политики в отношении марокканских националистов. Пару лет назад местные элиты предоставили «План марокканских реформ», и Понсо, будучи не военным, а дипломатом, попытался лавировать там, где требовался жёсткий ответ.\n\nОчевидно, такая слабость могла привести к потере Францией протектората, что было недопустимо.\n\nЧтобы навести в Марокко жёсткий порядок и пресечь политическую активность местных элит, Париж решил заменить Понсо на Марселя Пейрутона. Пейрутон до этого «прославился» беспощадным и эффективным подавлением националистического движения в Тунисе — и, вероятно, справится и с этими проблемами."
 mor_resident.1.a: "Нам нужны крепкие руки в протекторатах"
 mor_resident.1.a.tt: "Марокко: влияние султана теряет 10 %, автономия теряет 100 очков, а авторитарную силу протектората возглавляет Бернар Марсель Пейрутон."
 mor_resident.1.b: "Договориться с этим человеком будет гораздо труднее"
 mor_resident.2.t: "Пейрутон отстранён от управления Марокко"
 mor_resident.2.d: "Едва получив назначение, Пейрутон довольно быстро подтвердил своё прозвище «резидента-сатрапа». За свой не самый длительный срок пребывания на посту генерал-резидента большая часть марокканцев начала его ненавидеть, а оставшиеся были готовы пристрелить его при встрече.\n\nК сожалению для французского правительства, он не шёл даже на минимальные компромиссы с правительством, отказываясь продвигать трудовую реформу. Это было недопустимо, и потому Пейрутона быстро уволили с поста генерал-резидента, назначив более лояльного Шарля Ногеса — тот не только лучше воевал, будучи участником Рифской кампании, но и был более гибким политиком."
 mor_resident.2.a: "Нам нужен целый протекторат, а не руины"
 mor_resident.2.a.tt: "Марокко: влияние султана теряет 10 %, а авторитарную силу протектората возглавляет Шарль Ногес."
 mor_resident.2.b: "Мы можем немного выдохнуть!"
 mor_resident.2.b.tt: "Шарль Ногес уходит из французского генералитета и становится фельдмаршалом Марокко."
 mor_autonomy_reason_peyrouton: "Назначение Пейрутона генерал-резидентом"
