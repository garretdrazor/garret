l_russian:
 mor_agrarian_country: "Аграрная страна"
 mor_agrarian_country_desc: "Несмотря на аграрные реформы внутри управления Марокко, Франция подавляет любые попытки индустриализации, оставляя тяжёлую и военную промышленность в своём ведении. Технологические новинки в фермерстве также остаются уделом колонизаторов, тогда как феллахи вынуждены обходиться ручным трудом."
 mor_uneducated_population: "Необразованное население"
 mor_uneducated_population_desc: "Была предпринята попытка максимально снизить влияние ислама на население. В первую очередь это коснулось берберов, которые, как считалось, были менее исламизированы, чем арабы. Начиная с 1914 г. этой цели была посвящена специальная берберская политика, в рамках которой берберские районы вышли из-под контроля махзена. Также в рамках этой политики закрывались коранические и арабские школы. При этом власти ничего не делали, чтобы открыть взамен их французские. В результате к 1936 г. школы посещали не более 2% детей."
 mor_divided_country: "Разорванная страна"
 mor_divided_country_desc: "Испания и Франция фактически разорвали нашу страну на две части. Большая часть, ставшая протекторатом Франции, стала называться Марокко, тогда как Сахара, юг и Рифские горы перешли к Испании, получив название Южного Марокко. Однако это деление только сильнее сплотило марокканцев в новой цели — вновь объединить свою страну.\n§RПропадёт, как только Марокко будет объединено.§!"
 mor_treaty_of_fes_violated: "Попранный Фесский договор"
 mor_treaty_of_fes_violated_desc: "Фесский договор был подписан под принуждением султаном Марокко Абд аль-Хафидом и французским дипломатом Эженом Рено 30 марта 1912 года. Он установил французский протекторат в Марокко и дал Франции право оккупировать определённые части страны под предлогом защиты султана от внутренней оппозиции и фактически удерживать власть, сохраняя при этом маску косвенного правления, состоящую из султана и правительства шарифов. Согласно условиям договора французский генерал-резидент обладал абсолютной властью как во внешних, так и во внутренних делах и был единственным, кто мог представлять Марокко в зарубежных странах. Однако султан сохранял за собой право подписывать дахиры, которые представляли генерал-резиденты. На данный момент, пользуясь молодостью султана и отсутствием влияния марокканцев в правительстве, французы давно плюют на Фесский договор, едва не переходя к прямому управлению. А националисты в 1934 г. представили договор, который должен исправить перекосы в сторону Франции.\n§RПропадёт, как только Марокко получит независимость.§!"
 mor_broken_army: "Марокканская армия"
 mor_broken_army_desc: "Сухопутная армия Марокко времён протектората искусно передаёт ужасное состояние, в котором она находилась в те времена. Этот исторический период имел огромное значение для Марокко и его народа, однако судьба армии оставляла желать лучшего. Время протектората характеризовалось несправедливым вмешательством иностранных держав в дела Марокко. Это оказало негативное влияние на развитие и подготовку вооружённых сил страны. Армия страдала от отсутствия современного оружия, амуниции, обученного персонала и необходимой тактической подготовки. Дефицит средств и ограниченные ресурсы привели к неэффективной деятельности армии. Военная база и инфраструктура были в плачевном состоянии, что ограничивало возможности тренировок, мобильности и коммуникации. Отсутствие достаточного финансирования привело к недостаточной заботе о здоровье и благополучии солдат, что повлекло за собой низкую боеспособность и дисциплину."

 # ------------------------------------------------------------
 #  Шаг 9. Духи «Красного июня», ноябрьского кризиса и неурожая.
 #  Выдаются событиями events/MOR dated events (Morocco).txt
 # ------------------------------------------------------------
 mor_aftermath_of_red_june_light: "Последствия красного июня"
 mor_aftermath_of_red_june_light_desc: "Забастовка COSUMA парализовала портовую промышленность Касабланки, а уступки её вожакам стоили казне и репутации. Ремонт доков и фабрик идёт медленно, а население убедилось, что улицу можно слушаться.\n§RСкорость строительства -10%, стабильность -5%.§!"
 mor_aftermath_of_red_june_medium: "Последствия красного июня"
 mor_aftermath_of_red_june_medium_desc: "Чтобы открыть рудники Хурибги, пришлось согласиться на профсоюзы и надбавки. Фосфат пошёл на экспорт, но цена этих уступок ложится на всю экономику протектората.\n§RСкорость строительства -10%, стабильность -10%, эффективность добычи ресурсов -50%.§!"
 mor_aftermath_of_red_june_heavy: "Последствия красного июня"
 mor_aftermath_of_red_june_heavy_desc: "Страна уступила всё, чего требовал «Красный июнь». Административный аппарат деморализован, заказы заморожены, а рудники Атласа работают вполсилы — и это ещё скромная цена за отсутствие баррикад.\n§RСкорость строительства -15%, стабильность -15%, эффективность добычи ресурсов -75%.§!"
 mor_workers_unrest_in_casablanca: "Рабочие волнения в Касабланке"
 mor_workers_unrest_in_casablanca_desc: "Дубинки и штыки разогнали пикеты, но не отменили причин забастовки. Цеха работают вполнакала: мастера боятся станков, а мастера-марокканцы — своих рабочих.\n§RМаксимум и рост эффективности производства -10%, стабильность -5%.§!"
 mor_workers_unrest_in_casablanca_and_atlas: "Рабочие волнения в Касабланке и Атласе"
 mor_workers_unrest_in_casablanca_and_atlas_desc: "Иностранный легион вернул шахты, но отправил в горы Атлас сразу несколько тысяч похоронных процессий. добыча фосфатов встала, а каждая попытка пустить поезд под откос напоминает нам о Хурибге.\n§RМаксимум и рост эффективности производства -15%, стабильность -10%, эффективность добычи ресурсов -100%.§!"
 mor_communist_split_from_fcp: "Отделение коммунистической партии от ФКП"
 mor_communist_split_from_fcp_desc: "Тайный съезд в трущобах Касабланки порвал с Парижем: марокканские коммунисты больше не секция ФКП, а партия с собственной программой и собственными профсоюзами. Для рабочего класса это звучит убедительнее любых резолюций резидентуры.\n§RПрирост коммунизма +0,2 в сутки.§!"
 mor_november_crisis: "Ноябрьский кризис"
 mor_november_crisis_desc: "Мы должны определиться со своим отношением к националистам, до того, как нам придётся принимать решение. Рабат, Фес и Марракеш ждут ответа на «План реформ», а каждый день промедления убеждает марокканцев, что резидентуру можно продавить улицей.\n§RСтабильность -10%, прирост политической власти -25%.§!"
 mor_harvest_failure: "Неурожайный год"
 mor_harvest_failure_desc: "Дождя не было. Регулирование цен на хлеб и муку спасло города от спекулянтов, но не спасло феллахов: без дотаций и посевного зерна деревня проедает семенной фонд, а приписки о сборе урожая всё меньше похожи на правду.\n§RПрирост населения -50%, стабильность -10%.§!"

