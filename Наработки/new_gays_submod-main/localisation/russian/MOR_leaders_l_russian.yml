l_russian:
 MOR_mohammed_v: "Мухаммед V"
 MOR_mohammed_v_desc: "Династия Алауитов издавна относится к шерифам — прямым потомкам пророка Мухаммеда, через его внука Хасана. В Марокко это давало правителям не только светскую, но и высшую духовную власть повелителя правоверных, что делало их фигуру неприкосновенной для религиозного населения и берберских племён. Сиди Мухаммед бен Юсуф произошёл именно из этой династии и был возведён на трон французами в 1927 году, в обход его старших братьев, так как колониальная администрация посчитала молодого султана слабым и управляемым. Сейчас, в 1936 году, он скован по рукам и ногам условиями Фесского договора, а реальная власть в Рабате принадлежит французскому генерал-резиденту. Однако под маской покорности скрывается амбициозный правитель. Султан начинает тайно сочувствовать «Комитету национального действия» и их Плану реформ. В то время как Франция считает его своей надёжной марионеткой, марокканский народ всё чаще видит в молодом монархе единственную легитимную силу, способную в будущем вернуть стране былую независимость."
 MOR_auguste_henri_ponsot: "Огюст Анри Понсо"
 MOR_auguste_henri_ponsot_desc: "Огюст Анри Понсо — французский дипломат, а не военный, тем не менее, ему доверили столь важный пост. Свою карьеру он начал в Бангкоке, после стал посланником при правительстве Сиама. С 1926 по 1933 год он занимал пост Верховного комиссара мандата Лиги Наций по Сирии и Ливану, где полностью поддерживал французскую власть, игнорируя требования местных повстанцев. Покинув этот пост, с 14 сентября 1933 года Понсо занял должность генерал-резидента Франции в Марокко и занимает её по сей день."
 MOR_bernard_marcel_peyrouton: "Бернар Марсель Пейрутон"
 MOR_bernard_marcel_peyrouton_desc: "Имеющий докторскую степень по праву и отслужив военную службу, Марсель сдал конкурсный экзамен в Министерство колоний, после чего получил своё первое назначение на Таити в качестве начальника штаба губернатора. Во время Первой мировой он успел получить ранение и послужить на Дарданеллах, после чего успел послужить в ряде колониальных владений Северной Африки, пока его не назначили генерал-резидентом в Марокко."
 MOR_charles_nogues: "Шарль Ногес"
 MOR_charles_nogues_desc: "Прошедший Первую мировую войну в качестве артиллериста, Ногес продолжил военную карьеру и участвовал в Рифской кампании, по итогам которой получил звание генерал-майора. Он полностью предан Франции и потому намерен поддерживать её интересы."
 MOR_mohammed_sallal_al_fassi: "Мухаммед Саллаль Аль-Фасси"
 MOR_mohammed_sallal_al_fassi_desc: "Саллаль аль-Фаси — блестящий выпускник и преподаватель древнего мусульманского университета Аль-Карауин, поэт и богослов, ставший главным идеологом марокканского национализма. В 1936 году, на фоне прихода к власти левого Народного фронта во Франции, аль-Фаси разворачивает бурную деятельность в Касабланке и Фесе, превращая разрозненные кружки интеллигенции в мощную политическую силу — «Блок национального действия». Он отвергает полумеры и требует от Парижа строгого соблюдения Фесского договора, который французы превратили в прямую колонизацию. Обладая феноменальным ораторским даром, аль-Фаси поднял на протест как студентов, так и рабочих. Даже Мухаммед V не устоял, оказывая ему всесильную поддержку, что и привело к смещению политического вектора в Марокко."
 MOR_mohamed_hassan_el_ouazzani: "Мухаммед Хасан аль-Уаззани"
 MOR_mohamed_hassan_el_ouazzani_desc: "Мухаммед Хасан аль-Уаззани олицетворяет собой либеральное и модернизаторское крыло марокканского протеста. Окончив престижную Школу политических наук в Париже, аль-Уаззани впитал ценности европейской демократии и свободы печати, которые теперь намерен применить против самих же колонизаторов. Он требует создания суверенного Марокко с сильным парламентом, конституцией и гражданскими свободами. Для французских властей в Рабате этот блестящий журналист и редактор газеты «L'Action Marocaine» представляет огромную угрозу, ведь он бьёт по Парижу его же собственным главным оружием — идеалами Великой французской революции."
 MOR_leon_sultan: "Леон Сультан"
 MOR_leon_sultan_desc: "Адвокат еврейского происхождения, родившийся в Алжире и переехавший в Касабланку, Леон Сультан является главным интеллектуалом и движущей силой марксизма в Марокко. В 1936 году, после событий красного июня, он покинул Французскую коммунистическую партию и создал Марокканскую коммунистическую партию. Установив в Марокко коммунистический строй, он верит, что подлинное освобождение страны возможно только через союз арабских и берберских рабочих, преодоление религиозных барьеров и полный демонтаж как французского колониализма, так и феодальной системы султаната."
 MOR_abdelkhalek_torres: "Абдельхалек Торрес"
 MOR_abdelkhalek_torres_desc: "Пламенный оратор, интеллектуал и бьющееся сердце марокканского национально-освободительного движения в испанской зоне протектората. Будучи сыном высокопоставленного судьи из Тетуана, Торрес получил прекрасное образование как в религиозных школах Марокко, так и в университетах Каира и Мадрида. Это позволило ему в совершенстве понять образ мыслей европейских колонизаторов. Основанная им Партия марокканских реформ лавировала на грани легальности в Северном Марокко. Торрес — мастер политического компромисса: он готов временно сотрудничать с испанскими властями, если это приблизит автономию Марокко, но его конечная цель неизменна — полный суверенитет и объединение страны под властью султана. И это принесло результаты. После того как Испанское Марокко вернулось под руку султана, он принял этих националистов в своё правительство, что усилило влияние Национальной партии, итогом чего стал тихий переворот Торреса в правительстве. Первым делом Торрес заверил султана в полной поддержке его и национальных устремлений."
